   ============================================================ */
function renderStats(A){
  const ca=data.factures.filter(fa=>fa.statut==="Payé").reduce((a,fa)=>a+(+fa.total_ttc||0),0);
  const impaye=data.factures.filter(fa=>fa.statut!=="Payé").reduce((a,fa)=>a+(+fa.total_ttc||0),0);
  const totalDep=data.depenses.reduce((a,d)=>a+(+d.montant||0),0);
  const benefice=ca-totalDep;

  // 1. Calcul de la répartition des dépenses par catégorie
  const depensesParCat = {};
  data.depenses.forEach(d => {
    const cat = d.categorie || "Autres dépenses";
    depensesParCat[cat] = (depensesParCat[cat] || 0) + (+d.montant || 0);
  });
  
  const categories = Object.keys(depensesParCat).sort((a,b) => depensesParCat[b] - depensesParCat[a]);
  const depValues = categories.map(c => depensesParCat[c]);

  // Couleurs fixes pour correspondre à l'image
  const colors = ['#0055ff', '#00b050', '#ff9900', '#e50914', '#9933ff', '#06b6d4', '#ec4899'];

  // 2. Génération de la légende HTML
  let legendHTML = "";
  categories.forEach((cat, index) => {
    const val = depensesParCat[cat];
    const pct = totalDep > 0 ? Math.round((val / totalDep) * 100) : 0;
    const color = colors[index % colors.length];
    legendHTML += `
      <div class="legend-row">
        <div class="legend-color-box" style="background:${color}"></div>
        <div class="legend-name">${e(cat)}</div>
        <div class="legend-amount">${f(val)}</div>
        <div class="legend-percent">${pct} %</div>
      </div>
    `;
  });

  // 3. Calcul de l'évolution mensuelle (6 derniers mois)
  const monthNames = ["Janv.", "Févr.", "Mars", "Avr.", "Mai", "Juin", "Juil.", "Août", "Sept.", "Oct.", "Nov.", "Déc."];
  const last6Months = [];
  const barValues = [];
  const barLabels = [];
  
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    const m = d.getMonth();
    const y = d.getFullYear();
    const label = `${monthNames[m]} ${y}`;
    const monthStr = `${y}-${String(m + 1).padStart(2, '0')}`;
    
    const totalMois = data.depenses
      .filter(dep => dep.date_depense && dep.date_depense.startsWith(monthStr))
      .reduce((sum, dep) => sum + (+dep.montant || 0), 0);
      
    barLabels.push(label);
    barValues.push(totalMois);
  }

  // 4. Rendu HTML
  A.innerHTML=`
  <div class="page-header"><div class="page-header-actions"><div><h2><i class="fa-solid fa-chart-line"></i> Statistiques</h2><p>Analyse de l'activité</p></div></div></div>
  
  <div class="kpi-grid">
    <div class="kpi-card green"><div class="kpi-label">CA encaissé</div><div class="kpi-value" style="color:var(--ok)">${f(ca)}</div></div>
    <div class="kpi-card orange"><div class="kpi-label">Impayés</div><div class="kpi-value" style="color:var(--warn)">${f(impaye)}</div></div>
    <div class="kpi-card" style="border-top:4px solid var(--r)"><div class="kpi-label">Dépenses</div><div class="kpi-value" style="color:var(--r)">${f(totalDep)}</div></div>
    <div class="kpi-card blue"><div class="kpi-label">Bénéfice</div><div class="kpi-value" style="color:${benefice>=0?'var(--ok)':'var(--r)'}">${f(benefice)}</div></div>
  </div>

  <!-- NOUVEAU BLOC STATISTIQUES DEPENSES -->
  <div class="stats-dashboard-card">
    <div class="stats-dashboard-header">
      <i class="fa-solid fa-chart-column"></i> Répartition des dépenses
    </div>
    
    <div class="stats-dashboard-grid">
      
      <!-- Donut Chart -->
      <div class="donut-wrapper">
        <canvas id="chartDoughnut"></canvas>
        <div class="donut-center-text">
          <div class="label">Total</div>
          <div class="amount">${f(totalDep).replace(' GNF','')}</div>
          <div class="currency">GNF</div>
        </div>
      </div>

      <!-- Légende -->
      <div class="stats-custom-legend">
        ${legendHTML || '<div style="color:#a1a1aa;text-align:center;">Aucune dépense enregistrée</div>'}
      </div>

      <!-- Bar Chart -->
      <div class="bar-chart-container">
        <div class="bar-chart-header">
          <i class="fa-regular fa-calendar"></i> Évolution mensuelle des dépenses
        </div>
        <div class="bar-chart-wrapper">
          <canvas id="chartBarMonthly"></canvas>
        </div>
      </div>

    </div>
  </div>`;

  // 5. Initialisation des graphiques Chart.js
  setTimeout(() => {
    // -- Graphique Donut --
    const ctxDonut = document.getElementById('chartDoughnut');
    if (ctxDonut && totalDep > 0) {
      new Chart(ctxDonut, {
        type: 'doughnut',
        data: {
          labels: categories,
          datasets: [{
            data: depValues,
            backgroundColor: colors,
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '65%', // Pour faire le trou au centre
          plugins: {
            legend: { display: false }, // On utilise notre légende custom
            tooltip: {
              callbacks: {
                label: function(context) {
                  let value = context.raw;
                  let total = context.dataset.data.reduce((a, b) => a + b, 0);
                  let percentage = Math.round((value / total) * 100);
                  return ` ${f(value)} (${percentage}%)`;
                }
              }
            }
          }
        },
        plugins: [{
          // Plugin pour forcer l'affichage des % sur le donut comme sur l'image
          id: 'textCenter',
          beforeDraw: function(chart) {
            // On ne fait rien ici, le texte est géré par le HTML superposé
          }
        }]
      });
    }

    // -- Graphique Barres Mensuel --
    const ctxBar = document.getElementById('chartBarMonthly');
    if (ctxBar) {
      // Création d'un gradient rouge pour les barres
      const gradientRed = ctxBar.getContext('2d').createLinearGradient(0, 0, 0, 200);
      gradientRed.addColorStop(0, '#ff2d3b');
      gradientRed.addColorStop(1, '#990000');

      new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: barLabels,
          datasets: [{
            label: 'Dépenses',
            data: barValues,
            backgroundColor: gradientRed,
            borderRadius: 4,
            barPercentage: 0.6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return ` Dépenses: ${f(context.raw)}`;
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: '#a1a1aa', font: { size: 11 } }
            },
            y: {
              grid: { color: 'rgba(255,255,255,0.05)' },
              ticks: { 
                color: '#a1a1aa', 
                font: { size: 11 },
                callback: function(value) {
                  if (value >= 1000000) return (value / 1000000).toFixed(1) + ' M';
                  if (value >= 1000) return (value / 1000).toFixed(0) + ' k';
                  return value;
                }
              }
            }
          }
        },
        // Plugin pour afficher les valeurs au-dessus des barres
        plugins: [{
          id: 'topLabel',
          afterDatasetsDraw(chart) {
            const { ctx, data } = chart;
            ctx.save();
            ctx.font = 'bold 11px Inter, sans-serif';
            ctx.fillStyle = '#fff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            chart.getDatasetMeta(0).data.forEach((datapoint, index) => {
              const val = data.datasets[0].data[index];
              if (val > 0) {
                let text = val >= 1000000 ? (val / 1000000).toFixed(1).replace('.', ',') + ' M' : val.toLocaleString('fr-FR');
                ctx.fillText(text, datapoint.x, datapoint.y - 5);
              }
            });
            ctx.restore();
          }
        }]
      });
    }
  }, 100);
}

function previewLogo(input) {
  if (input.files && input.files[0]) {
    const file = input.files[0];
    
    // Vérification de la taille (max 2 Mo)
    if (file.size > 2 * 1024 * 1024) {
      toast("L'image est trop lourde (max 2 Mo).", "error");
      return;
    }
    
    const reader = new FileReader();
    reader.onload = function (e) {
      // Affichage immédiat dans la case
      document.getElementById('img_logo_preview').src = e.target.result;
      // Stockage temporaire dans les données pour la sauvegarde
      data.params.logo_base64 = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}
async function sauvegarderParams(){
  const keys = ['nom_entreprise', 'statut', 'nif', 'rccm', 'adresse', 'tel', 'email', 'tva_taux', 'devise'];
  const ids = ['par_nom', 'par_statut', 'par_nif', 'par_rccm', 'par_adr', 'par_tel', 'par_email', 'par_tva', 'par_devise'];
  
  try {
    // 1. Sauvegarde des champs texte
    for(let i=0; i<keys.length; i++){
      const el = $(ids[i]);
      if(!el) continue;
      
      const val = el.value;
      await supa.from("parametres").upsert({cle:keys[i], valeur:val}, {onConflict:'cle'});
      data.params[keys[i]] = val;
    }
    
    // 2. Sauvegarde du Logo s'il a été modifié
    if (data.params.logo_base64) {
      await supa.from("parametres").upsert({cle: 'logo_base64', valeur: data.params.logo_base64}, {onConflict:'cle'});
      // Met à jour la variable globale pour les autres pages
      LOGO_URL = data.params.logo_base64;
    }
    
    toast("Paramètres enregistrés avec succès !");
  } catch(err) {
    console.error(err);
    toast("Erreur : " + err.message, "error");
  }
}

    tbody td:nth-child(3), tbody td:nth-child(4) { text-align: right; font-weight: 600; }
    tbody tr:nth-child(even) { background: #fafafa; }
    
    /* Totaux */
    .totals-box { margin: 20px 30px 0; float: right; width: 280px; }
    .total-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; color: #555; }
    .total-final { background: #e50914; color: #fff; padding: 12px 15px; font-size: 16px; font-weight: 900; margin-top: 10px; border-radius: 4px; text-transform: uppercase; }
    .reste-row { color: #e50914; font-weight: 700; margin-top: 8px; font-size: 13px; text-align: right; }
    
    /* Pied de page */
    .footer-msg { clear: both; margin-top: 50px; text-align: center; font-size: 12px; color: #888; font-style: italic; }
    .footer-msg b { color: #e50914; font-style: normal; }
</style>
</head>
<body>
<div class="page">
    <!-- EN-TÊTE NOIR -->
    <div class="header-black">
        <div class="header-top">
            <div class="brand">
                <h1>SPEED <span>GARAGE</span> PRO SARL</h1>
                <p>MÉCANIQUE • PIÈCES DÉTACHÉES</p>
                <div class="slogan">Votre partenaire automobile</div>
            </div>
            <img src="${entLogo}" alt="Logo" style="height: 70px; object-fit: contain;">
        </div>
        <div class="services-row">
            <div class="service-item"><div class="service-icon">🔧</div><span>Entretien<br>Réparation</span></div>
            <div class="service-item"><div class="service-icon">⚙️</div><span>Diagnostic<br>Auto</span></div>
            <div class="service-item"><div class="service-icon">🛞</div><span>Pneumatiques<br>& Équilibrage</span></div>
            <div class="service-item"><div class="service-icon">🔑</div><span>Décodage<br>de Clés</span></div>
        </div>
    </div>

    <!-- BARRE NUMÉRO FACTURE -->
    <div class="doc-info-bar">
        <div class="doc-meta">
            N° FACTURE : <b>${e(numero)}</b><br>
            Date d'émission : ${new Date().toLocaleDateString('fr-FR')}
        </div>
        <div class="doc-title-badge">${type}</div>
    </div>

    <!-- INFORMATIONS CLIENT & VÉHICULE -->
    <div class="info-grid">
        <div class="box-gray">
            <div class="box-label">SOCIÉTÉ</div>
            <div class="box-content">
                <b>${e(entNom)}</b><br>
                <span class="box-icon">📍</span> ${e(entAdr)}<br>
                <span class="box-icon">📞</span> ${e(entTel)}<br>
                <span class="box-icon">✉️</span> ${e(entEmail)}
            </div>
        </div>
        <div class="box-gray">
            <div class="box-label">INFORMATIONS CLIENT</div>
            <div class="box-content">
                Nom / Société : <b>${e(doc.client_nom||'—')}</b><br>
                Téléphone : ${e(doc.client_tel||'—')}<br>
                Adresse : ${e(doc.client_adr||'—')}
            </div>
        </div>
    </div>

    <div class="info-grid">
        <div class="box-gray" style="grid-column: span 2;">
            <div class="box-label">IDENTIFICATION DU VÉHICULE</div>
            <div class="box-content" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div><span class="box-icon">🚗</span> Marque / Modèle : <b>${e(doc.vehicule||'—')}</b></div>
                <div><span class="box-icon">🔢</span> Immatriculation : <b>${e(doc.immat||'—')}</b></div>
                <div><span class="box-icon">🆔</span> DIN / VIN : ${e(doc.vin||'—')}</div>
                <div><span class="box-icon">⏱️</span> Kilométrage : ${doc.kilometrage ? (+doc.kilometrage).toLocaleString('fr-FR')+' km' : '—'}</div>
            </div>
        </div>
    </div>

    <!-- TABLEAU PRESTATIONS -->
    <div class="table-wrap">
        <table>
            <thead><tr><th>DÉSIGNATION</th><th style="text-align:center">QTÉ</th><th>PU (GNF)</th><th>TOTAL (GNF)</th></tr></thead>
            <tbody>
            ${(doc.lignes||[]).map(l=>`<tr>
                <td>${e(l.d||'')}</td>
                <td style="text-align:center">${l.q||1}</td>
                <td>${(+l.p||0).toLocaleString('fr-FR')}</td>
                <td>${((+l.q||0)*(+l.p||0)).toLocaleString('fr-FR')}</td>
            </tr>`).join("")}
            </tbody>
        </table>
    </div>

    <!-- TOTAUX -->
    <div class="totals-box">
        <div class="total-row"><span>Sous-total HT :</span><b>${(+doc.total_ht||0).toLocaleString('fr-FR')}</b></div>
        <div class="total-row"><span>Remise :</span><b>0</b></div>
        <div class="total-final">TOTAL PAYÉ : ${ttc.toLocaleString('fr-FR')} GNF</div>
        
        ${acompte > 0 ? `
            <div class="total-row" style="margin-top:10px; border-top:2px solid #eee; padding-top:10px;">
                <span>Acompte versé :</span><b style="color:#10b981">${acompte.toLocaleString('fr-FR')}</b>
            </div>
            ${!estPayee ? `<div class="reste-row">RESTE À PAYER : ${reste.toLocaleString('fr-FR')} GNF</div>` : ''}
        ` : ''}
    </div>

    <!-- PIED DE PAGE -->
    <div class="footer-msg">
        Merci de votre confiance. À très bientôt chez <b>SPEED GARAGE PRO</b> !
    </div>
</div>
</body></html>`;
}
function printDoc(type, numero, doc){
    const html = buildDocHTML(type, numero, doc);
    const win = window.open('', '_blank');
    if(!win) { toast("Veuillez autoriser les pop-ups pour imprimer.", "error"); return; }
    win.document.write(html);
    win.document.close();
    setTimeout(() => win.print(), 800);
}
function printDevis(id){
    const d = data.devis.find(x => x.id === id);
    if(d) printDoc("DEVIS", d.numero, d);
}

function printFacture(id){
    const fa = data.factures.find(x => x.id === id);
    if(fa) printDoc("FACTURE", fa.numero, fa);
}

async function imprimerRecuDepot(clientId){
    const c = data.clients.find(x => x.id === clientId);
    if(!c){ toast("Client introuvable.", "error"); return; }
    const html = buildDocHTML("REÇU DE DÉPÔT", "RD-" + new Date().toISOString().slice(0,10), {
        client_nom: c.nom, vehicule: "Dépôt véhicule", immat: "", lignes: [], total_ht: 0, tva: 0, total_ttc: 0, acompte: 0
    });
    const win = window.open('', '_blank');
    win.document.write(html);
    win.document.close();
    setTimeout(() => win.print(), 800);
}

function envoyerWhatsAppDevis(id){
    const d = data.devis.find(x => x.id === id);
    if(!d) return;
    const client = data.clients.find(c => c.id === d.client_id);
    if(!client || !client.tel){ toast("Client sans téléphone.", "error"); return; }
    let tel = client.tel.replace(/\D/g,'');
    if(tel.length === 9) tel = "224" + tel;
    const reste = (+d.total_ttc||0) - (+d.acompte||0);
    let msg = `Bonjour ${client.nom},\n\nDevis *${d.numero}* chez *SPEED GARAGE PRO*.\n🚗 ${d.vehicule} (${d.immat})\n🛠️ ${d.motif||'—'}\n💰 Total : ${f(d.total_ttc)}\n`;
    if(d.acompte > 0) msg += `Acompte : ${f(d.acompte)}\nReste à payer : ${f(reste)}\n`;
    msg += `\nMerci de votre confiance.`;
    window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(msg), '_blank');
}

function envoyerWhatsAppFacture(id){
    const fa = data.factures.find(x => x.id === id);
    if(!fa) return;
    const client = data.clients.find(c => c.id === fa.client_id);
    if(!client || !client.tel){ toast("Client sans téléphone.", "error"); return; }
    let tel = client.tel.replace(/\D/g,'');
    if(tel.length === 9) tel = "224" + tel;
    const reste = (+fa.total_ttc||0) - (+fa.acompte||0);
    let msg = `Bonjour ${client.nom},\n\nFacture *${fa.numero}* chez *SPEED GARAGE PRO*.\n🚗 ${fa.vehicule} (${fa.immat})\n💰 Total : ${f(fa.total_ttc)}\n`;
    if(fa.acompte > 0) msg += `Acompte : ${f(fa.acompte)}\nReste à payer : ${f(reste)}\n`;
    msg += `\nMerci de votre confiance.`;
    window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(msg), '_blank');
}

/* ============================================================
   INITIALISATION (IIFE)
   ============================================================ */
(async()=>{
  showLock('<div class="loading">Chargement…</div>');
  try{
    supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    supa.auth.onAuthStateChange((event)=>{if(event==="SIGNED_OUT") location.reload();});
    const{data:{session:s}}=await supa.auth.getSession();
    if(s){session=s; await loadProfil();} else showLogin();
  }catch(x){
    showLock(`<div class="card" style="margin:40px auto;max-width:400px"><b>Erreur</b><p class="m">${e(x.message)}</p><button class="p" onclick="location.reload()">Réessayer</button></div>`);
  }
})();
// Fonction de suppression (elle manquait)
async function supprimerDocument(type, id) {
    if (!confirm("Êtes-vous sûr de vouloir supprimer définitivement ce document ?")) return;
    
    const table = type === 'devis' ? 'devis' : 'factures';
    const { error } = await supa.from(table).delete().eq('id', id);
    
    if (error) {
        toast("Erreur lors de la suppression : " + error.message, "error");
    } else {
        toast("Document supprimé avec succès.");
        await jlog("Suppression " + type, id, "");
        await loadAllData();
    }
}

// Fonction de modification (à lier à vos modaux existants)
function modifierDocument(type, id) {
    if (type === 'devis') {
        editDevisId = id;
        // Remplacer par la fonction qui ouvre votre modal de devis
        // Par exemple : ouvrirModalDevis(); 
        toast("Modification du devis : à lier à votre modal.", "info");
    } else {
        editFactureId = id;
        // Remplacer par la fonction qui ouvre votre modal de facture
        // Par exemple : ouvrirModalFacture();
        toast("Modification de la facture : à lier à votre modal.", "info");
    }
}
</script>
</body>
</html>
