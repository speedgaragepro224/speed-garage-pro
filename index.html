async function changerRoleUtilisateur(userId, currentRole) {
    const nouveauRole = prompt("Nouveau rôle pour cet utilisateur (PDG, SECRETAIRE, MARKETING) :", currentRole);
    if (!nouveauRole) return;
    
    if (!["PDG", "SECRETAIRE", "MARKETING"].includes(nouveauRole.toUpperCase())) {
        alert("Rôle invalide. Choisissez PDG, SECRETAIRE ou MARKETING.");
        return;
    }

    const { error } = await supa.from("profiles").update({ role: nouveauRole.toUpperCase() }).eq("id", userId);
    
    if (error) { toast("Erreur : " + error.message, "error"); return; }
    
    toast("Rôle mis à jour avec succès !");
    await loadAllData(); // Recharge la page pour voir le changement
}
function changerOngletParams(onglet) {
    currentSettingsTab = onglet;
    renderParams(document.getElementById('app'));
}
function changerOngletParams(onglet) {
    currentSettingsTab = onglet;
    renderParams(document.getElementById('app'));
}
async function saveParams() { 
    const updates = [
        {cle:"nom", valeur: $("p_nom").value.trim()},
        {cle:"nif", valeur: $("p_nif").value.trim()},
        {cle:"rccm", valeur: $("p_rccm").value.trim()},
        {cle:"adresse", valeur: $("p_adr").value.trim()},
        {cle:"telephone", valeur: $("p_tel").value.trim()},
        {cle:"email", valeur: $("p_email") ? $("p_email").value.trim() : ""},
        {cle:"tva_taux", valeur: $("p_tva").value.trim()},
        {cle:"statut_juridique", valeur: $("p_statut").value.trim()}
    ]; 
    
    for (const u of updates) {
        const { data: existing } = await supa.from("parametres").select("cle").eq("cle", u.cle).single();
        if (existing) {
            await supa.from("parametres").update({valeur: u.valeur}).eq("cle", u.cle);
        } else {
            await supa.from("parametres").insert({cle: u.cle, valeur: u.valeur});
        }
    }
    
    await loadAllData(); 
    toast("Paramètres enregistrés avec succès !"); 
}
async function changerMotDePasse() { const oldPass = $("old_password").value, newPass = $("new_password").value, confirmPass = $("confirm_password").value; if (!oldPass) { alert("Ancien mot de passe requis."); return; } if (newPass.length < 8) { alert("8 caractères minimum."); return; } if (newPass !== confirmPass) { alert("Les mots de passe ne correspondent pas."); return; } const { error: loginError } = await supa.auth.signInWithPassword({ email: session.user.email, password: oldPass }); if (loginError) { alert("Ancien mot de passe incorrect."); return; } const { error } = await supa.auth.updateUser({ password: newPass }); if (error) { alert("Erreur : " + error.message); } else { alert("✅ Mot de passe mis à jour !"); $("old_password").value = ""; $("new_password").value = ""; $("confirm_password").value = ""; } }
function exportAll() { const dataStr = JSON.stringify({ exporte_le: new Date().toISOString(), clients: data.clients, vehicules: data.vehicules, devis: data.devis, factures: data.factures, stock: data.stock, employes: data.employes, paie: data.paie, depenses: data.depenses, fournisseurs: data.fournisseurs, commandes: data.commandes, journal: data.journal }, null, 1); const blob = new Blob([dataStr], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sauvegarde-speed-garage-" + new Date().toISOString().slice(0,10) + ".json"; a.click(); }
function importAll(input) { const file = input.files[0]; if (!file) return; if (!confirm("⚠️ Ajouter les données du fichier ?")) { input.value = ""; return; } const reader = new FileReader(); reader.onload = async (e) => { try { const json = JSON.parse(e.target.result); if (!json.clients && !json.factures) { alert("Fichier invalide."); return; } alert("Importation..."); for (const c of (json.clients || [])) { delete c.id; await supa.from("clients").insert(c); } for (const v of (json.vehicules || [])) { delete v.id; await supa.from("vehicules").insert(v); } for (const d of (json.devis || [])) { delete d.id; await supa.from("devis").insert(d); } for (const fa of (json.factures || [])) { delete fa.id; await supa.from("factures").insert(fa); } alert("✅ Importation terminée !"); await loadAllData(); } catch(err) { alert("Erreur : " + err.message); } }; reader.readAsText(file); }
function renderLogout(A) { A.innerHTML = `<div class="card"><h3>Se déconnecter</h3><button class="p" onclick="logout()">Se déconnecter</button></div>`; }

// ============ INITIALISATION (DOIT ÊTRE À LA FIN) ============
(async () => {
    showLock('<div class="loading">Chargement…</div>');
    try {
        supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        supa.auth.onAuthStateChange((event) => {
            if (event === "SIGNED_OUT") location.reload();
        });
        const { data: { session: s } } = await supa.auth.getSession();
        if (s) { session = s; await loadProfil(); } else showLogin();
    } catch(x) { 
        showLock(`<div class="card" style="margin:40px auto;max-width:400px"><b>Erreur</b><p class="m">${e(x.message)}</p><button class="p" onclick="location.reload()">Réessayer</button></div>`); 
    }
})();
// ==========================================
// FORCE L'AFFICHAGE DU VÉHICULE DANS LE DEVIS
// ==========================================
function remplirVehiculeDevis(clientId) {
    dMemo.client = clientId;
    const cl = data.clients.find(c => c.id === clientId);
    
    // Mise à jour des infos client
    if (document.getElementById("dv_display_tel")) document.getElementById("dv_display_tel").textContent = cl ? (cl.tel || "—") : "—";
    if (document.getElementById("dv_display_adr")) document.getElementById("dv_display_adr").textContent = cl ? (cl.adr || "—") : "—";

    // On cherche TOUS les véhicules du client
    const mesVehicules = data.vehicules.filter(x => x.client_id === clientId);
    const selectVeh = document.getElementById("dv_select_vehicule");

    if (selectVeh) {
        if (mesVehicules.length === 0) {
            selectVeh.innerHTML = '<option value="">Aucun véhicule enregistré</option>';
            dMemo.veh = "Aucun véhicule"; dMemo.immat = "—"; dMemo.km = "";
        } else {
            selectVeh.innerHTML = mesVehicules.map(v => 
                `<option value="${v.id}">${e(v.marque)} ${e(v.modele)} (${e(v.immat)})</option>`
            ).join("");
            
            // Sélectionne automatiquement le premier et met à jour l'affichage
            changerVehiculeDevis(mesVehicules[0].id);
        }
    }
}

// Nouvelle fonction pour gérer le changement dans le menu déroulant
function changerVehiculeDevis(vehiculeId) {
    const v = data.vehicules.find(x => x.id === vehiculeId);
    if (v) {
        dMemo.veh = v.marque + " " + v.modele;
        dMemo.immat = v.immat;
        dMemo.km = v.kilometrage || "";
    } else {
        dMemo.veh = "—"; dMemo.immat = "—"; dMemo.km = "";
    }
    
    if (document.getElementById("dv_display_veh")) document.getElementById("dv_display_veh").textContent = dMemo.veh;
    if (document.getElementById("dv_display_immat")) document.getElementById("dv_display_immat").textContent = dMemo.immat;
    if (document.getElementById("dv_display_km")) document.getElementById("dv_display_km").textContent = dMemo.km;
}
async function uploaderLogo(input) {
    if (!input.files || input.files.length === 0) return;
    
    const file = input.files[0];
    const fileName = `logo_${Date.now()}.${file.name.split('.').pop()}`;
    
    toast("Envoi de l'image...", "info");

    // 1. Envoi vers Supabase Storage (Bucket "logos")
    const { error } = await supa.storage.from('logos').upload(fileName, file);
    
    if (error) {
        toast("Erreur d'envoi : " + error.message, "error");
        return;
    }

    // 2. Récupération du lien public
    const { data } = supa.storage.from('logos').getPublicUrl(fileName);
    
    // 3. Sauvegarde du lien dans les paramètres
    const { data: exist } = await supa.from("parametres").select("cle").eq("cle", "logo_url").single();
    if (exist) {
        await supa.from("parametres").update({ valeur: data.publicUrl }).eq("cle", "logo_url");
    } else {
        await supa.from("parametres").insert({ cle: "logo_url", valeur: data.publicUrl });
    }

    toast("Logo enregistré avec succès !");
    await loadAllData(); // Recharge la page pour afficher le nouveau logo
}
