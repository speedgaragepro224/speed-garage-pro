<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Speed Garage Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#050505;--c:rgba(15,15,20,.65);--t:#fff;--m:#a1a1aa;--b:rgba(255,255,255,.08);
  --r:#e50914;--r-light:#ff2d3b;--r-dark:#b20710;--ok:#10b981;--warn:#f59e0b;
  --blue:#3b82f6;--purple:#7c3aed;--cyan:#0891b2;--glass:rgba(15,15,20,.7);
  --glass-border:rgba(255,255,255,.08);--shadow:0 8px 32px rgba(0,0,0,.8);
  --shadow-hover:0 12px 40px rgba(229,9,20,.3);--nav-bg:rgba(10,10,14,.88);
  --header-bg:rgba(8,8,10,.95);--input-bg:rgba(0,0,0,.5);--input-bg-focus:rgba(0,0,0,.8);
  --table-hover:rgba(229,9,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  background-color:var(--bg)!important;color:var(--t);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;overflow-x:hidden;min-height:100vh;letter-spacing:-.01em;
  transition:background-color .3s,color .3s;
  background-image:linear-gradient(to right,rgba(0,0,0,.92) 0%,rgba(0,0,0,.4) 40%,rgba(0,0,0,.6) 100%),
  url('https://i.postimg.cc/RZvf8z11/Garage-moderne-Speed-Garage-Pro.png')!important;
  background-size:cover!important;background-position:center center!important;background-attachment:fixed!important;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes countUp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ---------- HEADER / NAV ---------- */
header{background:var(--header-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--t);
  padding:14px 24px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;gap:16px;
  position:sticky;top:0;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:background-color .3s}
header .logo-area{display:flex;align-items:center;gap:12px}
header .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--r),var(--r-light));
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;
  box-shadow:0 0 15px rgba(229,9,20,.6);color:#fff}
header span{flex:1;font-size:16px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
header small{font-weight:500;font-size:12px;opacity:.85}
.user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a21caf,var(--purple));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;
  cursor:pointer;transition:all .2s;border:2px solid transparent;box-shadow:0 0 10px rgba(162,28,175,.4)}
.user-avatar:hover{transform:scale(1.05);border-color:var(--r)}
.notif-badge{position:relative;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:#fff;
  border:1px solid var(--glass-border)}
.notif-badge:hover{background:rgba(255,255,255,.1)}
.notif-badge .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;background:var(--r);border-radius:50%;
  border:2px solid var(--bg);animation:pulse 2s infinite;box-shadow:0 0 8px var(--r)}
nav{display:flex;flex-direction:column;gap:6px;padding:20px 12px;width:250px;flex:none;background:var(--nav-bg);
  backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border-right:1px solid var(--glass-border);
  height:100vh;position:sticky;top:0;overflow-y:auto;transition:background-color .3s}
nav button{text-align:left;border:0;background:none;color:var(--m);padding:12px 16px;border-radius:10px;
  font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:all .25s ease;display:flex;
  align-items:center;gap:12px;position:relative;overflow:hidden}
nav button .nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;transition:.25s}
nav button.on{background:linear-gradient(90deg,rgba(229,9,20,.9) 0%,rgba(178,7,16,.4) 100%);color:#fff;
  font-weight:600;border-left:4px solid var(--r-light);box-shadow:0 4px 20px rgba(229,9,20,.3)}
nav button.on .nav-icon{color:#fff;text-shadow:0 0 8px rgba(255,255,255,.5)}
nav button:not(.on):hover{background:rgba(255,255,255,.05);color:var(--t);transform:translateX(4px)}
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 60px)}
main{flex:1;min-width:0;padding:30px;width:100%;max-width:100%;margin:0}
.mb{display:none;background:none;border:0;color:var(--t);font-size:24px;padding:0;cursor:pointer}
@media(max-width:768px){
  .mb{display:inline-block}
  nav{position:fixed;left:0;top:0;bottom:0;z-index:60;width:280px;transform:translateX(-100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);box-shadow:4px 0 30px rgba(0,0,0,.5);padding-top:20px}
  nav.open{transform:none}
  main{padding:12px}
  .grid{grid-template-columns:1fr 1fr}
  header{padding:10px 12px;gap:8px}
  header span{font-size:13px}
  header small{display:none}
  header .logo-icon{width:32px;height:32px;font-size:17px}
  .user-avatar,.notif-badge{width:34px;height:34px;font-size:13px}
  .kpi-grid{grid-template-columns:1fr 1fr!important;gap:10px!important}
  .kpi-grid .kpi-card{padding:12px!important}
  .kpi-grid .kpi-icon{display:none}
  .kpi-grid .kpi-label{font-size:10px}
  .kpi-grid .kpi-value{font-size:16px}
  .card{padding:14px;border-radius:12px}
  .page-header{padding:16px}
  .page-header h2{font-size:20px}
  .page-header-actions{flex-direction:column;align-items:stretch;gap:10px}
  button.p{width:100%;padding:14px;font-size:14px}
  input,select,textarea{font-size:16px!important}
  .filters-bar{flex-direction:column;padding:12px;gap:10px}
  .search-box{width:100%!important;min-width:0}
  .filter-select{width:100%}
  .table-container{overflow-x:hidden}
  .data-table{min-width:0;display:block}
  .data-table thead{display:none}
  .data-table tbody{display:block}
  .data-table tr{display:block;border:1px solid var(--glass-border);margin-bottom:10px;border-radius:10px;
    padding:10px;background:rgba(0,0,0,.3)}
  .data-table td{display:block;border:none;padding:6px 4px!important;text-align:right!important;
    font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}
  .data-table td:last-child{border-bottom:none}
  .data-table td::before{content:attr(data-label);font-weight:700;color:var(--m);font-size:11px;
    text-transform:uppercase;float:left;margin-right:10px}
  .data-table td:empty{display:none}
  .actions-cell{justify-content:flex-end;flex-wrap:wrap;gap:6px}
  .pagination{flex-direction:column;gap:10px;padding:12px}
  .pagination-buttons{justify-content:center}
  .modal-overlay{padding:0;align-items:stretch}
  .modal{max-width:100%!important;width:100%!important;height:100vh;max-height:100vh!important;
    border-radius:0;padding:16px}
  .modal-header h3{font-size:16px}
  .form-row{grid-template-columns:1fr;gap:0}
  .calendar-container{padding:12px}
  .calendar-title{font-size:16px}
  .calendar-day{height:44px;padding:4px}
  .calendar-day-number{font-size:12px}
  .calendar-weekday{font-size:9px;padding:4px 0}
  canvas{max-width:100%!important}
}
.card{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);border-radius:16px;padding:24px;margin-bottom:20px;
  box-shadow:var(--shadow);overflow-x:auto;transition:all .3s cubic-bezier(.4,0,.2,1);animation:fadeIn .4s ease-out}
.card:hover{border-color:rgba(229,9,20,.3);box-shadow:0 0 30px rgba(229,9,20,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.kpi-card{position:relative;overflow:hidden;padding:24px;border-radius:16px;border:1px solid var(--glass-border);
  background:var(--glass);backdrop-filter:blur(20px);transition:all .3s ease;animation:countUp .6s ease-out}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--r),var(--r-light));box-shadow:0 0 15px var(--r)}
.kpi-card.green::before{background:linear-gradient(90deg,var(--ok),#34d399)}
.kpi-card.blue::before{background:linear-gradient(90deg,var(--blue),#60a5fa)}
.kpi-card.purple::before{background:linear-gradient(90deg,var(--purple),#a78bfa)}
.kpi-card.orange::before{background:linear-gradient(90deg,var(--warn),#fbbf24)}
.kpi-card:hover{transform:translateY(-4px);border-color:rgba(229,9,20,.5);box-shadow:0 10px 30px rgba(229,9,20,.2)}
.kpi-card .kpi-icon{position:absolute;top:20px;right:20px;font-size:32px;color:rgba(255,255,255,.05)}
.k{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:8px;color:#fff}
.m{color:var(--m);font-size:13px}
input,select,textarea{width:100%;padding:14px 16px;margin:6px 0;border:1px solid var(--glass-border);
  border-radius:10px;background:var(--input-bg);backdrop-filter:blur(10px);color:var(--t);
  font:inherit;font-size:14px;transition:all .2s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--r);
  background:var(--input-bg-focus);box-shadow:0 0 0 3px rgba(229,9,20,.2)}
button.p{background:linear-gradient(135deg,var(--r),var(--r-light));color:#fff;border:0;border-radius:10px;
  padding:14px 24px;font:inherit;font-weight:700;font-size:14px;margin-top:8px;cursor:pointer;width:auto;
  text-transform:uppercase;letter-spacing:.5px;box-shadow:0 4px 16px rgba(229,9,20,.3);transition:all .2s ease}
button.p:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(229,9,20,.5)}
button.s{background:rgba(255,255,255,.05);border:1px solid var(--glass-border);color:var(--t);
  border-radius:8px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;margin:2px;transition:all .2s}
button.s:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 0;
  border-top:1px solid var(--glass-border);flex-wrap:wrap}
.tag{font-size:11px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.08);
  display:inline-block;font-weight:600;letter-spacing:.3px}
.ref{font-family:'SF Mono',Monaco,monospace;font-size:12px;background:rgba(255,255,255,.05);
  padding:3px 8px;border-radius:6px;font-weight:500}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;min-width:500px}
th,td{padding:14px 12px;text-align:left;border-bottom:1px solid var(--glass-border);font-size:14px}
th{background:rgba(0,0,0,.4);font-weight:700;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
tr:hover{background:var(--table-hover)}
.loading{text-align:center;padding:40px;color:var(--m);font-size:14px}
input.erreur,select.erreur,textarea.erreur{border:2px solid var(--r)!important;
  background:rgba(229,9,20,.1)!important;animation:shake .3s}

/* ---------- MODALS ---------- */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:9999;
  display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal{background:rgba(20,20,25,.95);backdrop-filter:blur(20px);border-radius:16px;padding:30px;
  max-width:600px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--glass-border);
  box-shadow:0 20px 60px rgba(0,0,0,.8)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-header h3{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--t)}
.modal-header h3 i{color:var(--r)}
.modal-close{background:none;border:none;color:var(--r);font-size:24px;cursor:pointer}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--m);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px}
.form-control{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--b);border-radius:8px;
  color:var(--t);font-size:14px;font-family:inherit}
.form-control:focus{outline:none;border-color:var(--r)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.form-actions{display:flex;gap:10px;margin-top:25px}
.form-actions .btn{flex:1;justify-content:center}

/* ---------- LOGOUT MODAL ---------- */
.modal-logout-custom{max-width:480px!important;text-align:center;padding:40px 30px!important;position:relative}
.logout-icon-circle{width:80px;height:80px;border-radius:50%;background:rgba(229,9,20,.15);
  display:inline-flex;align-items:center;justify-content:center;font-size:36px;color:var(--r);
  margin-bottom:20px;border:2px solid rgba(229,9,20,.35);box-shadow:0 0 30px rgba(229,9,20,.2)}
.logout-title{font-size:22px;font-weight:800;color:var(--t);margin-bottom:12px}
.logout-subtitle{color:var(--m);font-size:14px;line-height:1.6;margin-bottom:20px}
.btn-logout-annuler,.btn-logout-confirm{flex:1;padding:14px;border-radius:10px;font-weight:700;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;border:none;transition:.2s}
.btn-logout-annuler{background:rgba(255,255,255,.1);color:var(--t)}
.btn-logout-annuler:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.btn-logout-confirm{background:linear-gradient(135deg,var(--r),var(--r-light));color:#fff;
  box-shadow:0 4px 15px rgba(229,9,20,.4)}
.btn-logout-confirm:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(229,9,20,.6)}

/* ---------- TOAST ---------- */
.toast-container{position:fixed;top:20px;right:20px;z-index:10000;display:flex;flex-direction:column;gap:10px}
.toast{background:rgba(20,20,25,.95);backdrop-filter:blur(20px);color:#fff;padding:14px 20px;border-radius:10px;
  border-left:4px solid var(--ok);box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;
  gap:10px;font-size:14px;font-weight:500;min-width:250px;animation:slideInRight .3s ease-out}

/* ---------- PAGE HEADERS ---------- */
.page-header{background:var(--glass);border-top:4px solid var(--r);border-radius:16px;padding:25px 30px;
  margin-bottom:20px;position:relative;overflow:hidden;backdrop-filter:blur(20px);
  border-left:1px solid var(--glass-border);border-right:1px solid var(--glass-border);
  border-bottom:1px solid var(--glass-border);box-shadow:var(--shadow)}
.page-header h2{font-size:26px;font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:5px;
  color:var(--t);text-shadow:0 2px 4px rgba(0,0,0,.5)}
.page-header h2 i{color:var(--r);text-shadow:0 0 10px var(--r)}
.page-header p{color:var(--m);font-size:14px;margin-top:5px}
.page-header-actions{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px}
.kpi-grid .kpi-card{padding:16px;border-radius:14px;display:flex;align-items:center;gap:12px;
  background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.kpi-grid .kpi-icon{border-radius:10px;padding:10px;font-size:20px;color:#fff}
.kpi-label{font-size:11px;text-transform:uppercase;color:var(--m);font-weight:600}
.kpi-value{font-size:22px;font-weight:800;margin-top:2px;color:var(--t)}
.filters-bar{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:15px;
  display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin-bottom:20px;backdrop-filter:blur(20px)}
.search-box{flex:2;position:relative;min-width:250px}
.search-box i{position:absolute;left:15px;top:14px;color:var(--m)}
.search-box input{width:100%;padding:10px 15px 10px 40px;background:rgba(0,0,0,.4);
  border:1px solid var(--b);border-radius:8px;color:var(--t);font-size:14px}
.search-box input:focus{outline:none;border-color:var(--r)}
.filter-select{flex:1;min-width:150px;padding:10px 15px;background:rgba(0,0,0,.4);
  border:1px solid var(--b);border-radius:8px;color:var(--t);font-size:14px}
.btn{padding:10px 18px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:none;
  display:inline-flex;align-items:center;gap:8px;transition:all .2s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--r),var(--r-light));color:#fff;
  box-shadow:0 4px 15px rgba(229,9,20,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(229,9,20,.5)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--t);border:1px solid var(--glass-border)}
.btn-secondary:hover{background:rgba(255,255,255,.15)}
.btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:6px}
.btn-danger{background:rgba(229,9,20,.15);color:var(--r);border:1px solid rgba(229,9,20,.3)}
.btn-danger:hover{background:rgba(229,9,20,.3)}
.table-container{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;
  overflow:hidden;margin-bottom:20px;backdrop-filter:blur(20px);box-shadow:var(--shadow)}
.data-table{width:100%;border-collapse:collapse}
.data-table thead{background:rgba(0,0,0,.4);border-bottom:2px solid var(--r)}
.data-table th{padding:14px 15px;text-align:left;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:var(--m)}
.data-table td{padding:14px 15px;border-bottom:1px solid var(--glass-border);font-size:14px;color:var(--t)}
.data-table tbody tr{transition:background .2s}
.data-table tbody tr:hover{background:var(--table-hover)}
.data-table tbody tr:last-child td{border-bottom:none}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:600}
.badge-success{background:rgba(16,185,129,.15);color:var(--ok);border:1px solid rgba(16,185,129,.3)}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.badge-danger{background:rgba(229,9,20,.15);color:var(--r);border:1px solid rgba(229,9,20,.3)}
.badge-info{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.badge-secondary{background:rgba(255,255,255,.08);color:var(--m);border:1px solid var(--b)}
.pagination{padding:15px 20px;border-top:1px solid var(--glass-border);display:flex;
  justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;background:rgba(0,0,0,.2)}
.pagination-info{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--m)}
.pagination-buttons{display:flex;gap:5px}
.page-btn{width:32px;height:32px;border-radius:6px;background:rgba(255,255,255,.05);
  border:1px solid var(--b);color:var(--t);cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:all .2s}
.page-btn:hover{background:rgba(255,255,255,.15)}
.page-btn.active{background:var(--r);border-color:var(--r);color:#fff}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.actions-cell{display:flex;gap:6px;justify-content:center}
.ref-badge{font-family:'SF Mono',Monaco,monospace;font-size:11px;background:rgba(255,255,255,.05);
  padding:3px 8px;border-radius:6px;font-weight:500}
.user-cell{display:flex;align-items:center;gap:10px}
.user-avatar-sm{width:32px;height:32px;border-radius:50%;background:rgba(229,9,20,.1);color:var(--r);
  display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px}
.empty-state{text-align:center;padding:40px;color:var(--m)}
.empty-state i{font-size:40px;margin-bottom:15px;opacity:.5}

::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--r)}

/* ---------- CALENDAR / PLANNING ---------- */
.calendar-container{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);
  border-radius:20px;padding:24px;margin-bottom:20px;box-shadow:var(--shadow)}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;
  padding-bottom:16px;border-bottom:1px solid var(--glass-border)}
.calendar-title{font-size:22px;font-weight:800;color:var(--t);letter-spacing:-.5px;text-transform:capitalize}
.calendar-nav-btn{background:var(--table-hover);border:1px solid var(--glass-border);color:var(--t);
  padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .3s ease}
.calendar-nav-btn:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:12px}
.calendar-weekday{text-align:center;font-size:11px;font-weight:700;color:var(--m);
  text-transform:uppercase;letter-spacing:1px;padding:8px 0}
.calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.calendar-day{height:52px;padding:8px;background:var(--table-hover);border:1px solid transparent;
  border-radius:12px;cursor:pointer;transition:all .2s ease;position:relative;display:flex;
  flex-direction:column;align-items:flex-start;justify-content:space-between}
.calendar-day:hover{background:rgba(255,255,255,.08);border-color:var(--glass-border);transform:translateY(-2px)}
.calendar-day-number{font-size:14px;font-weight:600;color:var(--m);transition:color .2s}
.calendar-day:hover .calendar-day-number{color:var(--t)}
.calendar-day-empty{background:transparent;border:none;cursor:default;height:52px}
.calendar-day.today{background:linear-gradient(135deg,#dc2626,#991b1b);border-color:#ef4444;
  box-shadow:0 4px 20px rgba(220,38,38,.4)}
.calendar-day.today .calendar-day-number{color:#fff;font-weight:800}
.calendar-day.selected{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:#3b82f6;
  box-shadow:0 4px 20px rgba(37,99,235,.4)}
.calendar-day.selected .calendar-day-number{color:#fff}
.calendar-day.has-rdv{border-left:3px solid #22c55e;background:rgba(34,197,94,.05)}
.rdv-indicator{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap}
.rdv-dot{width:5px;height:5px;border-radius:50%;background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.6)}
.rdv-count{font-size:9px;font-weight:700;color:#22c55e;margin-top:2px;background:rgba(34,197,94,.15);
  padding:2px 6px;border-radius:8px}
input[type="date"]::-webkit-calendar-picker-indicator,
input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1);cursor:pointer}

/* ---------- DESIGN PAIE FIDÈLE À L'IMAGE ---------- */
.modal-paie-custom {
    background: #0d0d0f !important;
    border: 2px solid #e50914 !important; /* Bordure rouge autour du modal */
    border-radius: 16px !important;
    box-shadow: 0 0 40px rgba(229, 9, 20, 0.3) !important;

    position: relative;
    padding: 0 !important;
    max-width: 650px !important;
}

/* En-tête */
.paie-header {
    background: #111;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(229, 9, 20, 0.2);
    position: relative;
    overflow: hidden;
}
.paie-header::before {
    content: ''; position: absolute; top: 0; left: 0; width: 45%; height: 100%;
    background: linear-gradient(90deg, rgba(229,9,20,0.3) 0%, transparent 100%);
    clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
}
.paie-header img { height: 60px; position: relative; z-index: 2; }
.paie-header h3 {
    margin: 0; color: #fff; font-size: 24px; font-weight: 800;
    display: flex; align-items: center; gap: 10px; position: relative; z-index: 2;
}
.paie-close {
    background: #e50914; border: none; width: 35px; height: 35px; border-radius: 8px;
    color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; position: relative; z-index: 2; transition: 0.2s;
}
.paie-close:hover { transform: scale(1.1); }

/* Corps */
.paie-body {
    padding: 25px 30px 40px 30px;
    background: #0d0d0f;
    position: relative;
}
.paie-label {
    display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;
    color: #fff; margin-bottom: 10px;
}
.paie-label i { color: #e50914; font-size: 18px; }
.paie-label .req { color: #e50914; }
.paie-label .opt { color: #a1a1aa; font-size: 13px; font-weight: 400; }

.paie-input-group { position: relative; margin-bottom: 20px; }

/* Champs de saisie personnalisés */
.paie-input {
    width: 100%; background: #000 !important; color: #fff !important;
    border: 1px solid #e50914 !important; border-radius: 8px !important;
    padding: 14px 15px !important; font-size: 15px !important; font-weight: 500 !important;
    box-sizing: border-box;
}
.paie-input:focus { outline: none; border-color: #ff2d3b !important; box-shadow: 0 0 10px rgba(229,9,20,0.3) !important; }

    background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/><path d="M0 0h24v24H0z" fill="none"/></svg>') !important;
    background-repeat: no-repeat !important; background-position: right 10px center !important;
    padding-right: 40px !important;
}

.input-gnf-wrapper input { border-top-right-radius: 0 !important; border-bottom-right-radius: 0 !important; border-right: none !important; }
.gnf-box {
    background: #333; color: #ccc; padding: 0 20px; display: flex; align-items: center;

}

    border: 2px solid #e50914 !important;
    border-radius: 16px !important;
    box-shadow: 0 0 40px rgba(229, 9, 20, 0.3) !important;
    overflow: hidden !important;
    position: relative;
    padding: 0 !important;
    max-width: 700px !important;
}

/* En-tête */
.four-header {
    background: #111;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(229, 9, 20, 0.2);
    position: relative;
    overflow: hidden;
}
.four-header::before {
    content: ''; position: absolute; top: 0; left: 0; width: 45%; height: 100%;
    background: linear-gradient(90deg, rgba(229,9,20,0.3) 0%, transparent 100%);
    clip-path: polygon(0 0, 100% 0, 80% 100%, 0% 100%);
}
.four-header img { height: 60px; position: relative; z-index: 2; }
.four-header h3 {
    margin: 0; color: #fff; font-size: 24px; font-weight: 800;
    display: flex; align-items: center; gap: 10px; position: relative; z-index: 2;
}
.four-header h3 i { color: #fff; font-size: 22px; }
.four-close {
    background: #e50914; border: none; width: 35px; height: 35px; border-radius: 8px;
    color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; position: relative; z-index: 2; transition: 0.2s;
}
.four-close:hover { transform: scale(1.1); }

/* Corps */
.four-body {
    padding: 25px 30px 40px 30px;
    background: #0d0d0f;
    position: relative;
}
.four-label {
    display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700;
    color: #fff; margin-bottom: 10px;
}
.four-label i { color: #e50914; font-size: 18px; }
.four-label .req { color: #e50914; }

.four-input-group { position: relative; margin-bottom: 20px; }

/* Champs de saisie avec bordure blanche/gris clair comme sur l'image */
.four-input {
    width: 100%; background: #000 !important; color: #fff !important;
    border: 1px solid #fff !important; /* Bordure blanche */
    border-radius: 8px !important;
    padding: 14px 15px !important; font-size: 15px !important; font-weight: 500 !important;
    box-sizing: border-box;
}
.four-input:focus { outline: none; border-color: #e50914 !important; box-shadow: 0 0 10px rgba(229,9,20,0.3) !important; }
.four-input::placeholder { color: #888; }

.four-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

/* Footer */
.four-footer {
    background: #0a0a0a; padding: 20px 30px 30px 30px;
    display: flex; justify-content: space-between; gap: 20px; position: relative;
    border-top: 1px solid rgba(255,255,255,0.05);
}
.four-footer::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,20 C30,5 70,25 100,0 L100,20 Z" fill="%23e50914"/></svg>') no-repeat center bottom;
    background-size: 100% 100%; z-index: 1;
}
.four-footer::after {
    content: ''; position: absolute; bottom: 2px; left: 0; right: 0; height: 40px;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 20" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><path d="M0,20 C30,5 70,25 100,0" fill="none" stroke="white" stroke-width="0.8"/></svg>') no-repeat center bottom;
    background-size: 100% 100%; z-index: 2;
}
.four-btn-annuler {
    flex: 1; background: linear-gradient(180deg, #444 0%, #222 100%); color: #fff;
    border: 1px solid #555; border-radius: 8px; padding: 14px;
    font-size: 16px; font-weight: 800; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 10px; transition: 0.2s; z-index: 10;
}
.four-btn-enregistrer {
    flex: 1; background: linear-gradient(180deg, #ff2d3b 0%, #b20710 100%); color: #fff;
    border: none; border-radius: 8px; padding: 14px;
    font-size: 16px; font-weight: 800; cursor: pointer; display: flex;
    align-items: center; justify-content: center; gap: 10px; transition: 0.2s; z-index: 10;
    box-shadow: 0 4px 15px rgba(229,9,20,0.4);
}
.four-btn-enregistrer:hover { transform: translateY(-2px); }
.four-car-silhouette {
    position: absolute; right: 40px; bottom: 60px; width: 150px; opacity: 0.2; pointer-events: none; z-index: 1;
}

let focusSauvegarde={id:null,pos:0};
function sauvegarderFocus(idInput){
  const input=document.getElementById(idInput);
  if(input){focusSauvegarde.id=idInput;focusSauvegarde.pos=input.selectionStart;}
}
function restaurerFocus(){
  if(focusSauvegarde.id){
    const input=document.getElementById(focusSauvegarde.id);
    if(input){input.focus();input.setSelectionRange(focusSauvegarde.pos,focusSauvegarde.pos);}
    focusSauvegarde.id=null;
  }
}

/* ============================================================
   TOAST
   ============================================================ */
function toast(message,type='success'){
  let container=document.getElementById('toast-container');
  if(!container){
    container=document.createElement('div');
    container.id='toast-container';
    container.className='toast-container';
    document.body.appendChild(container);
  }
  const t=document.createElement('div');
  t.className='toast';
  t.style.borderLeftColor=type==='error'?'var(--r)':(type==='info'?'var(--blue)':'var(--ok)');
  t.innerHTML='<span>'+(type==='error'?'❌':(type==='info'?'ℹ️':'✅'))+'</span> '+message;
  container.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(100%)';t.style.transition='all .3s';
    setTimeout(()=>t.remove(),300);},3500);
}

async function doLogin(){

  try{
    const{data:d,error}=await supa.auth.signInWithPassword({email,password:pw});
    if(error){m.textContent="❌ "+error.message;return;}
    session=d.session; await loadProfil();
  }catch(x){m.textContent="❌ Erreur réseau.";}
}

async function loadAllData(){
  const R=ROLES[profil.role];
  const tasks=[
    supa.from("clients").select("*").order("created_at",{ascending:false}).then(r=>data.clients=r.data||[]),
    supa.from("techniciens").select("*").order("nom").then(r=>data.techs=r.data||[]),
    supa.from("devis").select("*").order("created_at",{ascending:false}).then(r=>data.devis=r.data||[]),
    supa.from("factures").select("*").order("created_at",{ascending:false}).then(r=>data.factures=r.data||[]),
    supa.from("rdv").select("*").order("date_rdv",{ascending:true}).then(r=>data.rdv=r.data||[]),
    supa.from("vehicules").select("*").then(r=>data.vehicules=r.data||[]),
    supa.from("employes").select("*").order("nom").then(r=>data.employes=r.data||[]),
    supa.from("paie").select("*").then(r=>data.paie=r.data||[]),
    supa.from("depenses").select("*").order("date_depense",{ascending:false}).then(r=>data.depenses=r.data||[]),
    supa.from("fournisseurs").select("*").order("nom").then(r=>data.fournisseurs=r.data||[]),
    supa.from("commandes").select("*").order("date_commande",{ascending:false}).then(r=>data.commandes=r.data||[]),
    supa.from("paiements").select("*").order("date_paiement",{ascending:false}).then(r=>data.paiements=r.data||[]),
    supa.from("parametres").select("*").then(r=>{data.params={};(r.data||[]).forEach(p=>data.params[p.cle]=p.valeur);}),
    supa.from("journal").select("*").order("created_at",{ascending:false}).limit(1000).then(r=>{
      data.journal=Array.isArray(r.data)?r.data:[];
    }),
    supa.from("profiles").select("*").then(r=>{
      data.profils=Array.isArray(r.data)?r.data:[];
    })
  ];
  if(R.can.editStock) tasks.push(supa.from("stock").select("*").order("nom").then(r=>data.stock=r.data||[]));
  await Promise.all(tasks);
  render();
  if(!window.realtimeChannel){
    window.realtimeChannel=supa.channel('custom-all-channel')
      .on('postgres_changes',{event:'*',schema:'public',table:'factures'},()=>{loadAllData();})
      .on('postgres_changes',{event:'*',schema:'public',table:'clients'},()=>{loadAllData();})
      .on('postgres_changes',{event:'*',schema:'public',table:'devis'},()=>{loadAllData();})
      .on('postgres_changes',{event:'*',schema:'public',table:'rdv'},()=>{loadAllData();})
      .on('postgres_changes',{event:'*',schema:'public',table:'journal'},()=>{loadAllData();})
      .subscribe();

}

/* ============================================================
   JOURNAL D'AUDIT (log)
   ============================================================ */
async function jlog(action,reference,details){
  if(!profil||!session){return;}
  try{
    const payload={
      utilisateur_id:session.user.id,
      utilisateur_nom:(profil.username||profil.email||"Inconnu").slice(0,100),
      role:(profil.role||"INCONNU").slice(0,50),
      action:String(action||"Action").slice(0,200),
      reference:String(reference||"").slice(0,200),
      details:String(details||"").slice(0,1000)
    };
    const{error}=await supa.from("journal").insert(payload);
    if(error){
      if(error.message&&(error.message.includes("foreign key")||error.message.includes("violates"))){
        const fb={...payload}; delete fb.utilisateur_id;
        await supa.from("journal").insert(fb);
      }
    }
  }catch(x){console.error("❌ Exception jlog:",x);}
}

function animateCounter(element,target,duration=1000){
  const startTime=performance.now();
  function update(currentTime){
    const elapsed=currentTime-startTime;
    const progress=Math.min(elapsed/duration,1);
    const eased=1-Math.pow(1-progress,3);
    element.textContent=f(Math.floor(target*eased));
    if(progress<1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

function remplirVehiculesRdv(clientId){
  const sel=document.getElementById('rd_vehicule');
  if(!sel) return;
  if(!clientId){sel.innerHTML='<option value="">Sélectionnez d\'abord un client</option>';return;}
  const mes=data.vehicules.filter(v=>v.client_id===clientId);
  sel.innerHTML=mes.length===0?'<option value="">Aucun véhicule</option>':mes.map(v=>`<option value="${v.immat}">${e(v.marque)} ${e(v.modele)} (${e(v.immat)})</option>`).join("");
}
function changerMotifRdv(){
  const cat=document.getElementById("rd_cat_motif").value;
  const container=document.getElementById("rd_motifs_container");
  if(!cat){container.innerHTML='<div style="grid-column:span 2;text-align:center;color:#a1a1aa;font-size:12px;font-style:italic;">Sélectionnez une catégorie.</div>';return;}
  const motifs=MOTIFS_RDV[cat]||[];
  container.innerHTML=motifs.map(m=>`
    <label class="rdv-checkbox-item">
      <input type="checkbox" class="rd-temp-cb" value="${e(m)}">
      <span>${e(m)}</span>
    </label>`).join("");
}
function ajouterMotifsCochesRdv(){
  const checkboxes=document.querySelectorAll('.rd-temp-cb:checked');
  if(checkboxes.length===0){toast("Veuillez cocher au moins un motif.","error");return;}
  let ajout=false;
  checkboxes.forEach(cb=>{
    if(!memoRdvMotifs.includes(cb.value)){memoRdvMotifs.push(cb.value);ajout=true;}
    cb.checked=false;
  });
  if(ajout) afficherTagsRdv(); else toast("Ces motifs sont déjà ajoutés.","info");
}
function afficherTagsRdv(){
  const container=document.getElementById("rd_motifs_selectionnes");
  if(!container) return;
  if(memoRdvMotifs.length===0){
    container.innerHTML=`
      <div class="rdv-motifs-empty">
        <i class="fa-solid fa-wrench"></i>
        Aucun motif sélectionné.
      </div>`;
    return;
  }
  container.innerHTML=memoRdvMotifs.map(m=>`
    <span class="rdv-tag">
      ${e(m)} <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="supprimerMotifRdv('${e(m).replace(/'/g,"\\'")}')"></i>
    </span>`).join("");
}
function supprimerMotifRdv(motif){memoRdvMotifs=memoRdvMotifs.filter(m=>m!==motif);afficherTagsRdv();}
async function sauvegarderRdv(){
  try{
    const clientId=$("rd_client").value;
    const immat=$("rd_vehicule").value;
    const dateRdv=$("rd_date").value;
    const heureRdv=$("rd_heure").value;
    if(!clientId||!immat||!dateRdv||!heureRdv){toast("Veuillez remplir les champs obligatoires.","error");return;}
    if(memoRdvMotifs.length===0){toast("Veuillez sélectionner au moins un motif.","error");return;}
    const motifFinal=memoRdvMotifs.join(", ");
    const client=data.clients.find(c=>c.id===clientId);
    const veh=data.vehicules.find(v=>v.immat===immat);
    const nomVehicule=veh?`${veh.marque} ${veh.modele}`:"";
    const btn=document.querySelector('#modal-rdv .btn-client-enregistrer');
    if(btn){btn.disabled=true;btn.innerHTML="Enregistrement...";}
    const{error}=await supa.from("rdv").insert({
      client_id:clientId,client_nom:client.nom,vehicule:nomVehicule,immat:immat,
      date_rdv:dateRdv,heure_rdv:heureRdv,motif:motifFinal,created_by:session.user.id
    });
    if(error){toast("Erreur : "+error.message,"error");if(btn){btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Enregistrer';}return;}
    await jlog("Nouveau RDV",`${client.nom} - ${dateRdv}`,motifFinal);
    toast("Rendez-vous enregistré !");
    document.getElementById('modal-rdv').remove();
    await loadAllData();
  }catch(err){alert("Erreur inattendue : "+err.message);console.error(err);}
}

// Fonction pour chercher le véhicule et remplir les champs
function rechercherVehiculeRappel() {
  const searchVal = document.getElementById('rap_search_immat').value.trim().toUpperCase();
  if(!searchVal) {
    toast("Veuillez saisir un identifiant ou une immatriculation.", "error");
    return;
  }
  
  let client = null;
  let vehicule = null;

  // 1. On cherche d'abord si c'est une immatriculation
  vehicule = data.vehicules.find(v => v.immat && v.immat.toUpperCase() === searchVal);
  
  if (vehicule) {
      client = data.clients.find(c => c.id === vehicule.client_id);
  } else {
      // 2. Si on ne trouve pas, on cherche par référence client (ex: PART-0001)
      client = data.clients.find(c => c.ref && c.ref.toUpperCase() === searchVal);
      if (client) {
          // On prend le premier véhicule de ce client pour l'afficher
          vehicule = data.vehicules.find(v => v.client_id === client.id);
      }
  }
  
  if(!client) {
    toast("Aucun client ou véhicule trouvé avec cet identifiant.", "error");
    reinitialiserRappel();
    return;
  }
  
  currentRappelClientId = client.id;
  
  // Remplissage Client
  document.getElementById('rap_nom').value = client.nom || "";
  document.getElementById('rap_prenom').value = ""; 
  document.getElementById('rap_tel').value = client.tel || "";
  document.getElementById('rap_adresse').value = client.adr || "";
  
  // Remplissage Véhicule (s'il y en a un)
  if (vehicule) {
      document.getElementById('rap_marque').value = vehicule.marque || "";
      document.getElementById('rap_modele').value = vehicule.modele || "";
      document.getElementById('rap_immat').value = vehicule.immat || "";
      document.getElementById('rap_vin').value = vehicule.vin || "";
  } else {
      document.getElementById('rap_marque').value = "Aucun véhicule";
      document.getElementById('rap_modele').value = "";
      document.getElementById('rap_immat').value = "";
      document.getElementById('rap_vin').value = "";
  }
  
  toast("Informations trouvées !", "success");
}
function reinitialiserRappel() {
  currentRappelClientId = null;
  document.getElementById('rap_search_immat').value = "";
  document.getElementById('rap_nom').value = "";
  document.getElementById('rap_prenom').value = "";
  document.getElementById('rap_tel').value = "";
  document.getElementById('rap_adresse').value = "";
  document.getElementById('rap_marque').value = "";
  document.getElementById('rap_modele').value = "";
  document.getElementById('rap_immat').value = "";
  document.getElementById('rap_vin').value = "";
}

// Fonction de sauvegarde mise à jour
async function sauvegarderRappelGlobal(){
  if(!currentRappelClientId) {
    toast("Veuillez d'abord rechercher et sélectionner un véhicule.", "error");
    return;
  }
  
  let type = document.getElementById("rap_type").value;
  const dateEcheance = document.getElementById("rap_date").value;
  
  if(!dateEcheance){
    toast("Veuillez choisir une date d'échéance.", "error");
    return;
  }
  
  const client = data.clients.find(c => c.id === currentRappelClientId);
  const immat = document.getElementById("rap_immat").value;
  const marque = document.getElementById("rap_marque").value;
  const modele = document.getElementById("rap_modele").value;
  const nomVehicule = `${marque} ${modele}`;
  
  try {
    const {error} = await supa.from("clients").update({
      prochaine_date: dateEcheance,
      vehicule_rappel: `${nomVehicule} (${immat})`,
      type_rappel: type
    }).eq("id", currentRappelClientId);
    
    if(error) throw error;
    
    await jlog("Nouveau rappel", `${client.nom} - ${dateEcheance}`, type);
    toast("Rappel enregistré avec succès !");
    document.getElementById('modal-rappel').remove();
    await loadAllData();
    
  } catch(err) {
    toast("Erreur : " + err.message, "error");
  }
}

  }
  
  const client = data.clients.find(c => c.id === currentRappelClientId);
  const immat = document.getElementById("rap_immat").value;
  const marque = document.getElementById("rap_marque").value;
  const modele = document.getElementById("rap_modele").value;
  const nomVehicule = `${marque} ${modele}`;
  
  try {
    const {error} = await supa.from("clients").update({
      prochaine_date: dateEcheance,
      vehicule_rappel: `${nomVehicule} (${immat})`,
      type_rappel: type
    }).eq("id", currentRappelClientId);

async function sauvegarderRappelGlobal(){

            <td data-label="Véhicule"><b>${e(r.vehicule)}</b></td>

async function nextRef(type){

async function sauvegarderClient(id){
  const modal=document.getElementById('modal-client');
  if(!modal) return;
  const type=document.getElementById("cl_type").value;
  const nom=(document.getElementById("cl_nom").value||"").trim();
  let tel=(document.getElementById("cl_tel").value||"").replace(/\s/g,'').replace('+224','');
  if(tel.length>9) tel=tel.slice(-9);
  const adr=(document.getElementById("cl_adr").value||"").trim();
  const nif=(document.getElementById("cl_nif")?.value||"").trim();
  const rccm=(document.getElementById("cl_rccm")?.value||"").trim();
  const contact=(document.getElementById("cl_contact")?.value||"").trim();
  
  const addVeh=document.getElementById("cl_add_veh")?.checked;
  const vMarque=(document.getElementById("nv_marque")?.value||"").trim();
  const vModele=(document.getElementById("nv_modele")?.value||"").trim();
  const vImmat=(document.getElementById("nv_immat")?.value||"").trim();
  const vVin=(document.getElementById("nv_vin")?.value||"").trim();
  const vCarb=document.getElementById("nv_carb")?.value||"";
  const vBoite=document.getElementById("nv_boite")?.value||"";
  const vKm=+document.getElementById("nv_km")?.value||0;

  if(!nom){toast("Le nom est obligatoire.","error");return;}
  if(!tel||tel.length!==9){toast("Le téléphone doit contenir 9 chiffres.","error");return;}
  if(!adr){toast("L'adresse est obligatoire.","error");return;}
  if(addVeh&&(!vMarque||!vModele||!vImmat)){toast("Marque, Modèle et Immat sont obligatoires.","error");return;}

  const btn=modal.querySelector('.btn-client-enregistrer');
  if(btn){btn.innerHTML="⏳ Enregistrement...";btn.disabled=true;}
  const payload={type,nom,tel,adr,contact,nif,rccm};

  try{
    let newClientId=null;
    if(id){
      const{error}=await supa.from("clients").update(payload).eq("id",id);
      if(error) throw error;
      await jlog("Modification client",nom,`Type: ${type}`);
    }else{
      const prefix=type==="Société"?"SOC":"PART";
      const{data:rows}=await supa.from("clients").select("ref").like("ref",prefix+"-%");
      const nums=(rows||[]).map(r=>parseInt(r.ref.split("-")[1],10)||0);
      const max=nums.length>0?Math.max(...nums):0;
      const ref=prefix+"-"+String(max+1).padStart(4,"0");
      const{data:ins,error}=await supa.from("clients").insert({...payload,ref,created_by:session.user.id}).select().single();
      if(error) throw error;
      newClientId=ins.id;
      await jlog("Création client",nom,`Type: ${type}`);
    }
    
    if(addVeh&&newClientId){
      const{error:vErr}=await supa.from("vehicules").insert({
        client_id:newClientId,marque:vMarque,modele:vModele,immat:vImmat,
        vin:vVin, carburant:vCarb,boite:vBoite,kilometrage:vKm,created_by:session.user.id
      });
      if(vErr) toast("Client créé, erreur véhicule : "+vErr.message,"error");
      else await jlog("Ajout véhicule",`${vMarque} ${vModele} (${vImmat})`,`Client: ${nom}`);
    }
    modal.remove();
    toast(addVeh&&newClientId?"✅ Client et véhicule enregistrés !":"✅ Client enregistré !");
    await loadAllData();
  }catch(err){
    console.error("Erreur :",err);
    toast("Erreur : "+err.message,"error");
    if(btn){btn.innerHTML='<i class="fa-solid fa-floppy-disk"></i> Enregistrer';btn.disabled=false;}
  }
}

  await supa.from("clients").delete().eq("id",id);
  await jlog("Suppression client",c?.ref||id,`Nom: ${c?.nom||'Inconnu'}`);

async function sauvegarderVehicule(id){
  const clientId=$("veh_client").value;
  const immat=$("veh_immat").value.trim().toUpperCase();
  const marque=$("veh_marque").value.trim().toUpperCase();
  const modele=$("veh_modele").value.trim().toUpperCase();
  const vin=$("veh_vin").value.trim().toUpperCase();
  const carburant=$("veh_carb").value;
  const boite=$("veh_boite").value;
  const km=+$("veh_km").value||0;
  if(!clientId||!immat||!marque||!modele){toast("Champs obligatoires manquants.","error");return;}
  const payload={client_id:clientId,immat,marque,modele,vin,carburant,boite,kilometrage:km};
  try{
    if(id){
      const{error}=await supa.from("vehicules").update(payload).eq("id",id);
      if(error) throw error;
      await jlog("Modification véhicule",immat,"");
    }else{
      payload.created_by=session.user.id;
      const{error}=await supa.from("vehicules").insert(payload);
      if(error) throw error;
      await jlog("Ajout véhicule",`${marque} ${modele} (${immat})`,"");
    }
    document.getElementById('modal-vehicule').remove();
    toast("Véhicule enregistré !");
    await loadAllData();
  }catch(err){toast("Erreur : "+err.message,"error");}
}
async function ajouterVehicule(clientId){
  if(!clientId){toast("Client non identifié.","error");return;}
  const marque=$("v_marque").value.trim().toUpperCase(),modele=$("v_modele").value.trim().toUpperCase(),immat=$("v_immat").value.trim().toUpperCase();
  const carburant=$("v_carb").value,boite=$("v_boite").value,portes=+$("v_portes").value||0,vin=$("v_vin").value.trim(),km=+$("v_km").value||0;
  if(!marque||!modele||!immat){toast("Marque, Modèle et Immat obligatoires.","error");return;}
  const{error}=await supa.from("vehicules").insert({client_id:clientId,marque,modele,immat,carburant,boite,portes,vin,kilometrage:km,created_by:session.user.id});
  if(error){toast("Erreur : "+error.message,"error");return;}
  await jlog("Ajout véhicule",`${marque} ${modele} (${immat})`,``);
  await loadAllData(); toast("Véhicule ajouté !");
}

function devisTotHT(){
  const htPieces=dLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0);
  const inputMO=document.getElementById('dv_mo_unique');
  const valMO=inputMO?(+inputMO.value.replace(/\s/g,'')||0):(dLignesMO[0]?.p||0);
  return htPieces+valMO;
}
function updateDevisTotals(){
  const htPieces=dLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0);
  const inputMO=document.getElementById('dv_mo_unique');
  const valMO=inputMO?(+inputMO.value.replace(/\s/g,'')||0):(dLignesMO[0]?.p||0);
  const ht=htPieces+valMO;
  const tv=+(data.params.tva_taux||18);
  const tva=ht*tv/100;
  const ttc=ht+tva;
  const acompteVal=$("dv_acompte")?.value;
  const acompte=(acompteVal!==""&&acompteVal!==undefined)?(+acompteVal.replace(/\s/g,'')||0):(+dMemo.acompte||0);
  const reste=ttc-acompte;
  if($("dv_tot_pieces")) $("dv_tot_pieces").textContent=f(htPieces);
  if($("dv_tot_mo")) $("dv_tot_mo").textContent=f(valMO);
  if($("dv_tot_ht")) $("dv_tot_ht").textContent=f(ht);
  if($("dv_tot_tva")) $("dv_tot_tva").textContent=f(tva);
  if($("dv_tot_ttc")) $("dv_tot_ttc").textContent=f(ttc);
  if($("dv_reste")) $("dv_reste").textContent=f(reste>0?reste:0);
}
function remplirVehiculeDevis(clientId){
  dMemo.client=clientId;
  const mes=data.vehicules.filter(v=>v.client_id===clientId);
  const sel=document.getElementById('dv_select_vehicule');
  if(sel){
    if(mes.length===0){sel.innerHTML='<option value="">Aucun véhicule</option>';dMemo.veh="";dMemo.immat="";dMemo.km="";dMemo.vehicule_id="";}
    else{sel.innerHTML=mes.map(v=>`<option value="${v.id}" ${v.immat===dMemo.immat?'selected':''}>${e(v.marque)} ${e(v.modele)} (${e(v.immat)})</option>`).join("");changerVehiculeDevis(mes[0].id);}
  }
  const cl=data.clients.find(c=>c.id===clientId);
  const dispTel=document.getElementById('dv_display_tel');
  const dispAdr=document.getElementById('dv_display_adr');
  const dispImmat=document.getElementById('dv_display_immat');
  const dispKm=document.getElementById('dv_display_km');
  if(dispTel) dispTel.textContent=cl?(cl.tel||"—"):"—";
  if(dispAdr) dispAdr.textContent=cl?(cl.adr||"—"):"—";
  if(dispImmat) dispImmat.textContent=dMemo.immat||"—";
  if(dispKm) dispKm.textContent=dMemo.km||"—";
}
function changerVehiculeDevis(vehiculeId){
  const v=data.vehicules.find(x=>x.id===vehiculeId);
  if(!v) return;
  dMemo.veh=v.marque+" "+v.modele;
  dMemo.immat=v.immat;
  dMemo.km=v.kilometrage||"";
  dMemo.vehicule_id=v.id;
  if(document.getElementById('dv_display_immat')) document.getElementById('dv_display_immat').textContent=v.immat;
  if(document.getElementById('dv_display_modele')) document.getElementById('dv_display_modele').textContent=dMemo.veh;
  if(document.getElementById('dv_display_km')) document.getElementById('dv_display_km').textContent=v.kilometrage?v.kilometrage.toLocaleString('fr-FR'):"—";
  if(document.getElementById('dv_display_carb')) document.getElementById('dv_display_carb').textContent=v.carburant||"—";
}
function majTechniciensDevis(){

}
function ajouterMotifDevis(){
  const checkboxes=document.querySelectorAll('.dv-motif-cb:checked');
  if(checkboxes.length===0){alert("Veuillez cocher au moins un motif.");return;}
  if(!dMemo.motifs) dMemo.motifs=[];
  let ajout=false;
  checkboxes.forEach(cb=>{if(!dMemo.motifs.includes(cb.value)){dMemo.motifs.push(cb.value);ajout=true;}cb.checked=false;});
  if(ajout){renderFormulaireDevis(document.getElementById('contenu-devis'));}else{alert("Déjà dans la liste.");}
}
function supprimerMotifDevis(motif){
  if(!dMemo.motifs) return;
  dMemo.motifs=dMemo.motifs.filter(m=>m!==motif);
  renderFormulaireDevis(document.getElementById('contenu-devis'));
}

/* ============================================================
   DEVIS — CALCUL DES TOTAUX (source de vérité = JS)
   ============================================================ */
function updateDevisTotals(){
  const htPieces = dLignes.reduce((a, x) => a + (parseFloat(x.q) || 0) * (parseFloat(x.p) || 0), 0);
  const valMO    = parseFloat(dLignesMO[0]?.p) || 0;
  const ht       = htPieces + valMO;
  const tv       = +(data.params.tva_taux || 18);
  const tva      = ht * tv / 100;
  const ttc      = ht + tva;
  const acompte  = parseFloat(dMemo.acompte) || 0;
  const reste    = ttc - acompte;
  const set = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = f(val); };
  set('dv_tot_pieces', htPieces);
  set('dv_tot_mo',     valMO);
  set('dv_tot_ht',     ht);
  set('dv_tot_tva',    tva);
  set('dv_tot_ttc',    ttc);
  set('dv_reste',      reste > 0 ? reste : 0);
}

/* Total HT "pur JS" utilisé à l'enregistrement */
function devisTotHT(){
  const htPieces = dLignes.reduce((a, x) => a + (parseFloat(x.q) || 0) * (parseFloat(x.p) || 0), 0);
  const valMO    = parseFloat(dLignesMO[0]?.p) || 0;
  return htPieces + valMO;
}

/* ============================================================
   DEVIS — HELPERS LIGNES PIÈCES
   ============================================================ */
function ajouterLigneDevis(){
  dLignes.push({d:'', q:1, p:0});
  renderFormulaireDevis(document.getElementById('contenu-devis'));
}
function supprimerLigneDevis(i){
  dLignes.splice(i, 1);
  if(dLignes.length === 0) dLignes = [{d:'', q:1, p:0}];
  renderFormulaireDevis(document.getElementById('contenu-devis'));
}
function viderLignesDevis(){
  dLignes = [{d:'', q:1, p:0}];
  renderFormulaireDevis(document.getElementById('contenu-devis'));
}
function incrementerQteDevis(i){
  dLignes[i].q = (parseFloat(dLignes[i].q) || 0) + 1;
  const el = document.getElementById('dv_q_' + i);
  if(el) el.value = dLignes[i].q;
  updateDevisTotals();
}
function decrementerQteDevis(i){
  dLignes[i].q = Math.max(1, (parseFloat(dLignes[i].q) || 1) - 1);
  const el = document.getElementById('dv_q_' + i);
  if(el) el.value = dLignes[i].q;
  updateDevisTotals();
}

/* ============================================================
   DEVIS — CLIENT / VÉHICULE
   ============================================================ */
function remplirVehiculeDevis(clientId){
  dMemo.client = clientId;
  const cl = data.clients.find(c => c.id === clientId) || {};
  const telEl = document.getElementById('dv_display_tel');
  const adrEl = document.getElementById('dv_display_adr');
  if(telEl) telEl.textContent = cl.tel || '—';
  if(adrEl) adrEl.textContent = cl.adr || '—';

  const mes = data.vehicules.filter(v => v.client_id === clientId);
  const sel = document.getElementById('dv_select_vehicule');
  if(!sel) return;
  if(mes.length === 0){
    sel.innerHTML = '<option value="">Aucun véhicule</option>';
    dMemo.veh = ""; dMemo.immat = ""; dMemo.km = ""; dMemo.vehicule_id = "";
    majAffichageVehiculeDevis({});
    return;
  }
  sel.innerHTML = mes.map(v =>
    `<option value="${v.id}" ${v.id===dMemo.vehicule_id?'selected':''}>${e(v.marque)} ${e(v.modele)} (${e(v.immat)})</option>`
  ).join("");
  // Sélectionne le véhicule courant ou le premier
  const choix = mes.find(v => v.id === dMemo.vehicule_id) || mes[0];
  changerVehiculeDevis(choix.id);
}

function changerVehiculeDevis(vehiculeId){
  const v = data.vehicules.find(x => x.id === vehiculeId) || {};
  dMemo.vehicule_id = v.id || "";
  dMemo.veh        = v.marque && v.modele ? `${v.marque} ${v.modele}` : "";
  dMemo.immat      = v.immat || "";
  dMemo.km         = v.kilometrage || 0;
  majAffichageVehiculeDevis(v);
}

function majAffichageVehiculeDevis(v){
  const set = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
  set('dv_display_immat',  v.immat || '—');
  set('dv_display_modele', v.marque && v.modele ? `${v.marque} ${v.modele}` : '—');
  set('dv_display_carb',   v.carburant || '—');
  set('dv_display_km',     v.kilometrage ? (+v.kilometrage).toLocaleString('fr-FR') : '—');
}

/* ============================================================
   DEVIS — SAUVEGARDE
   ============================================================ */
async function sauvegarderDevisDepuisModal(isBrouillon = false){
    const cid = $("dv_client").value;
    if(!cid){ toast("Veuillez choisir un client.", "error"); return; }
    if(!dMemo.motifs || dMemo.motifs.length === 0){ toast("Veuillez ajouter au moins un motif.", "error"); return; }
    if(!dMemo.immat){ toast("Veuillez sélectionner un véhicule.", "error"); return; }

    const clientNom = data.clients.find(c => c.id === cid)?.nom || "Inconnu";
    
    // --- Lignes pièces et MO ---
    const lignesPieces = dLignes.filter(l => (l.d || "").trim()).map(l => ({ d: l.d, q: parseFloat(l.q) || 1, p: parseFloat(l.p) || 0, stock_id: l.stock_id || null }));
    const valMO = parseFloat(dLignesMO[0]?.p) || 0;
    const lignesMO = valMO > 0 ? [{ d: "Main d'œuvre", q: 1, p: valMO }] : [];
    const lignes = [...lignesPieces.map(l => ({ ...l, t: "Pièce" })), ...lignesMO.map(l => ({ ...l, t: "Main d'œuvre" }))];

    // --- Totaux ---
    const ht = devisTotHT();
    const tv = +(data.params.tva_taux || 18);
    const tva = ht * tv / 100;
    const ttc = ht + tva;

    // --- CORRECTION ICI : Gestion sécurisée de technicien_id ---
    // On s'assure que si c'est une liste, on ne prend que le premier ID valide, 
    // ou on met null si la colonne en BDD n'accepte pas les listes.
    let techIdToSave = null;
    if(dMemo.technicien_id && typeof dMemo.technicien_id === 'string'){
        // Si c'est une liste "id1,id2", on prend le premier pour éviter l'erreur UUID
        const ids = dMemo.technicien_id.split(',').filter(id => id.trim() !== '');
        if(ids.length > 0) techIdToSave = ids[0].trim();
    } else {
        techIdToSave = dMemo.technicien_id || null;
    }

    const payload = {
        client_id: cid,
        client_nom: clientNom,
        vehicule: dMemo.veh,
        immat: dMemo.immat,
        kilometrage: +dMemo.km || 0,
        motif: dMemo.motifs.join(", "),
        motifs: dMemo.motifs,
        delai: ($("dv_delai")?.value.trim()) || "Non spécifié",
        paiement: ($("dv_paiement")?.value) || "Espèces",
        garantie: ($("dv_garantie")?.value.trim()) || "Aucune",
        acompte: parseFloat(dMemo.acompte) || 0,
        lignes,
        total_ht: ht,
        tva,
        total_ttc: ttc,
        technicien: dMemo.technicien || "",
        technicien_id: techIdToSave, // Utilisation de la variable corrigée
        notes: $("dv_notes")?.value || ""
    };

    try{
        if(editDevisId){
            payload.statut = isBrouillon ? "Brouillon" : "Validé";
            const { error } = await supa.from("devis").update(payload).eq("id", editDevisId);
            if(error) throw error;
            await jlog("Modification devis", "ID: " + editDevisId, "Montant: " + f(ttc));
            toast("Devis modifié !");
        }else{
            const { data: tous } = await supa.from("devis").select("numero").order("numero", { ascending: false }).limit(1);
            let num = 1;
            if(tous && tous.length > 0){
                const p = tous[0].numero.split("-");
                if(p.length === 3) num = parseInt(p[2]) + 1;
            }
            const numero = "DEV-" + new Date().getFullYear() + "-" + String(num).padStart(4, "0");
            payload.numero = numero;
            payload.statut = isBrouillon ? "Brouillon" : "Validé";
            payload.created_by = session.user.id;
            const { error } = await supa.from("devis").insert(payload);
            if(error) throw error;
            await jlog("Création devis", numero, "Montant: " + f(ttc));
            toast("Devis enregistré !");
        }
        document.getElementById('modal-devis').remove();
        editDevisId = null;
        dLignes = [{d:"", q:1, p:0}];
        dLignesMO = [{d:"Main d'œuvre", q:1, p:0}];
        dMemo = { client:"", veh:"", immat:"", km:"", motif:"", delai:"", paiement:"", garantie:"", acompte:"", vehicule_id:"", motifs:[], technicien:"", technicien_id:"", notes:"" };
        await loadAllData();
    }catch(err){
        console.error("Erreur sauvegarde devis:", err);
        toast("Erreur : " + err.message, "error");
    }
}

function editDevis(id){
  const d = data.devis.find(x => x.id === id);
  if(!d) return;
  editDevisId = id;

  dMemo = {
    client: d.client_id || "",
    veh: d.vehicule || "",
    immat: d.immat || "",
    km: d.kilometrage || "",
    motif: d.motif || "",
    delai: d.delai || "",
    paiement: d.paiement || "",
    garantie: d.garantie || "",
    acompte: d.acompte || "",
    vehicule_id: "",
    motifs: d.motifs || (d.motif ? d.motif.split(',').map(m => m.trim()).filter(m => m) : []),
    technicien: d.technicien || "",
    technicien_id: d.technicien_id || "",
    notes: d.notes || ""
  };

  dLignes = []; dLignesMO = [];
  if(d.lignes && d.lignes.length){
    d.lignes.forEach(l => {
      if(l.t === "Main d'œuvre") dLignesMO.push({ d: l.d || "Main d'œuvre", q: 1, p: parseFloat(l.p) || 0 });
      else dLignes.push({ d: l.d || "", q: l.q || 1, p: parseFloat(l.p) || 0, stock_id: l.stock_id || null });
    });
  }
  if(dLignes.length === 0)   dLignes   = [{d:"", q:1, p:0}];
  if(dLignesMO.length === 0) dLignesMO = [{d:"Main d'œuvre", q:1, p:0}];

  // Retrouver l'id du véhicule à partir de l'immat pour pré-sélection
  const v = data.vehicules.find(x => x.immat === d.immat && x.client_id === d.client_id);
  if(v) dMemo.vehicule_id = v.id;

  render();
}

function chercherDevis(valeur){q=valeur;dv_page=1;renderDevis(document.getElementById('app'));}
async function deleteDevis(id){
  if(profil.role!=="PDG") return;
  if(!confirm("Supprimer ?")) return;
  const d=data.devis.find(x=>x.id===id);
  await supa.from("devis").delete().eq("id",id);
  await jlog("Suppression devis",d?.numero||id,`Client: ${d?.client_nom||'Inconnu'}`);
  await loadAllData();
}
function preparerFactureDepuisDevis(idDevis){
  const d=data.devis.find(x=>x.id===idDevis);
  if(!d){toast("Devis introuvable.","error");return;}
  editFactureId=null;
  fMemo={client:d.client_id,veh:d.vehicule,immat:d.immat,acompte:d.acompte||"",paiement:d.paiement||"",technicien:"",technicien_id:"",motifs:d.motifs||(d.motif?d.motif.split(',').map(m=>m.trim()).filter(m=>m):[]),notes:d.notes||""};
  fLignes=[];fLignesMO=[];
  if(d.lignes&&d.lignes.length){d.lignes.forEach(l=>{
    if(l.t==="Main d'œuvre") fLignesMO.push({d:l.d||"",q:1,p:l.p||0});
    else fLignes.push({d:l.d||"",q:l.q||1,p:l.p||0,stock_id:l.stock_id||null});
  });}
  if(fLignes.length===0) fLignes=[{d:"",q:1,p:0}];
  if(fLignesMO.length===0) fLignesMO=[{d:"",q:1,p:0}];
  tab="Factures"; render();
  setTimeout(()=>{ouvrirModalFacture(null,true);},500);
}

function factTotHT(){
  const htPieces=fLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0);
  const inputMO=document.getElementById('fc_mo_unique');
  const valMO=inputMO?(+inputMO.value.replace(/\s/g,'')||0):(fLignesMO[0]?.p||0);
  return htPieces+valMO;
}
function updateFactTotals(){
  const htPieces=fLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0);
  const inputMO=document.getElementById('fc_mo_unique');
  const valMO=inputMO?(+inputMO.value.replace(/\s/g,'')||0):(fLignesMO[0]?.p||0);
  const ht=htPieces+valMO;
  const tv=+(data.params.tva_taux||18);
  const tva=ht*tv/100,ttc=ht+tva;
  const acompteVal=$("fc_acompte")?.value;
  const acompte=(acompteVal!==""&&acompteVal!==undefined)?(+acompteVal.replace(/\s/g,'')||0):(+fMemo.acompte||0);
  const reste=ttc-acompte;
  if($("fc_tot_pieces")) $("fc_tot_pieces").textContent=f(htPieces);
  if($("fc_tot_mo")) $("fc_tot_mo").textContent=f(valMO);
  if($("fc_tot_ht")) $("fc_tot_ht").textContent=f(ht);
  if($("fc_tot_tva")) $("fc_tot_tva").textContent=f(tva);
  if($("fc_tot_ttc")) $("fc_tot_ttc").textContent=f(ttc);
  if($("fc_reste")) $("fc_reste").textContent=f(reste>0?reste:0);
}
function remplirVehiculeFacture(clientId){
  fMemo.client=clientId;
  const mes=data.vehicules.filter(x=>x.client_id===clientId);
  if(mes.length>0){
    fMemo.veh=mes[0].marque+" "+mes[0].modele;
    fMemo.immat=mes[0].immat;
  }else{fMemo.veh="";fMemo.immat="";}
  renderFormulaireFacture(document.getElementById('contenu-facture'));
}
function changerVehiculeFacture(vehiculeId){
  const v=data.vehicules.find(x=>x.id===vehiculeId);
  if(v){fMemo.veh=v.marque+" "+v.modele;fMemo.immat=v.immat;}
  else{fMemo.veh="";fMemo.immat="";}
  renderFormulaireFacture(document.getElementById('contenu-facture'));
}
function rechercherPieceFacture(index,valeur){
  fLignes[index].d=valeur;
  const art=data.stock.find(s=>s.nom.toLowerCase()===valeur.toLowerCase());
  if(art){fLignes[index].p=art.prix;fLignes[index].stock_id=art.id;
    const pi=document.getElementById(`fc_p_${index}`);if(pi) pi.value=art.prix;
  }
  updateFactTotals();
}
function ouvrirModalFacture(idFacture=null,keepState=false){
  if(!idFacture&&!keepState){
    editFactureId=null;fLignes=[{d:"",q:1,p:0}];fLignesMO=[{d:"",q:1,p:0}];
    fMemo={client:"",veh:"",immat:"",acompte:"",paiement:"",technicien:"",technicien_id:"",motifs:[],notes:""};
  }
  const modal=document.createElement('div');
  modal.className='modal-overlay';
  modal.id='modal-facture';
  modal.innerHTML=`<div id="contenu-facture" class="modal-devis-custom"></div>`;
  document.body.appendChild(modal);

function ajouterMotifFacture(){
  const checkboxes=document.querySelectorAll('.fc-temp-cb:checked');
  if(checkboxes.length===0){toast("Veuillez cocher au moins un motif.","error");return;}
  if(!fMemo.motifs) fMemo.motifs=[];
  let ajout=false;
  checkboxes.forEach(cb=>{if(!fMemo.motifs.includes(cb.value)){fMemo.motifs.push(cb.value);ajout=true;}cb.checked=false;});
  if(ajout) renderFormulaireFacture(document.getElementById('contenu-facture'));
  else toast("Déjà ajoutés.","info");
}
function supprimerMotifFacture(motif){
  if(!fMemo.motifs) return;
  fMemo.motifs=fMemo.motifs.filter(m=>m!==motif);
  renderFormulaireFacture(document.getElementById('contenu-facture'));
}
function majTechniciensFacture(){
  const checked=document.querySelectorAll('.fc-tech-cb:checked');
  fMemo.technicien_id=Array.from(checked).map(cb=>cb.value).join(',');
  fMemo.technicien=Array.from(checked).map(cb=>cb.getAttribute('data-nom')).join(', ');
  document.querySelectorAll('.fc-tech-cb').forEach(cb=>{
    const label=cb.parentElement,span=label.querySelector('span');
    if(cb.checked){label.style.borderColor='#e50914';span.style.color='#fff';}
    else{label.style.borderColor='transparent';span.style.color='#a1a1aa';}
  });
}

async function sauvegarderFactureDepuisModal(isBrouillon=false){
  const cid=$("fc_client").value;
  if(!cid){toast("Veuillez choisir un client.","error");return;}
  const clientNom=data.clients.find(c=>c.id===cid)?.nom||"Inconnu";
  const acompte=+($("fc_acompte")?$("fc_acompte").value.replace(/\s/g,''):"0")||0;
  const paiement=$("fc_paiement").value||"";
  const notes=$("fc_notes")?$("fc_notes").value:"";
  const lignes=fLignes.filter(l=>l.d.trim()!=="");
  const inputMO=document.getElementById('fc_mo_unique');
  const valMO=inputMO?(+inputMO.value.replace(/\s/g,'')||0):0;
  const lignesMO=valMO>0?[{d:"Main d'œuvre",q:1,p:valMO}]:[];
  const toutesLesLignes=[...lignes.map(l=>({...l,t:"Pièce"})),...lignesMO.map(l=>({...l,t:"Main d'œuvre"}))];
  const ht=factTotHT(),tv=+(data.params.tva_taux||18),tva=ht*tv/100,ttc=ht+tva;
  const dataToSave={
    client_id:cid,client_nom:clientNom,vehicule:fMemo.veh,immat:fMemo.immat,
    lignes:toutesLesLignes,total_ht:ht,tva,total_ttc:ttc,acompte,paiement,
    technicien:fMemo.technicien||"",technicien_id:fMemo.technicien_id||null,
    motif:fMemo.motifs?fMemo.motifs.join(", "):"",motifs:fMemo.motifs||[],notes
  };
  try{
    if(editFactureId){
      const{error}=await supa.from("factures").update(dataToSave).eq("id",editFactureId);
      if(error) throw error;
      await jlog("Modification facture","ID: "+editFactureId,"Montant: "+f(ttc));
      toast("Facture modifiée !");
    }else{
      const{data:toutes}=await supa.from("factures").select("numero").order("numero",{ascending:false}).limit(1);
      let num=1;
      if(toutes&&toutes.length>0){const p=toutes[0].numero.split("-");if(p.length===3) num=parseInt(p[2])+1;}
      const numero="FAC-"+new Date().getFullYear()+"-"+String(num).padStart(4,"0");
      dataToSave.numero=numero;
      dataToSave.statut=isBrouillon?"Brouillon":"En attente";
      dataToSave.created_by=session.user.id;
      const{data:newFact,error}=await supa.from("factures").insert(dataToSave).select().single();
      if(error) throw error;
      if(!isBrouillon){
        if(acompte>0){
          await supa.from("paiements").insert({facture_id:newFact.id,montant:acompte,date_paiement:new Date().toISOString().slice(0,10),mode:paiement,created_by:session.user.id});
          if(acompte>=ttc) await supa.from("factures").update({statut:"Payé"}).eq("id",newFact.id);
          else await supa.from("factures").update({statut:"En cours"}).eq("id",newFact.id);
        }
        for(const ligne of lignes){
          if(ligne.stock_id){
            const art=data.stock.find(s=>s.id===ligne.stock_id);
            if(art) await supa.from("stock").update({qte:(+art.qte||0)-(+ligne.q||0)}).eq("id",art.id);
          }
        }
      }
      await jlog("Création facture",numero,"Montant: "+f(ttc));
      toast("Facture créée !");
    }
    document.getElementById('modal-facture').remove();
    editFactureId=null;
    fLignes=[{d:"",q:1,p:0}];fLignesMO=[{d:"",q:1,p:0}];
    fMemo={client:"",veh:"",immat:"",acompte:"",paiement:"",technicien:"",technicien_id:"",motifs:[],notes:""};
    await loadAllData();
  }catch(err){console.error("Erreur sauvegarde facture:",err);toast("Erreur : "+err.message,"error");}
}
function editFacture(id){
  const fa=data.factures.find(x=>x.id===id);
  if(!fa) return;
  if(fa.statut==="Payé"){toast("Facture payée, non modifiable.","error");return;}
  editFactureId=id;
  fMemo={client:fa.client_id||"",veh:fa.vehicule||"",immat:fa.immat||"",acompte:fa.acompte||"",paiement:fa.paiement||"",technicien:fa.technicien||"",technicien_id:fa.technicien_id||"",motifs:fa.motifs||[],notes:fa.notes||""};
  fLignes=[];fLignesMO=[];
  if(fa.lignes&&fa.lignes.length){fa.lignes.forEach(l=>{
    if(l.t==="Main d'œuvre") fLignesMO.push({d:l.d||"",q:1,p:l.p||0});
    else fLignes.push({d:l.d||"",q:l.q||1,p:l.p||0,stock_id:l.stock_id||null});
  });}
  if(fLignes.length===0) fLignes=[{d:"",q:1,p:0}];
  if(fLignesMO.length===0) fLignesMO=[{d:"",q:1,p:0}];
  ouvrirModalFacture(id);
}

    const facturesAttente=data.factures.filter(fa=>fa.statut==="En attente").length;
    const montantTotal=data.factures.reduce((a,fa)=>a+(+fa.total_ttc||0),0);
    const montantImpaye=data.factures.filter(fa=>fa.statut!=="Payé").reduce((a,fa)=>a+(+fa.total_ttc||0),0);

async function deleteFacture(id){
  if(profil.role!=="PDG") return;
  if(!confirm("Supprimer cette facture ?")) return;
  const fa=data.factures.find(x=>x.id===id);
  await supa.from("factures").delete().eq("id",id);

function ouvrirModalPaiement(id){
  const fa=data.factures.find(x=>x.id===id);

  const reste=(+fa.total_ttc||0)-(+fa.acompte||0);

async function validerPaiement(id){
  const fa=data.factures.find(x=>x.id===id);
  if(!fa) return;
  const montant=+$("pai_montant").value||0;
  const mode=$("pai_mode").value;
  if(montant<=0){toast("Montant invalide.","error");return;}
  const nouveauAcompte=(+fa.acompte||0)+montant;
  const newStatut=nouveauAcompte>=(+fa.total_ttc||0)?"Payé":"En cours";
  try{
    await supa.from("paiements").insert({facture_id:id,montant,date_paiement:new Date().toISOString().slice(0,10),mode,created_by:session.user.id});
    await supa.from("factures").update({acompte:nouveauAcompte,statut:newStatut}).eq("id",id);
    await jlog("Encaissement",fa.numero,"Montant: "+f(montant));
    document.getElementById('modal-paiement').remove();
    toast("Paiement enregistré !");
    await loadAllData();
  }catch(err){toast("Erreur : "+err.message,"error");}
}

function renderStockList(type,index,stock){
  if(stock.length===0) return '<div style="text-align:center;padding:20px;color:var(--m)">Aucune pièce trouvée</div>';
  return stock.map(s=>`<div class="stock-item-row" onclick="selectStockItem('${type}',${index},'${e(s.nom).replace(/'/g,"\\'")}',${s.prix},'${s.id}')">
    <div><div style="font-weight:600">${e(s.nom)}</div><div style="font-size:12px;color:var(--m)">${e(s.categorie||'')} ${s.sous_categorie?'· '+e(s.sous_categorie):''} ${+s.qte<=+s.seuil_alerte?'<span style="color:var(--r)">⚠️</span>':''}</div></div>
    <div style="text-align:right"><div style="font-weight:700;color:var(--ok)">${f(s.prix)}</div><div style="font-size:11px;color:var(--m)">Qté: ${s.qte}</div></div>
  </div>`).join("");
}
function filterStockPicker(type,index){
  const search=document.getElementById('stock-search').value.toLowerCase();
  const cat=document.getElementById('stock-cat-filter').value;
  const filtered=data.stock.filter(s=>{
    const ms=(s.nom+' '+(s.categorie||'')+' '+(s.sous_categorie||'')).toLowerCase().includes(search);
    const mc=!cat||s.categorie===cat;
    return ms&&mc;
  });
  document.getElementById('stock-list').innerHTML=renderStockList(type,index,filtered);
}
function selectStockItem(type,index,nom,prix,stockId){
  if(type==='devis'){
    dLignes[index].d=nom;dLignes[index].p=prix;dLignes[index].stock_id=stockId;
    const input=document.getElementById(`dv_d_${index}`),pi=document.getElementById(`dv_p_${index}`);
    if(input) input.value=nom;if(pi) pi.value=prix;
    updateDevisTotals();
  }else{
    fLignes[index].d=nom;fLignes[index].p=prix;fLignes[index].stock_id=stockId;
    const input=document.getElementById(`fc_d_${index}`),pi=document.getElementById(`fc_p_${index}`);
    if(input) input.value=nom;if(pi) pi.value=prix;
    updateFactTotals();
  }
  closeStockPicker();
}

async function sauvegarderArticle(id){

async function sauvegarderTech(id){

  // On ajoute un statut par défaut "Actif"
  const payload={nom, prenom, specialite, telephone, adresse, statut: "Actif"};
  
  try{
    if(id){
        const{error}=await supa.from("techniciens").update(payload).eq("id",id);

        await jlog("Modification technicien", `${prenom} ${nom}`, "");

    toast("Technicien enregistré !");
    await loadAllData();
  }catch(err){
    toast("Erreur : "+err.message,"error");

async function sauvegarderEmploye(id){
  const nom=$("emp_nom").value.trim();
  const prenom=$("emp_prenom").value.trim();
  const poste=$("emp_poste").value.trim();
  
  if(!nom||!prenom||!poste){toast("Nom, prénom et poste obligatoires.","error");return;}

  // On garde uniquement les champs existants dans votre table pour éviter les erreurs SQL
  const payload = {
    nom: nom, 
    prenom: prenom, 
    poste: poste, 
    telephone: $("emp_tel").value.trim(), 
    salaire: +$("emp_salaire").value || 0, 
    date_embauche: $("emp_date").value || null
  };
  
  try{
    if(id){
      const{error}=await supa.from("employes").update(payload).eq("id",id);
      if(error) throw error;
    }else{
      const{error}=await supa.from("employes").insert(payload);
      if(error) throw error;
    }
    document.getElementById('modal-employe').remove();
    toast("Employé enregistré !");
    await loadAllData();
  }catch(err){
    toast("Erreur : "+err.message,"error");
  }
}
async function deleteEmploye(id){
  if(!ROLES[profil.role].can.deleteAny){toast("Non autorisé.","error");return;}
  if(!confirm("Supprimer cet employé ?")) return;
  await supa.from("employes").delete().eq("id",id);
  toast("Employé supprimé.");
  await loadAllData();
}

/* ============================================================
