function toast(message, type = 'success') {
let container = document.getElementById('toast-container');
if (!container) {
container = document.createElement('div');
container.id = 'toast-container';
container.className = 'toast-container';
document.body.appendChild(container);
}
const t = document.createElement('div');
t.className = 'toast';
t.style.borderLeftColor = type === 'error' ? 'var(--r)' : (type === 'info' ? 'var(--blue)' : 'var(--ok)');
t.innerHTML = '<span>' + (type === 'error' ? '❌' : (type === 'info' ? 'ℹ️' : '✅')) + '</span> ' + message;
container.appendChild(t);
setTimeout(function() { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = 'all 0.3s'; setTimeout(function() { t.remove(); }, 300); }, 3500);
}

function activerDesactivationAutoErreurs() {

const msgErreur = document.querySelector('.msg-erreur');
if (msgErreur) msgErreur.remove();
};
document.addEventListener('focus', (ev) => nettoyerErreur(ev.target), true);
document.addEventListener('input', (ev) => nettoyerErreur(ev.target), true);
document.addEventListener('change', (ev) => nettoyerErreur(ev.target), true);
}

supa.from("factures").select("*").order("created_at",{ascending:false}).then(r=>data.factures=r.data||[]),
supa.from("rdv").select("*").order("date_rdv", {ascending:true}).then(r=>data.rdv=r.data||[]),
supa.from("vehicules").select("*").then(r=>data.vehicules=r.data||[]),
supa.from("employes").select("*").order("nom").then(r=>data.employes=r.data||[]),
supa.from("paie").select("*").then(r=>data.paie=r.data||[]),
supa.from("depenses").select("*").order("date_depense", {ascending:false}).then(r=>data.depenses=r.data||[]),
supa.from("fournisseurs").select("*").order("nom").then(r=>data.fournisseurs=r.data||[]),
supa.from("commandes").select("*").order("date_commande", {ascending:false}).then(r=>data.commandes=r.data||[]),
supa.from("parametres").select("*").then(r=>{ data.params = {}; (r.data||[]).forEach(p=>data.params[p.cle]=p.valeur); })
];
if (R.can.editStock) tasks.push(supa.from("stock").select("*").order("nom").then(r=>data.stock=r.data||[]));
if (R.can.viewAudit) tasks.push(supa.from("journal").select("*").order("created_at",{ascending:false}).limit(300).then(r=>data.journal=r.data||[]));
await Promise.all(tasks); render();
if (!window.realtimeChannel) {
window.realtimeChannel = supa.channel('custom-all-channel')
.on('postgres_changes', { event: '*', schema: 'public', table: 'factures' }, payload => { loadAllData(); })

.on('postgres_changes', { event: '*', schema: 'public', table: 'devis' }, payload => { loadAllData(); })
.on('postgres_changes', { event: '*', schema: 'public', table: 'rdv' }, payload => { loadAllData(); })
.subscribe();
}
}

function animateCounter(element, target, duration = 1000) {
const startTime = performance.now();
function update(currentTime) {
const elapsed = currentTime - startTime;
const progress = Math.min(elapsed / duration, 1);
const eased = 1 - Math.pow(1 - progress, 3);
element.textContent = f(Math.floor(target * eased));
if (progress < 1) requestAnimationFrame(update);
}
requestAnimationFrame(update);
}

async function addRdv() {
if (!ROLES[profil.role].can.editClients) return;
const cid = $("rd_client").value; if (!cid) { alert("Choisissez un client."); return; }
const d = $("rd_date").value; if (!d) { alert("Choisissez une date."); return; }
const { error } = await supa.from("rdv").insert({
client_id: cid, client_nom: data.clients.find(c=>c.id===cid).nom,
vehicule: ($("rd_marque").value.trim() + " " + $("rd_modele").value.trim()).trim(), immat: $("rd_immat").value.trim(),
date_rdv: d, heure_rdv: $("rd_heure").value, motif: $("rd_motif").value.trim(), created_by: session.user.id
});
if (error) { alert("Erreur : "+error.message); return; }
await jlog("Nouveau RDV", cid + " le " + d, ""); await loadAllData();
}

function autoRemplirPlanning(clientId) {
if (!clientId) return;
const v = data.vehicules.find(x => x.client_id === clientId);
if (v) { if ($("rd_marque")) $("rd_marque").value = v.marque; if ($("rd_modele")) $("rd_modele").value = v.modele; if ($("rd_immat")) $("rd_immat").value = v.immat; }
else { if ($("rd_marque")) $("rd_marque").value = ""; if ($("rd_modele")) $("rd_modele").value = ""; if ($("rd_immat")) $("rd_immat").value = ""; }
}

async function deleteRdv(id) { if (!confirm("Annuler ce RDV ?")) return; await supa.from("rdv").delete().eq("id", id); await loadAllData(); }

function changerMois(delta) {
let [annee, mois] = dateCalendrier.split('-');
let d = new Date(annee, parseInt(mois) - 1 + delta, 1);
dateCalendrier = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
jourSelectionne = null; render();
}

const nbJours = dernierJour.getDate();
const jourDebut = premierJour.getDay() === 0 ? 6 : premierJour.getDay() - 1;
const nomsMois = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

async function definirRappel(clientId) {
const cl = data.clients.find(c => c.id === clientId);
if (!cl) return;
let type = prompt("Type de rappel pour " + cl.nom + " ?\n1 = Diagnostic général\n2 = Rappel d'entretien périodique\n3 = Changement de filtre", "2");
if (type === null) return;
if (type === "1") type = "Diagnostic général";
else if (type === "3") type = "Changement de filtre";
else type = "Rappel d'entretien périodique";
const km = prompt("Rappel pour " + cl.nom + " : À quel kilométrage ? (ex: 65000)", cl.prochain_km || "");
if (km === null) return;
const mois = prompt("Dans combien de mois souhaitez-vous rappeler " + cl.nom + " ? (ex: 6)", "6");
if (mois === null) return;
let dateStr = null;
if (mois && !isNaN(mois)) {
let d = new Date();
d.setMonth(d.getMonth() + parseInt(mois));
dateStr = d.toISOString().slice(0, 10);
}
const v = data.vehicules.find(x => x.client_id === clientId);
const veh = v ? `${v.marque} ${v.modele} (${v.immat})` : "";
const { error } = await supa.from("clients").update({ prochain_km: +km || 0, prochaine_date: dateStr, vehicule_rappel: veh, type_rappel: type }).eq("id", clientId);
if (error) { alert("Erreur : " + error.message); return; }
await jlog("Rappel modifié", `${cl.nom}`, `Type: ${type}, Km: ${km}, Dans: ${mois} mois`);
await loadAllData();
toast("✅ Rappel programmé dans " + mois + " mois !");
}

let d = new Date();
d.setMonth(d.getMonth() + mois);
const dateVal = d.toISOString().slice(0, 10);
const cl = data.clients.find(c => c.id === clientRappelId);

async function nextRef(type) {
const prefix = type === "Société" ? "SOC" : "PART";
const { data: rows } = await supa.from("clients").select("ref").like("ref", prefix + "-%");
const numeros = (rows || []).map(r => parseInt(r.ref.split("-")[1], 10) || 0);
const max = numeros.length > 0 ? Math.max(...numeros) : 0;
return prefix + "-" + String(max + 1).padStart(4, "0");
}

async function addClient() {
if (!ROLES[profil.role].can.editClients) { alert("Non autorisé."); return; }
const type = $("cl_type").value, nom = $("cl_nom").value.trim(), tel = $("cl_tel").value.trim(), adr = $("cl_adr").value.trim();
if (!nom) { alert("Le nom est obligatoire."); return; }
if (!/^\d{9}$/.test(tel)) { alert("Le téléphone doit contenir exactement 9 chiffres."); return; }
if (!adr) { alert("L'adresse est obligatoire."); return; }
const ref = await nextRef(type);
const { data: newClient, error } = await supa.from("clients").insert({ref, type, nom, tel, adr, contact: "", nif: "", created_by: session.user.id}).select().single();
if (error) { alert("Erreur client : "+error.message); return; }
if ($("cl_add_veh") && $("cl_add_veh").checked) {
const marque = $("v_marque").value.trim(), modele = $("v_modele").value.trim(), immat = $("v_immat").value.trim();
const carburant = $("v_carb").value, boite = $("v_boite").value, portes = +$("v_portes").value || 0, vin = $("v_vin").value.trim(), km = +$("v_km").value || 0;
if (marque && modele && immat) { await supa.from("vehicules").insert({ client_id: newClient.id, marque, modele, immat, carburant, boite, portes, vin, kilometrage: km, created_by: session.user.id }); }
}
await jlog("Création client", `${ref} — ${nom}`, `Type: ${type}`);
await loadAllData();
}

async function deleteClient(id) {
if (!ROLES[profil.role].can.deleteAny) { alert("Seul le PDG peut supprimer."); return; }
if (!confirm("Supprimer ce client et tous ses devis/factures ?")) return;
const c = data.clients.find(x => x.id === id);
await supa.from("clients").delete().eq("id", id);
await jlog("Suppression client", c?.ref || id, `Nom: ${c?.nom || 'Inconnu'}`);
await loadAllData();
}

async function ajouterVehicule(clientId) {
if (!clientId) { alert("Erreur : client non identifié."); return; }
const marqueEl = $("v_marque"), modeleEl = $("v_modele"), immatEl = $("v_immat");
if (!marqueEl || !modeleEl || !immatEl) { alert("Formulaire véhicule introuvable."); return; }
const marque = marqueEl.value.trim(), modele = modeleEl.value.trim(), immat = immatEl.value.trim();
const carburant = $("v_carb")?.value || "", boite = $("v_boite")?.value || "", portes = +($("v_portes")?.value) || 0, vin = $("v_vin")?.value.trim() || "", km = +($("v_km")?.value) || 0;
if (!marque || !modele || !immat) { alert("Marque, Modèle et Immatriculation sont obligatoires."); return; }
const { error } = await supa.from("vehicules").insert({ client_id: clientId, marque, modele, immat, carburant, boite, portes, vin, kilometrage: km, created_by: session.user.id });
if (error) { alert("Erreur : " + error.message); return; }
await jlog("Ajout véhicule", `${marque} ${modele} (${immat})`, `Client ID: ${clientId}`);
await loadAllData(); toast("Véhicule ajouté avec succès !");
}

async function deleteVehicule(id) {
if (profil.role !== "PDG") { alert("Seul le PDG peut supprimer un véhicule."); return; }

const v = data.vehicules.find(x => x.id === id);
await supa.from("vehicules").delete().eq("id", id);
await jlog("Suppression véhicule", v?.immat || id, `Véhicule: ${v?.marque} ${v?.modele}`);
await loadAllData();
}

function validerDevis() {
document.querySelectorAll('.erreur').forEach(el => el.classList.remove('erreur'));
const erreurs = [];
const dv_client = $("dv_client"); if (!dv_client.value) { dv_client.classList.add('erreur'); erreurs.push("• Client"); }
if (!dMemo.veh) erreurs.push("• Véhicule");
if (!dMemo.immat) erreurs.push("• Immatriculation");
const dv_motif = $("dv_motif");
const motifValide = dv_motif.value.trim() || (dMemo.motifs && dMemo.motifs.length > 0);
if (!motifValide) { dv_motif.classList.add('erreur'); erreurs.push("• Motif"); }
const dv_delai = $("dv_delai"); if (!dv_delai.value.trim()) { dv_delai.classList.add('erreur'); erreurs.push("• Délai"); }
const dv_paiement = $("dv_paiement"); if (!dv_paiement.value) { dv_paiement.classList.add('erreur'); erreurs.push("• Mode de paiement"); }
const dv_garantie = $("dv_garantie"); if (!dv_garantie.value.trim()) { dv_garantie.classList.add('erreur'); erreurs.push("• Garantie"); }
const dv_acompte = $("dv_acompte"); if (dv_acompte.value === "" || +dv_acompte.value < 0) { dv_acompte.classList.add('erreur'); erreurs.push("• Acompte"); }
const lignesPieces = dLignes.filter(l => l.d.trim()); const lignesMO = dLignesMO.filter(l => l.d.trim());
if (lignesPieces.length === 0 && lignesMO.length === 0) erreurs.push("• Au moins une pièce OU main d'œuvre");
dLignes.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push("• Prix manquant : " + l.d); });
dLignesMO.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push("• Coût manquant : " + l.d); });
return erreurs;
}

function supprimerLigneDevis(index) {
dLignes.splice(index, 1);
if (dLignes.length === 0) dLignes = [{d:"",q:1,p:0}];
renderDevis(document.getElementById('app'));
}

function supprimerLigneFacture(index) {
fLignes.splice(index, 1);
if (fLignes.length === 0) fLignes = [{d:"",q:1,p:0}];
renderFactures(document.getElementById('app'));
}

async function saveDevis() {
const erreurs = validerDevis();
if (erreurs.length > 0) { alert("⚠️ Champs obligatoires manquants :\n" + erreurs.join("\n")); return; }
const cid = $("dv_client").value;
const clientNom = data.clients.find(c=>c.id===cid)?.nom || "Inconnu";
const lignesPieces = dLignes.filter(l=>l.d.trim()); const lignesMO = dLignesMO.filter(l=>l.d.trim());
const lignes = [...lignesPieces.map(l => ({...l, t: "Pièce"})), ...lignesMO.map(l => ({...l, t: "Main d'œuvre"}))];
const ht = devisTotHT(), tv = +(data.params.tva_taux||18), tva = ht*tv/100, ttc = ht+tva;
const acompte = +$("dv_acompte").value || 0;
if (editDevisId) {
const { error } = await supa.from("devis").update({ client_id: cid, client_nom: clientNom, vehicule: dMemo.veh, immat: dMemo.immat, kilometrage: +dMemo.km || 0, motif: $("dv_motif").value.trim(), motifs: dMemo.motifs || [], delai: $("dv_delai").value.trim(), paiement: $("dv_paiement").value, garantie: $("dv_garantie").value.trim(), acompte: acompte, lignes, total_ht: ht, tva, total_ttc: ttc }).eq("id", editDevisId);
if (error) { alert("Erreur : "+error.message); return; }
editDevisId = null; dLignes = [{d:"",q:1,p:0}]; dLignesMO = [{d:"",q:1,p:0}]; dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "", vehicule_id: "", motifs: [] };
await loadAllData(); toast("Devis modifié !"); return;
}
try {
const { data: tousDevis } = await supa.from("devis").select("numero").order("numero", { ascending: false }).limit(1);
let num = 1;
if (tousDevis && tousDevis.length > 0) { const dernierNumero = tousDevis[0].numero; const parties = dernierNumero.split("-"); if (parties.length === 3) num = parseInt(parties[2]) + 1; }
const numero = "DEV-" + new Date().getFullYear() + "-" + String(num).padStart(4,"0");
const { error } = await supa.from("devis").insert({ numero, client_id: cid, client_nom: clientNom, vehicule: dMemo.veh, immat: dMemo.immat, kilometrage: +dMemo.km || 0, motif: $("dv_motif").value.trim(), motifs: dMemo.motifs || [], delai: $("dv_delai").value.trim(), paiement: $("dv_paiement").value, garantie: $("dv_garantie").value.trim(), acompte: acompte, lignes, total_ht: ht, tva, total_ttc: ttc, statut: "Brouillon", created_by: session.user.id });
if (error) { alert("Erreur : "+error.message); return; }
await jlog("Création devis", numero, `Client: ${clientNom}, Total TTC: ${f(ttc)}, Acompte: ${f(acompte)}`);
} catch(err) { alert("Erreur : " + err.message); return; }
dLignes = [{d:"",q:1,p:0}]; dLignesMO = [{d:"",q:1,p:0}]; dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "", vehicule_id: "", motifs: [] };
await loadAllData(); toast("Devis enregistré !");
}

function preparerFactureDepuisDevis(idDevis) {
const d = data.devis.find(x => x.id === idDevis); if (!d) return;
editFactureId = null;
fMemo = { client: d.client_id, veh: d.vehicule, immat: d.immat, acompte: d.acompte || "", paiement: d.paiement || "", technicien: "", motifs: d.motifs || [] };
fLignes = d.lignes && d.lignes.length ? d.lignes.filter(l => l.t !== "Main d'œuvre").map(l => ({...l, t: "Pièce"})) : [{d:"",q:1,p:0}];
fLignesMO = d.lignes && d.lignes.length ? d.lignes.filter(l => l.t === "Main d'œuvre").map(l => ({...l})) : [{d:"",q:1,p:0}];
if (fLignes.length === 0) fLignes = [{d:"",q:1,p:0}];
if (fLignesMO.length === 0) fLignesMO = [{d:"",q:1,p:0}];
tab = "🧾 Factures"; render();
}

function factTotHT(){ const htPieces = fLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0); const htMO = fLignesMO.reduce((a,x)=>a+(+x.p||0),0); return htPieces + htMO; }

function updateFactTotals() {
const ht = factTotHT(), tv = +(data.params.tva_taux||18), ttc = ht + (ht*tv/100);
const acompteVal = $("fc_acompte")?.value;
const acompte = (acompteVal !== "" && acompteVal !== undefined && acompteVal !== null) ? +acompteVal : (+fMemo.acompte || 0);
const reste = ttc - acompte;
const elHT = document.getElementById("fc_tot_ht"); if (elHT) elHT.textContent = f(ht);
const elTVA = document.getElementById("fc_tot_tva"); if (elTVA) elTVA.textContent = f(ht*tv/100);
const el = $("fc_tot_ttc"); if (el) el.textContent = f(ttc);
const elReste = $("fc_reste"); if (elReste) elReste.textContent = f(reste > 0 ? reste : 0);
}

function remplirVehiculeFacture(clientId) {
fMemo.client = clientId;
if (!clientId) { fMemo.veh = ""; fMemo.immat = ""; fMemo.technicien = ""; }
else {
const v = data.vehicules.find(x => x.client_id === clientId);
if (v) { fMemo.veh = v.marque + " " + v.modele; fMemo.immat = v.immat; }
else { fMemo.veh = "Aucun véhicule"; fMemo.immat = "—"; }
}
const spanVeh = document.getElementById("fc_display_veh");
const spanImmat = document.getElementById("fc_display_immat");
if (spanVeh) spanVeh.textContent = fMemo.veh || "—";
if (spanImmat) spanImmat.textContent = fMemo.immat || "—";
}

function validerFacture() {
document.querySelectorAll('.erreur').forEach(el => el.classList.remove('erreur'));
const erreurs = [];
const fc_client = $("fc_client"); if (!fc_client.value) { fc_client.classList.add('erreur'); erreurs.push("• Client"); }
if (!fMemo.veh) erreurs.push("• Véhicule"); if (!fMemo.immat) erreurs.push("• Immatriculation");
const fc_acompte = $("fc_acompte"); if (fc_acompte.value === "" || +fc_acompte.value < 0) { fc_acompte.classList.add('erreur'); erreurs.push("• Acompte"); }
const fc_paiement = $("fc_paiement"); if (!fc_paiement.value) { fc_paiement.classList.add('erreur'); erreurs.push("• Mode de paiement"); }
const lignes = fLignes.filter(l => l.d.trim()); const lignesMO = fLignesMO.filter(l => l.d.trim());
if (lignes.length === 0 && lignesMO.length === 0) erreurs.push("• Au moins une pièce OU main d'œuvre");
fLignes.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push("• Prix manquant : " + l.d); });
fLignesMO.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push("• Coût manquant : " + l.d); });
const fc_technicien = $("fc_technicien");
if (!fc_technicien.value.trim()) { fc_technicien.classList.add('erreur'); erreurs.push("• Technicien(s) ayant intervenu"); }
return erreurs;
}

function editFacture(id) {
const fa = data.factures.find(x => x.id === id); if (!fa) return;
if (fa.statut === "Payé") { alert("🔒 Cette facture est payée et ne peut plus être modifiée."); return; }
editFactureId = id;
fMemo = { client: fa.client_id || "", veh: fa.vehicule || "", immat: fa.immat || "", acompte: fa.acompte || "", paiement: fa.paiement || "", technicien: fa.technicien || "", motifs: fa.motifs || [] };
fLignes = []; fLignesMO = [];
if (fa.lignes && fa.lignes.length) { fa.lignes.forEach(l => { if (l.t === "Main d'œuvre") fLignesMO.push({d: l.d || "", q: 1, p: l.p || 0}); else fLignes.push({d: l.d || "", q: l.q || 1, p: l.p || 0, stock_id: l.stock_id || null}); }); }
if (fLignes.length === 0) fLignes = [{d:"",q:1,p:0}]; if (fLignesMO.length === 0) fLignesMO = [{d:"",q:1,p:0}];
renderFactures(document.getElementById('app'));
}

function annulerEditionFacture() {
if (!confirm("Annuler la modification ?")) return;
editFactureId = null; fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "", technicien: "", motifs: [] };
renderFactures(document.getElementById('app'));
}

async function saveFactureDirecte() {
const erreurs = validerFacture();
if (erreurs.length > 0) { alert("⚠️ Champs manquants :\n" + erreurs.join("\n")); return; }
const cid = $("fc_client").value;
const clientNom = data.clients.find(c=>c.id===cid)?.nom || "Inconnu";
const veh = fMemo.veh, immat = fMemo.immat;
const acompte = +$("fc_acompte").value || 0;
const paiement = $("fc_paiement").value || "";
const technicien = $("fc_technicien") ? $("fc_technicien").value.trim() : "";
const lignes = fLignes.filter(l => l.d.trim() !== "");
const lignesMO = fLignesMO.filter(l => l.d.trim() !== "");
const toutesLesLignes = [...lignes.map(l => ({...l, t: "Pièce"})), ...lignesMO.map(l => ({...l, t: "Main d'œuvre"}))];
const ht = factTotHT(), tv = +(data.params.tva_taux||18), tva = ht * tv / 100, ttc = ht + tva;
if (editFactureId) {
const { error } = await supa.from("factures").update({
client_id: cid, client_nom: clientNom, vehicule: veh, immat: immat,
lignes: toutesLesLignes, total_ht: ht, tva, total_ttc: ttc,
acompte: acompte, paiement: paiement, technicien: technicien
}).eq("id", editFactureId);
if (error) { alert("Erreur : "+error.message); return; }
editFactureId = null; fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "", technicien: "", motifs: [] }; fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
await loadAllData(); toast("Facture modifiée !"); return;
}
try {
const { data: toutesFactures } = await supa.from("factures").select("numero").order("numero", { ascending: false }).limit(1);
let num = 1;
if (toutesFactures && toutesFactures.length > 0) { const dernierNumero = toutesFactures[0].numero; const parties = dernierNumero.split("-"); if (parties.length === 3) num = parseInt(parties[2]) + 1; }
const numero = "FAC-" + new Date().getFullYear() + "-" + String(num).padStart(4,"0");
const { error } = await supa.from("factures").insert({
numero, client_id: cid, client_nom: clientNom, vehicule: veh, immat: immat,
lignes: toutesLesLignes, total_ht: ht, tva, total_ttc: ttc, acompte: acompte,
paiement: paiement, technicien: technicien,
statut: "En attente", created_by: session.user.id
});
if (error) { alert("Erreur : "+error.message); return; }
for (const ligne of lignes) { if (ligne.stock_id) { const art = data.stock.find(s => s.id === ligne.stock_id); if (art) await supa.from("stock").update({ qte: (+art.qte || 0) - (+ligne.q || 0) }).eq("id", art.id); } }
await jlog("Création facture", numero, `Client: ${clientNom}, Technicien: ${technicien}`);
} catch(err) { alert("Erreur : " + err.message); return; }
fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "", technicien: "", motifs: [] }; fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
await loadAllData(); toast("Facture créée !");
}

async function updateStatut(id, st) {
const oldFacture = data.factures.find(fa => fa.id === id);
await supa.from("factures").update({statut:st}).eq("id", id);
await jlog("Changement statut facture", oldFacture?.numero || id, `Statut changé de "${oldFacture?.statut || 'Inconnu'}" à "${st}"`);
await loadAllData();
}

async function deleteFacture(id) {
if (profil.role !== "PDG") { alert("⛔ Seul le PDG peut supprimer une facture."); return; }
const fa = data.factures.find(x => x.id === id); if (!fa) return;
let message = "Voulez-vous vraiment supprimer la facture " + fa.numero + " ?";
if (fa.statut === "Payé") { message = "⚠️ ATTENTION : Cette facture est marquée comme PAYÉE.\nÊtes-vous sûr de vouloir la supprimer définitivement de l'historique ?"; }
if (!confirm(message)) return;
await supa.from("factures").delete().eq("id", id);
await jlog("Suppression facture", fa.numero, `Client: ${fa.client_nom}, Montant: ${f(fa.total_ttc)}, Statut: ${fa.statut}`);
await loadAllData(); toast("Facture supprimée.");
}

async function deleteDevis(id) {
if (profil.role !== "PDG") return;

function envoyerWhatsAppFacture(id) {
const fa = data.factures.find(x => x.id === id);
if (!fa) return;
const client = data.clients.find(c => c.id === fa.client_id);
if (!client || !client.tel) { alert("⚠️ Ce client n'a pas de numéro de téléphone enregistré."); return; }
let tel = client.tel.replace(/\D/g, '');
if (tel.length === 9) { tel = "224" + tel; }
const montant = f(fa.total_ttc);
const reste = (+fa.total_ttc||0) - (+fa.acompte||0);
let message = "Bonjour " + client.nom + ",\nVoici les détails de votre facture *" + fa.numero + "* chez *SPEED GARAGE PRO*.\n🚗 Véhicule : " + fa.vehicule + " (" + fa.immat + ")\n💰 Montant Total : " + montant + "\n";
if (fa.statut === "Payé") { message += "✅ Statut : *PAYÉ* (Merci de votre confiance !)\n"; }
else { message += "⏳ Reste à payer : " + f(reste) + "\n"; }
message += "\n📄 *Veuillez trouver votre facture en pièce jointe.*\nMerci de votre confiance,\nSPEED GARAGE PRO";
const url = "https://wa.me/" + tel + "?text=" + encodeURIComponent(message);
window.open(url, '_blank');
setTimeout(function() { if (confirm("WhatsApp est ouvert.\nVoulez-vous imprimer le PDF pour le joindre ?")) { printFacture(id); } }, 1000);
}

e">${e(client.tel || "")}</span></div><div class="info-line"><span class="label">Adresse :</span><span class="value">${e(client.adr || "")}</span></div></div></div><div class="info-block" style="margin-bottom: 15px;"><div class="info-block-title">Identification du Véhicule</div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px;"><div class="info-line"><span class="label">🚗 Marque / Modèle :</span><span class="value">${e(v.marque || doc.vehicule || "")} ${e(v.modele || "")}</span></div><div class="info-line"><span class="label">🔢 Immatriculation :</span><span class="value">${e(v.immat || doc.immat || "")}</span></div><div class="info-line"><span class="label">🆔 DIN / VIN :</span><span class="value">${e(v.vin || "")}</span></div><div class="info-line"><span class="label">🛣️ Kilométrage :</span><span class="value">${v.kilometrage ? v.kilometrage.toLocaleString('fr-FR') + ' km' : ''}</span></div></div></div><table class="items-table"><thead><tr><th style="width: 50%;">Désignation</th><th style="width: 12%; text-align: center;">Qté</th><th style="width: 19%; text-align: right;">PU (GNF)</th><th style="width: 19%; text-align: right;">Total (GNF)</th></tr></thead><tbody>${lignesHtml}</tbody></table><div class="totals-section"><table class="totals-table"><tr><td>Sous-total HT :</td><td>${(+doc.total_ht||0).toLocaleString("fr-FR")}</td></tr><tr><td>Remise :</td><td>0</td></tr>${acompte > 0 ? `<tr><td>Acompte versé :</td><td style="color: #c00;">- ${acompte.toLocaleString("fr-FR")}</td></tr>` : ''}<tr class="total-row"><td>${doc.statut === "Payé" ? "TOTAL PAYÉ :" : "TOTAL À PAYER :"}</td><td>${(+doc.total_ttc||0).toLocaleString("fr-FR")} GNF</td></tr>${(reste > 0 && doc.statut !== "Payé") ? `<tr><td style="color: #c00;">Reste à payer :</td><td style="color: #c00;">${reste.toLocaleString("fr-FR")} GNF</td></tr>` : ''}</table></div>
<div style="text-align: center; margin: 15px 0 10px 0; font-size: 11px; font-style: italic; color: #555;">

</div>

w.document.close();
}

function filterStockCat() { currentStockCat = $("st_cat").value; currentStockSubCat = ""; renderStock(document.getElementById('app')); }
function filterStockSubCat() { currentStockSubCat = $("st_subcat").value; renderStock(document.getElementById('app')); }

function renderStock(A) {
const filtered = data.stock.filter(s => { if (currentStockCat && s.categorie !== currentStockCat) return false; if (currentStockSubCat && s.sous_categorie !== currentStockSubCat) return false; return true; });
const subCats = currentStockCat ? stockCategories[currentStockCat] || [] : [];
A.innerHTML = `<div class="card"><b>➕ Nouvel article</b>
<div style="display:flex; gap:8px; margin-bottom:8px"><select id="st_cat" onchange="filterStockCat()" style="flex:1"><option value="">Toutes les catégories</option>${Object.keys(stockCategories).sort().map(c => `<option value="${c}" ${c === currentStockCat ? 'selected' : ''}>${c}</option>`).join("")}</select><select id="st_subcat" onchange="filterStockSubCat()" style="flex:1" ${!currentStockCat ? 'disabled' : ''}><option value="">Toutes les sous-catégories</option>${subCats.map(sc => `<option value="${sc}" ${sc === currentStockSubCat ? 'selected' : ''}>${sc}</option>`).join("")}</select></div>
<input id="st_nom" placeholder="Désignation"><div style="display:flex; gap:8px"><input id="st_qte" type="number" placeholder="Quantité" style="flex:1"><input id="st_min" type="number" placeholder="Seuil" style="flex:1"><input id="st_prix" type="number" placeholder="Prix (GNF)" style="flex:2"></div>
<button class="p" onclick="addStock()">Ajouter</button></div>
<div class="card"><input id="search_stock" placeholder="🔍 Rechercher..." value="${e(q)}" oninput="filterStock()"></div>
<div id="liste_stock_container">${Object.keys(stockCategories).filter(c => !currentStockCat || c === currentStockCat).sort().map(cat => { const articlesCat = filtered.filter(s => s.categorie === cat && (s.nom+s.categorie+(s.sous_categorie||"")).toLowerCase().includes(q.toLowerCase())); if (articlesCat.length === 0) return ""; return `<div class="card" style="background:var(--bg); margin-bottom:8px; padding:10px"><b>📦 ${cat}</b></div>${articlesCat.map(s => `<div class="card"><div class="row" style="border-top:0"><div style="flex:1"><b>${e(s.nom)}</b>${s.sous_categorie ? `<span class="tag" style="margin-left:5px">${e(s.sous_categorie)}</span>` : ""}${+s.qte<=+s.seuil_alerte?'<span class="tag" style="background:var(--r);color:#fff">⚠️ Bas</span>':""}<br><span class="m">Qté : ${s.qte} · Seuil : ${s.seuil_alerte} · ${f(s.prix)}</span></div><div><button class="s" onclick="changeStock('${s.id}',-1)">−</button><button class="s" onclick="changeStock('${s.id}',1)">+</button><button class="s" onclick="deleteStock('${s.id}')">🗑️</button></div></div></div>`).join("")}`; }).join("") || '<div class="card m">Aucun article.</div>'}</div>`;
}

function filterStock() { const input = $("search_stock"); if (!input) return; q = input.value; renderStock(document.getElementById('app')); }

async function addStock() { const nom = $("st_nom").value.trim(); const cat = $("st_cat").value; const subcat = $("st_subcat") ? $("st_subcat").value : ""; const qte = +$("st_qte").value || 0; const min = +$("st_min").value || 0; const prix = +$("st_prix").value || 0; if (!nom || !cat) { alert("Désignation et catégorie obligatoires."); return; } await supa.from("stock").insert({ nom, categorie: cat, sous_categorie: subcat, qte, seuil_alerte: min, prix }); await jlog("Ajout stock", `[${cat}] ${nom}`, `Qté: ${qte}, Prix: ${f(prix)}`); await loadAllData(); }

async function changeStock(id, delta) { const s = data.stock.find(x=>x.id===id); if (s) { const oldQte = s.qte; const newQte = (+s.qte||0)+delta; await supa.from("stock").update({qte: newQte}).eq("id", id); await jlog("Modification stock", s.nom, `Quantité: ${oldQte} → ${newQte} (${delta > 0 ? '+' : ''}${delta})`); await loadAllData(); } }

async function deleteStock(id) { if (!confirm("Supprimer ?")) return; const s = data.stock.find(x => x.id === id); await supa.from("stock").delete().eq("id", id); await jlog("Suppression stock", s?.nom || id, `Catégorie: ${s?.categorie}`); await loadAllData(); }

function renderTechs(A) {
A.innerHTML = `<div class="card"><b>➕ Nouveau technicien</b>
<div style="display:flex; gap:8px; margin-bottom:8px"><input id="tc_prenom" placeholder="Prénom *" style="flex:1"><input id="tc_nom" placeholder="Nom *" style="flex:1"></div>
<select id="tc_sp" style="margin-bottom:8px"><option value="">Spécialité *</option><option value="Mécanicien">Mécanicien</option><option value="Électricien">Électricien</option><option value="Peintre">Peintre</option><option value="Tôlier">Tôlier</option><option value="Autre">Autre</option></select>
<input id="tc_adr" placeholder="Adresse" style="margin-bottom:8px"><input id="tc_tel" type="tel" placeholder="Téléphone *" style="margin-bottom:8px">
<button class="p" onclick="addTech()">Ajouter</button></div>
<div class="card"><table><thead><tr><th>Nom & Prénom</th><th>Spécialité</th><th>Téléphone</th><th>Adresse</th><th>Action</th></tr></thead><tbody>${data.techs.map(t => `<tr><td><b>${e(t.prenom || '')} ${e(t.nom)}</b></td><td>${e(t.specialite || '—')}</td><td>${e(t.telephone || '—')}</td><td>${e(t.adresse || '—')}</td><td>${profil.role === 'PDG' ? `<button class="s" onclick="deleteTech('${t.id}')">🗑️</button>` : ""}</td></tr>`).join("") || '<tr><td colspan="5" style="text-align:center; padding:20px;">Aucun technicien.</td></tr>'}</tbody></table></div>`;
}

async function addTech() { const prenom = $("tc_prenom").value.trim(); const nom = $("tc_nom").value.trim(); const sp = $("tc_sp").value; const adr = $("tc_adr").value.trim(); const tel = $("tc_tel").value.trim(); if (!prenom || !nom) { alert("Prénom et nom obligatoires."); return; } if (!sp) { alert("Spécialité obligatoire."); return; } if (!tel) { alert("Téléphone obligatoire."); return; } const { error } = await supa.from("techniciens").insert({ prenom, nom, specialite: sp, adresse: adr, telephone: tel }); if (error) { alert("Erreur : " + error.message); return; } await jlog("Ajout technicien", `${prenom} ${nom}`, sp); await loadAllData(); }

async function deleteTech(id) { if (profil.role !== "PDG") { alert("Seul le PDG peut supprimer."); return; } if (!confirm("Supprimer ?")) return; const t = data.techs.find(x => x.id === id); await supa.from("techniciens").delete().eq("id", id); await jlog("Suppression technicien", t?.nom || id, `${t?.prenom} ${t?.nom} (${t?.specialite})`); await loadAllData(); }

async function addPersonnel() {
const nom = $("p_nom").value.trim();
const prenom = $("p_prenom").value.trim();
const poste = $("p_poste").value.trim();
const tel = $("p_tel").value.trim();
const adr = $("p_adr").value.trim();
const dateEmbauche = $("p_date").value;
const typeContrat = $("p_contrat").value;
const salaire = +$("p_salaire").value || 0;
if (!nom || !poste) { alert("Nom et poste obligatoires."); return; }
const { error } = await supa.from("employes").insert({ nom, prenom, poste, telephone: tel, adresse: adr, date_embauche: dateEmbauche, type_contrat: typeContrat, salaire_base: salaire });
if (error) { alert("Erreur : " + error.message); return; }
await jlog("Ajout employé", `${prenom} ${nom}`, poste);
await loadAllData();
toast("✅ Employé ajouté !");
}

function editEmploye(id) {
const emp = data.employes.find(x => x.id === id);
if (!emp) return;
editEmployeId = id;
renderPersonnel(document.getElementById('app'));
}

function annulerEditionEmploye() {
editEmployeId = null;
renderPersonnel(document.getElementById('app'));
}

async function sauverEditionEmploye(id) {
const nom = $("p_nom").value.trim();
const prenom = $("p_prenom").value.trim();
const poste = $("p_poste").value.trim();
const tel = $("p_tel").value.trim();
const adr = $("p_adr").value.trim();
const dateEmbauche = $("p_date").value;
const typeContrat = $("p_contrat").value;
const salaire = +$("p_salaire").value || 0;
if (!nom || !poste) { alert("Nom et poste obligatoires."); return; }
const { error } = await supa.from("employes").update({
nom, prenom, poste, telephone: tel, adresse: adr,
date_embauche: dateEmbauche, type_contrat: typeContrat, salaire_base: salaire
}).eq("id", id);
if (error) { alert("Erreur : " + error.message); return; }
await jlog("Modification employé", `${prenom} ${nom}`, `Poste: ${poste}, Salaire: ${f(salaire)}`);
editEmployeId = null;
await loadAllData();
toast("✅ Employé modifié !");
}

async function deleteEmploye(id) {
if (profil.role !== "PDG") { alert("⛔ Seul le PDG peut supprimer un employé."); return; }
if (!confirm("⚠️ Voulez-vous vraiment supprimer cet employé ?\nCette action est irréversible.")) return;
const emp = data.employes.find(x => x.id === id);
if (!emp) { alert("❌ Employé introuvable."); return; }
try {
const { data: deleted, error } = await supa.from("employes").delete().eq("id", id).select("id");
if (error) throw error;
if (!deleted || deleted.length === 0) { alert("❌ Suppression non effectuée."); return; }
await jlog("Suppression employé", `${emp.prenom || ''} ${emp.nom}`, `Poste: ${emp.poste}, Salaire: ${f(emp.salaire_base)}`);
await loadAllData();
toast("✅ Employé supprimé.");
} catch (error) { console.error("Erreur suppression employé :", error); alert("❌ Erreur : " + error.message); }
}

if (editEmployeId) {

<option value="CDD" ${emp.type_contrat === 'CDD' ? 'selected' : ''}>CDD</option>
<option value="Stage" ${emp.type_contrat === 'Stage' ? 'selected' : ''}>Stage</option>
<option value="Apprentissage" ${emp.type_contrat === 'Apprentissage' ? 'selected' : ''}>Apprentissage</option>
</select>
<input id="p_salaire" type="number" placeholder="Salaire (GNF)" style="flex:1" value="${emp.salaire_base || ''}">
</div>
<div style="display:flex; gap:8px; margin-top:10px;">
<button class="p" style="margin:0" onclick="sauverEditionEmploye('${emp.id}')">💾 Mettre à jour</button>
<button class="cancel" onclick="annulerEditionEmploye()" style="background: linear-gradient(135deg, #6b7280, #4b5563); color:#fff; border:0; border-radius:10px; padding:12px 20px; font:inherit; font-weight:600; font-size:13px; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px;">✕ Annuler</button>
</div>
</div>
<div class="card"><table><thead><tr><th>Nom & Prénom</th><th>Poste</th><th>Téléphone</th><th>Contrat</th><th style="text-align:right;">Salaire</th><th>Action</th></tr></thead><tbody>${data.employes.map(emp2 => `<tr><td><b>${e(emp2.prenom || '')} ${e(emp2.nom)}</b></td><td>${e(emp2.poste || '—')}</td><td>${e(emp2.telephone || '—')}</td><td>${e(emp2.type_contrat || '—')}</td><td style="text-align:right;">${f(emp2.salaire_base)}</td><td><button class="s" onclick="editEmploye('${emp2.id}')" title="Modifier">✏️</button><button class="s" onclick="deleteEmploye('${emp2.id}')" title="Supprimer" style="color:var(--r)">🗑️</button></td></tr>`).join("") || '<tr><td colspan="6" style="text-align:center; padding:20px;">Aucun employé.</td></tr>'}</tbody></table></div>`;
return;
}

A.innerHTML = `<div class="card"><b>➕ Nouvel employé</b>
<div style="display:flex; gap:8px; margin-bottom:8px"><input id="p_prenom" placeholder="Prénom *" style="flex:1"><input id="p_nom" placeholder="Nom *" style="flex:1"></div>
<input id="p_poste" placeholder="Poste *" style="margin-bottom:8px">
<div style="display:flex; gap:8px; margin-bottom:8px"><input id="p_tel" type="tel" placeholder="Téléphone" style="flex:1"><input id="p_adr" placeholder="Adresse" style="flex:2"></div>

const base = +$("paie_base").value || 0;
const primes = +$("paie_primes").value || 0;
const avances = +$("paie_avances").value || 0;
const cnss = +$("paie_cnss").value || 0;
const impot = +$("paie_impot").value || 0;
const solde = base + primes - avances - cnss - impot;
const emp = data.employes.find(x => x.id === employeId);
const paieExistante = data.paie.find(p => p.employe_id === employeId && p.mois === mois);

async function addFournisseur(){
if(profil.role!=="PDG" && profil.role!=="SECRETAIRE"){alert("Accès refusé.");return}
const nom=$("f_nom").value.trim();
if(!nom){alert("Nom obligatoire.");return}
const{error}=await supa.from("fournisseurs").insert({nom,contact:$("f_contact").value.trim(),telephone:$("f_tel").value.trim(),adresse:$("f_adr").value.trim()});
if(error){alert("Erreur : "+error.message);return}
await jlog("Ajout fournisseur",nom,"");
await loadAllData();
toast("Fournisseur ajouté !");
}

async function deleteFournisseur(id) {
if (!profil || profil.role !== "PDG") { alert("⛔ Seul le PDG peut supprimer un fournisseur."); return; }
if (!id) { alert("❌ Identifiant du fournisseur invalide."); return; }
const fournisseur = data.fournisseurs.find(f => f.id === id);
if (!fournisseur) { alert("❌ Fournisseur introuvable."); return; }
const commandesLiees = (data.commandes || []).filter(c => c.fournisseur_id === id);
if (commandesLiees.length > 0) { alert("⚠️ Ce fournisseur possède des commandes. Suppression impossible."); return; }
if (!confirm(`Voulez-vous vraiment supprimer le fournisseur "${fournisseur.nom}" ?`)) return;
try {
const { data: deleted, error } = await supa.from("fournisseurs").delete().eq("id", id).select("id");
if (error) throw error;
if (!deleted || deleted.length === 0) { alert("❌ Suppression non effectuée. Vérifiez les autorisations."); return; }
await jlog("Suppression fournisseur", fournisseur.nom, "Fournisseur supprimé par " + profil.username);
await loadAllData();
toast("Fournisseur supprimé.");
} catch (error) { console.error("Erreur suppression fournisseur :", error); alert("❌ Erreur : " + error.message); }
}

async function addCommande(){
if(profil.role!=="PDG" && profil.role!=="SECRETAIRE"){alert("Accès refusé.");return}
const fid=$("c_fournisseur").value,desc=$("c_desc").value.trim(),montant=parseFloat($("c_montant").value)||0,montantPaye=parseFloat($("c_montant_paye").value)||0,dateVal=$("c_date").value||new Date().toISOString().slice(0,10);
if(!fid||!desc||montant<=0){alert("Veuillez remplir correctement.");return}
const fournisseur=data.fournisseurs.find(x=>x.id===fid),statut=montantPaye>=montant?"Payé":(montantPaye>0?"Partiel":"Commandé"),{error}=await supa.from("commandes").insert({fournisseur_id:fid,fournisseur_nom:fournisseur.nom,description:desc,montant,montant_paye:montantPaye,statut,date_commande:dateVal});
if(error){alert("Erreur : "+error.message);return}
await jlog("Nouvelle commande",desc,`${fournisseur.nom} - ${f(montant)}`);
$("c_fournisseur").value="";$("c_desc").value="";$("c_montant").value="";$("c_montant_paye").value="";
await loadAllData();
toast("Commande enregistrée !");
}

async function payerSolde(id){
if(profil.role!=="PDG" && profil.role!=="SECRETAIRE"){alert("Accès refusé.");return}
const c=data.commandes.find(x=>x.id===id);
if(!c)return;
const reste=c.montant-(c.montant_paye||0);
if(!confirm(`Payer le solde de ${f(reste)} ?`))return;
await supa.from("commandes").update({montant_paye:c.montant,statut:"Payé"}).eq("id",id);
await jlog("Paiement fournisseur",c.fournisseur_nom,`Solde : ${f(reste)}`);
await loadAllData();
toast("Commande soldée avec succès !");
}

async function deleteCommande(id) {
if (!profil || profil.role !== "PDG") { alert("⛔ Seul le PDG peut supprimer une commande."); return; }
if (!id) { alert("❌ Identifiant de commande invalide."); return; }
const commande = (data.commandes || []).find(c => c.id === id);
if (!commande) { alert("❌ Commande introuvable."); return; }
if (!confirm("⚠️ Voulez-vous vraiment supprimer cette commande ?\nMontant : " + f(commande.montant) + "\nStatut : " + commande.statut + "\nCette action est irréversible.")) return;
try {
const { data: deleted, error } = await supa.from("commandes").delete().eq("id", id).select("id");
if (error) throw error;
if (!deleted || deleted.length === 0) { alert("❌ Suppression non effectuée. Vérifiez les autorisations."); return; }
await jlog("Suppression commande", id, "Montant : " + f(commande.montant) + " | Statut : " + commande.statut + " | Supprimée par : " + profil.username);
await loadAllData();
toast("Commande supprimée.");
} catch (error) { console.error("Erreur suppression commande :", error); alert("❌ Erreur : " + error.message); }
}

async function viderJournal() {
if (profil.role !== "PDG") { alert("Seul le PDG peut vider le journal d'audit."); return; }
const nb = (data.journal || []).length;
if (nb === 0) { alert("Le journal est déjà vide."); return; }
if (!confirm(`⚠️ ATTENTION : Vous allez supprimer DÉFINITIVEMENT les ${nb} entrée(s) du journal d'audit.\nCette action est irréversible. Continuer ?`)) return;

const btn = document.querySelector('.btn-vider-journal');
if (btn) { btn.disabled = true; btn.textContent = "⏳ Purge en cours..."; }

const { error } = await supa.from("journal").delete().neq("id", "00000000-0000-0000-0000-000000000000");
if (error) { if (btn) { btn.disabled = false; btn.textContent = "🗑️ Vider le journal"; } alert("Erreur lors de la suppression : " + error.message); return; }
await jlog("Vidage du journal d'audit", `${nb} entrée(s) supprimée(s)`, "Action PDG");
await loadAllData();

alert("✅ Journal d'audit vidé avec succès.");
} catch (err) { if (btn) { btn.disabled = false; btn.textContent = "🗑️ Vider le journal"; } alert("Erreur : " + err.message); }

function renderStats(A) {
if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
const caMois = {}; let totalCa = 0;
data.factures.filter(fa => fa.statut === "Payé").forEach(fa => { const mois = (fa.date_emission || "").slice(0,7); if (!mois) return; caMois[mois] = (caMois[mois] || 0) + (+fa.total_ttc || 0); totalCa += (+fa.total_ttc || 0); });
const totalSalaires = (data.paie || []).reduce((a,p) => a + (+p.solde||0), 0);
const totalDepenses = (data.depenses || []).reduce((a,d) => a + (+d.montant||0), 0);
const totalFournisseurs = (data.commandes || []).reduce((a,c) => a + (+c.montant_paye||0), 0);
const totalSorties = totalSalaires + totalDepenses + totalFournisseurs;
const beneficeNet = totalCa - totalSorties;
const clientStats = {}; data.factures.forEach(fa => { if (fa.client_nom) clientStats[fa.client_nom] = (clientStats[fa.client_nom] || 0) + (+fa.total_ttc || 0); });
const topClients = Object.entries(clientStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
const techStats = {};
data.factures.forEach(fa => {
if (fa.technicien && fa.technicien.trim() !== "") {
const noms = fa.technicien.split(',').map(n => n.trim());
noms.forEach(nom => {
if (!nom) return;
if (!techStats[nom]) techStats[nom] = { count: 0, ca: 0 };
techStats[nom].count += 1;
techStats[nom].ca += (+fa.total_ttc || 0);
});
}
});
const topTechs = Object.entries(techStats).sort((a,b) => b[1].ca - a[1].ca);
A.innerHTML = `
<div class="card">
<b style="font-size:16px">💰 Tableau de bord financier</b>
<div class="grid" style="margin-top:10px">
<div class="kpi-card green"><div class="m">Recettes</div><div class="k" style="color:var(--ok)">${f(totalCa)}</div></div>
<div class="kpi-card" style="border-top:4px solid var(--r)"><div class="m">Sorties</div><div class="k" style="color:var(--r)">${f(totalSorties)}</div></div>
<div class="kpi-card purple"><div class="m">Bénéfice Net</div><div class="k" style="color:${beneficeNet >= 0 ? 'var(--ok)' : 'var(--r)'}">${f(beneficeNet)}</div></div>
</div>
</div>
<div class="card">
<b style="font-size:16px">🏆 Performance des Techniciens</b>
<p class="m" style="margin-bottom:15px; font-size:13px;">Classement basé sur les factures générées.</p>
${topTechs.length > 0 ? `<div style="overflow-x:auto;"><table><thead><tr><th>Rang</th><th>Technicien</th><th style="text-align:center;">Véhicules traités</th><th style="text-align:right;">Chiffre d'Affaires généré</th></tr></thead><tbody>${topTechs.map((t, index) => `<tr><td style="font-weight:bold; color:${index === 0 ? '#fbbf24' : (index === 1 ? '#9ca3af' : (index === 2 ? '#b45309' : 'var(--t)'))}">${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index+1}`}</td><td><b>${e(t[0])}</b></td><td style="text-align:center;"><span class="tag" style="background:var(--blue); color:#fff;">${t[1].count}</span></td><td style="text-align:right; font-weight:bold; color:var(--ok);">${f(t[1].ca)}</td></tr>`).join("")}</tbody></table></div>` : '<div class="m" style="text-align:center; padding:20px;">Aucune donnée technicien pour le moment.<br><small>Remplissez le champ "Technicien" lors de la création des factures.</small></div>'}
</div>
<div class="card"><b>📈 CA par mois</b>${Object.keys(caMois).sort().reverse().map(m => `<div class="row"><span>${m}</span><b>${f(caMois[m])}</b></div>`).join("") || '<div class="m">Aucune facture payée.</div>'}</div>
<div class="card"><b>👑 Top 5 Clients</b>${topClients.map((c, i) => `<div class="row"><span>#${i+1} ${e(c[0])}</span><b>${f(c[1])}</b></div>`).join("") || '<div class="m">—</div>'}</div>`;
}

function renderParams(A) {

async function saveParams() { const updates = [{cle:"nom", valeur:$("p_nom").value.trim()},{cle:"nif", valeur:$("p_nif").value.trim()},{cle:"rccm", valeur:$("p_rccm").value.trim()},{cle:"adresse", valeur:$("p_adr").value.trim()},{cle:"telephone", valeur:$("p_tel").value.trim()},{cle:"tva_taux", valeur:$("p_tva").value.trim()}]; for (const u of updates) await supa.from("parametres").update({valeur:u.valeur}).eq("cle",u.cle); await loadAllData(); alert("Enregistré !"); }

async function changerMotDePasse() { const oldPass = $("old_password").value, newPass = $("new_password").value, confirmPass = $("confirm_password").value; if (!oldPass) { alert("Ancien mot de passe requis."); return; } if (newPass.length < 8) { alert("8 caractères minimum."); return; } if (newPass !== confirmPass) { alert("Les mots de passe ne correspondent pas."); return; } const { error: loginError } = await supa.auth.signInWithPassword({ email: session.user.email, password: oldPass }); if (loginError) { alert("Ancien mot de passe incorrect."); return; } const { error } = await supa.auth.updateUser({ password: newPass }); if (error) { alert("Erreur : " + error.message); } else { alert("✅ Mot de passe mis à jour !"); $("old_password").value = ""; $("new_password").value = ""; $("confirm_password").value = ""; } }

function exportAll() { const dataStr = JSON.stringify({ exporte_le: new Date().toISOString(), clients: data.clients, vehicules: data.vehicules, devis: data.devis, factures: data.factures, stock: data.stock, employes: data.employes, paie: data.paie, depenses: data.depenses, fournisseurs: data.fournisseurs, commandes: data.commandes, journal: data.journal }, null, 1); const blob = new Blob([dataStr], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sauvegarde-speed-garage-" + new Date().toISOString().slice(0,10) + ".json"; a.click(); }

function importAll(input) { const file = input.files[0]; if (!file) return; if (!confirm("⚠️ Ajouter les données du fichier ?")) { input.value = ""; return; } const reader = new FileReader(); reader.onload = async (ev) => { try { const json = JSON.parse(ev.target.result); if (!json.clients && !json.factures) { alert("Fichier invalide."); return; } alert("Importation..."); for (const c of (json.clients || [])) { delete c.id; await supa.from("clients").insert(c); } for (const v of (json.vehicules || [])) { delete v.id; await supa.from("vehicules").insert(v); } for (const d of (json.devis || [])) { delete d.id; await supa.from("devis").insert(d); } for (const fa of (json.factures || [])) { delete fa.id; await supa.from("factures").insert(fa); } alert("✅ Importation terminée !"); await loadAllData(); } catch(err) { alert("Erreur : " + err.message); } }; reader.readAsText(file); }

function renderLogout(A) { A.innerHTML = `<div class="card"><h3>Se déconnecter</h3><button class="p" onclick="logout()">Se déconnecter</button></div>`; }

(async () => {
