<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Speed Garage Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#18181b;--c:#3b3b40;--t:#fafafa;--m:#a1a1aa;--b:#52525b;--r:#dc2626;--ok:#22c55e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--c:#1c1c1f;--t:#f4f4f5;--m:#a1a1aa;--b:#33333a}}
:root[data-theme="dark"]{--bg:#111;--c:#1c1c1f;--t:#f4f4f5;--m:#a1a1aa;--b:#33333a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background-color:var(--bg);
  color:var(--t);
  font: 16px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  font-weight: 500; /* Rend tout le texte légèrement plus épais */
  overflow-x:hidden;
  background-image: url('https://raw.githubusercontent.com/speedgaragepro224/speed-garage-pro/main/login-bg.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
header{background:#000;color:#fff;padding:12px 16px;font-weight:700;border-bottom:3px solid var(--r);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
header span{flex:1;font-size:16px}
header small{font-weight:400;font-size:12px;opacity:.85}nav{display:flex;flex-direction:column;gap:4px;padding:12px;width:250px;flex:none;background:var(--c);border-right:1px solid var(--b);height:calc(100vh - 60px);position:sticky;top:60px;overflow-y:auto}
nav button{text-align:left;border:0;background:none;color:var(--m);padding:12px;border-radius:8px;font:inherit;font-size:16px;font-weight:600;cursor:pointer}
nav button.on{background:var(--r);color:#fff}
nav button:active:not(.on){background:var(--b)}
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 60px)}
main{flex:1;min-width:0;padding:16px;max-width:900px;margin:0 auto}
.mb{display:none;background:none;border:0;color:#fff;font-size:24px;padding:0;cursor:pointer}
@media (max-width:768px){.mb{display:inline-block}nav{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,0.5);padding-top:20px}nav.open{transform:none}main{padding:12px}.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.k{font-size:28px;font-weight:800;letter-spacing:-0.5px}
.m{color:var(--m);font-size:13px}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--r);border-color:transparent}
button.p{background:var(--r);color:#fff;border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:800;font-size:16px;margin-top:8px;cursor:pointer;width:100%;text-transform:uppercase;letter-spacing:0.5px;box-shadow: 0 4px 6px rgba(220, 38, 38, 0.3);}
button.p:active{opacity:0.8}
button.s{background:none;border:1px solid var(--b);color:var(--t);border-radius:6px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;margin:4px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--b);flex-wrap:wrap}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--b);display:inline-block}
.ref{font-family:monospace;font-size:12px;background:var(--b);padding:3px 8px;border-radius:5px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;min-width:500px}
th,td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--b);font-size:14px}
th{background:var(--bg);font-weight:600;color:var(--m);font-size:12px;text-transform:uppercase}
tr:hover{background:var(--bg)}
.loading{text-align:center;padding:40px;color:var(--m)}
</style>
</head>
<body>

<div id="lock"></div>
<header id="hd" style="display:none"></header>
<div class="wrap" id="wrap" style="display:none">
  <nav id="nav"></nav>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://qmgjokjuvnscuqvivklc.supabase.co";
const SUPABASE_KEY = "sb_publishable_6dWTuzuT9i_DTM1qo3Yz_Q_N78vPXqL";

const $ = id => document.getElementById(id);
const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f = n => (+n || 0).toLocaleString("fr-FR", {maximumFractionDigits:0}) + " GNF";

let supa = null, session = null, profil = null;
let data = {clients:[], techs:[], devis:[], factures:[], stock:[], journal:[], params:{}, rdv:[], vehicules:[], employes:[], paie:[], depenses:[], fournisseurs:[], commandes:[]};
let tab = "📊 Tableau de bord", idleT = null, q = "";
let clientDetailId = null, employePaieId = null, clientRappelId = null;
let dateCalendrier = new Date().toISOString().slice(0, 7);
let jourSelectionne = null;

const ROLES = {
  PDG: {label:"PDG", cls:"pdg", pages:["📊 Tableau de bord","📅 Planning","🔔 Rappels","👥 Clients","🚗 Véhicules","📝 Devis","🧾 Factures","📦 Stock","🔧 Techniciens","👔 Personnel","💰 Gestion de paie","💸 Dépenses","🏭 Fournisseurs","🔍 Journal d'audit","📈 Statistiques","⚙️ Paramètres","🚪 Se déconnecter"],
    can:{editClients:true,editDevis:true,editFactures:true,editStock:true,deleteAny:true,viewAudit:true,exportData:true}},
  SECRETAIRE: {label:"Secrétaire", cls:"sec", pages:["📊 Tableau de bord","📅 Planning","🔔 Rappels","👥 Clients","🚗 Véhicules","📝 Devis","🧾 Factures","📦 Stock","🔧 Techniciens","💸 Dépenses","🏭 Fournisseurs","⚙️ Paramètres","🚪 Se déconnecter"],
    can:{editClients:true,editDevis:true,editFactures:true,editStock:true,deleteAny:false,viewAudit:false,exportData:false}},
  MARKETING: {label:"Marketing", cls:"mkt", pages:["📊 Tableau de bord","👥 Clients","🚗 Véhicules","⚙️ Paramètres","🚪 Se déconnecter"],
    can:{editClients:false,editDevis:false,editFactures:false,editStock:false,deleteAny:false,viewAudit:false,exportData:true}}
};

function showLock(html){ $("lock").style.display="block"; $("hd").style.display="none"; $("wrap").style.display="none"; $("lock").innerHTML=html; }

function showLogin(msg) {
  showLock(`
    <div style="position: fixed; inset: 0; z-index: -1; background-image: url('https://raw.githubusercontent.com/speedgaragepro224/speed-garage-pro/main/login-bg.jpg'); background-size: cover; background-position: center; opacity: 0.15;"></div>
    
    <div style="max-width:400px;margin:8vh auto;padding:24px; position:relative; background:#fff; border-radius:12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);">
      <div style="text-align:center">
        <img src="https://raw.githubusercontent.com/speedgaragepro224/speed-garage-pro/main/login-bg.jpg" style="max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px;">
        <h2 style="margin:0; color:#111">SPEED GARAGE PRO</h2>
        <div style="border-top:2px solid var(--r);margin:15px 0;"></div>
      </div>
      
      <div class="card" style="border:none; box-shadow:none; padding:0; background:transparent;">
        <label class="m" style="color:#555">Identifiant</label>
        <select id="lu" style="width:100%; padding:12px; margin:4px 0; border:1px solid #ccc; border-radius:8px; background:#f9f9f9; color:#111; font:inherit;">
          <option value="pdg@speedgarage.local">PDG</option>
          <option value="secretaire@speedgarage.local">SECRETAIRE</option>
          <option value="marketing@speedgarage.local">MARKETING</option>
        </select>
        
        <label class="m" style="color:#555">Mot de passe</label>
        <input id="lp" type="password" style="width:100%; padding:12px; margin:4px 0; border:1px solid #ccc; border-radius:8px; background:#f9f9f9; color:#111; font:inherit;" onkeydown="if(event.key==='Enter')doLogin()">
        
        <button class="p" style="width:100%; padding:14px; margin-top:15px; font-size:16px;" onclick="doLogin()">SE CONNECTER</button>
        <p id="lm" class="m" style="color:var(--r);margin-top:10px; text-align:center;">${msg||""}</p>
      </div>
      
      <p class="m" style="text-align:center; color:#666; margin-top:20px; font-size:12px;">NIF 931828172 · RCCM GN.TCC.2026.B.13913</p>
    </div>
  `);
}

async function doLogin() {
  const email = $("lu").value.trim().toLowerCase(), pw = $("lp").value, m = $("lm");
  m.textContent = "Connexion…";
  try {
    const { data: d, error } = await supa.auth.signInWithPassword({email, password:pw});
    if (error) { m.textContent = "Échec : " + error.message; return; }
    session = d.session; await loadProfil();
  } catch(x) { m.textContent = "Erreur réseau."; }
}

async function loadProfil() {
  const { data: p, error } = await supa.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { showLogin("Profil introuvable."); return; }
  profil = p; enterApp();
}

function enterApp() {
  $("lock").style.display="none"; $("hd").style.display="flex"; $("wrap").style.display="flex";
  jlog("Connexion", profil.username, ""); loadAllData(); resetIdle();
}

function logout() { if (!confirm("Se déconnecter ?")) return; supa.auth.signOut().then(()=>location.reload()); }
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(()=>{ supa.auth.signOut().then(()=>location.reload()); }, 7200000); }
["click","keydown","touchstart"].forEach(ev => addEventListener(ev, () => { if(profil) resetIdle(); }));

function go(t){ tab=t; q=""; $("nav").classList.remove("open"); render(); }

async function loadAllData() {
  const R = ROLES[profil.role];
  const tasks = [
    supa.from("clients").select("*").order("created_at",{ascending:false}).then(r=>data.clients=r.data||[]),
    supa.from("techniciens").select("*").order("nom").then(r=>data.techs=r.data||[]),
    supa.from("devis").select("*").order("created_at",{ascending:false}).then(r=>data.devis=r.data||[]),
    supa.from("factures").select("*").order("created_at",{ascending:false}).then(r=>data.factures=r.data||[]),
    supa.from("rdv").select("*").order("date_rdv", {ascending:true}).then(r=>data.rdv=r.data||[]),
    supa.from("vehicules").select("*").then(r=>data.vehicules=r.data||[]),
    supa.from("employes").select("*").order("nom").then(r=>data.employes=r.data||[]),
    supa.from("paie").select("*").then(r=>data.paie=r.data||[]),
    supa.from("depenses").select("*").order("date_depense", {ascending:false}).then(r=>data.depenses=r.data||[]),
    supa.from("fournisseurs").select("*").order("nom").then(r=>data.fournisseurs=r.data||[]),
    supa.from("commandes").select("*").order("date_commande", {ascending:false}).then(r=>data.commandes=r.data||[]),
    supa.from("parametres").select("*").then(r=>{ data.params = {}; (r.data||[]).forEach(p=>data.params[p.cle]=p.valeur); })
  ];
  if (R.can.editStock) tasks.push(supa.from("stock").select("*").order("nom").then(r=>data.stock=r.data||[]));
  if (R.can.viewAudit) tasks.push(supa.from("journal").select("*").order("created_at",{ascending:false}).limit(300).then(r=>data.journal=r.data||[]));
  await Promise.all(tasks); render();
}

async function jlog(action, reference, details) {
  if (!profil || !session) return;
  try { await supa.from("journal").insert({utilisateur_id: session.user.id, utilisateur_nom: profil.username, role: profil.role, action, reference, details: details||""}); } catch(x){}
}

function render() {
  if (!profil) return;
  const R = ROLES[profil.role];
  if (!R.pages.includes(tab)) tab = R.pages[0];
  $("hd").innerHTML = `<button class="mb" onclick="$('nav').classList.toggle('open')">☰</button><span>SPEED GARAGE PRO</span><small>${e(profil.name||profil.username)} · <span class="tag ${R.cls}">${R.label}</span></small>`;
  $("nav").innerHTML = R.pages.map(t => `<button class="${t===tab?"on":""}" onclick="go('${t.replace(/'/g,"\\'")}')">${t}</button>`).join("");
  const A = $("app");
  
  const pageClean = tab.replace(/[^\w\s'éèàçùûîô]/g, '').trim();
  if (pageClean === "Tableau de bord") renderDashboard(A);
  else if (pageClean === "Planning") renderPlanning(A);
  else if (pageClean === "Rappels") renderRappels(A);
  else if (pageClean === "Clients") renderClients(A);
  else if (pageClean === "Véhicules") renderVehicules(A);
  else if (pageClean === "Devis") renderDevis(A);
  else if (pageClean === "Factures") renderFactures(A);
  else if (pageClean === "Stock") renderStock(A);
  else if (pageClean === "Techniciens") renderTechs(A);
  else if (pageClean === "Personnel") renderPersonnel(A);
  else if (pageClean === "Gestion de paie") renderPaie(A);
  else if (pageClean === "Dépenses") renderDepenses(A);
  else if (pageClean === "Fournisseurs") renderFournisseurs(A);
  else if (pageClean === "Journal d'audit") renderAudit(A);
  else if (pageClean === "Statistiques") renderStats(A);
  else if (pageClean === "Paramètres") renderParams(A);
  else if (pageClean === "Se déconnecter") renderLogout(A);
}

function renderDashboard(A) {
  const ca = data.factures.filter(o=>o.statut==="Payé").reduce((a,o)=>a+(+o.total_ttc||0),0);
  const impayees = data.factures.filter(o=>o.statut!=="Payé").length;
  const stockBas = data.stock.filter(s=>+s.qte<=+s.seuil_alerte).length;
  const rdvJour = data.rdv.filter(r=>r.date_rdv === new Date().toISOString().slice(0,10)).length;
  const rappelsUrgents = data.clients.filter(c => c.prochain_km > 0 || c.prochaine_date).length;

  A.innerHTML = `
    <div class="grid">
      <div class="card" style="border-top:4px solid var(--r)">
        <div class="m">Encaissé (Total)</div><div class="k" style="color:var(--ok)">${f(ca)}</div>
      </div>
      <div class="card" style="border-top:4px solid #f59e0b">
        <div class="m">Factures en attente</div><div class="k">${impayees}</div>
      </div>
      <div class="card" style="border-top:4px solid #2563eb">
        <div class="m">RDV Aujourd'hui</div><div class="k">${rdvJour}</div>
      </div>
      <div class="card" style="border-top:4px solid #7c3aed">
        <div class="m">Rappels en attente</div><div class="k">${rappelsUrgents}</div>
      </div>
    </div>

    <div class="card">
      <b>⚡ Actions Rapides</b>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; justify-content:flex-start">
        <button class="p" style="margin:0; width:auto" onclick="go('👥 Clients')">➕ Nouveau Client</button>
        <button class="p" style="margin:0; width:auto; background:#0891b2" onclick="go('🧾 Factures')">🧾 Nouvelle Facture</button>
        <button class="p" style="margin:0; width:auto; background:#7c3aed" onclick="go('📅 Planning')">📅 Prendre RDV</button>
      </div>
    </div>

    ${stockBas > 0 ? `
       <div class="card" style="border-left:4px solid var(--r); background:var(--c);">
      <b style="color:#fca5a5">⚠️ Alerte Stock</b>
      <p class="m" style="color:var(--t)">Vous avez ${stockBas} article(s) en rupture ou stock bas. <a href="#" onclick="go('📦 Stock'); return false;" style="color:var(--r); font-weight:bold;">Voir le stock →</a></p>
    </div>` : ""}

    <div class="card">
      <b>Bienvenue ${e(profil.name||profil.username)} 👋</b>
      <p class="m">Vous êtes connecté en tant que <b>${ROLES[profil.role].label}</b>.</p>
    </div>
  `;
}

/* --- PLANNING --- */
async function addRdv() {
  if (!ROLES[profil.role].can.editClients) return;
  const cid = $("rd_client").value; if (!cid) { alert("Choisissez un client."); return; }
  const d = $("rd_date").value; if (!d) { alert("Choisissez une date."); return; }
  const { error } = await supa.from("rdv").insert({
    client_id: cid, client_nom: data.clients.find(c=>c.id===cid).nom,
    vehicule: ($("rd_marque").value.trim() + " " + $("rd_modele").value.trim()).trim(), immat: $("rd_immat").value.trim(),
    date_rdv: d, heure_rdv: $("rd_heure").value, motif: $("rd_motif").value.trim(), created_by: session.user.id
  });
  if (error) { alert("Erreur : "+error.message); return; }
  await jlog("Nouveau RDV", cid + " le " + d, ""); await loadAllData();
}

function autoRemplirPlanning(clientId) {
  if (!clientId) return;
  const v = data.vehicules.find(x => x.client_id === clientId);
  if (v) {
    if ($("rd_marque")) $("rd_marque").value = v.marque;
    if ($("rd_modele")) $("rd_modele").value = v.modele;
    if ($("rd_immat")) $("rd_immat").value = v.immat;
  } else {
    if ($("rd_marque")) $("rd_marque").value = "";
    if ($("rd_modele")) $("rd_modele").value = "";
    if ($("rd_immat")) $("rd_immat").value = "";
  }
}

async function deleteRdv(id) { if (!confirm("Annuler ce RDV ?")) return; await supa.from("rdv").delete().eq("id", id); await loadAllData(); }

function changerMois(delta) {
  let [annee, mois] = dateCalendrier.split('-');
  let d = new Date(annee, parseInt(mois) - 1 + delta, 1);
  dateCalendrier = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  jourSelectionne = null; render();
}

function renderPlanning(A) {
  const peutEditer = ROLES[profil.role].can.editClients;
  const [annee, mois] = dateCalendrier.split('-');
  const premierJour = new Date(annee, parseInt(mois)-1, 1);
  const dernierJour = new Date(annee, parseInt(mois), 0);
  const nbJours = dernierJour.getDate();
  const jourDebut = premierJour.getDay() === 0 ? 6 : premierJour.getDay() - 1;
  const nomsMois = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  const nomMois = nomsMois[parseInt(mois)-1];
  const joursSemaine = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

  let htmlCalendrier = `<div class="card"><div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px">
    <button class="s" onclick="changerMois(-1)">← Précédent</button>
    <b style="font-size:18px">${nomMois} ${annee}</b>
    <button class="s" onclick="changerMois(1)">Suivant →</button>
  </div>
  <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; font-size:12px; font-weight:bold; color:var(--m); margin-bottom:4px">
    ${joursSemaine.map(j => `<div>${j}</div>`).join("")}
  </div>
  <div style="display:grid; grid-template-columns:repeat(7, 1fr); gap:4px">`;
  
  for (let i = 0; i < jourDebut; i++) htmlCalendrier += `<div></div>`;
  
  for (let j = 1; j <= nbJours; j++) {
    const dateStr = `${annee}-${mois}-${String(j).padStart(2, '0')}`;
    const nbRdv = data.rdv.filter(r => r.date_rdv === dateStr).length;
    const isToday = dateStr === new Date().toISOString().slice(0,10);
    const isSelected = dateStr === jourSelectionne;
    
    let bg = "var(--bg)"; let color = "var(--t)";
    if (nbRdv > 0) { bg = "#2563eb"; color = "#fff"; }
    if (isToday) { bg = "var(--r)"; color = "#fff"; }
    if (isSelected) { bg = "#93c5fd"; color = "#1e3a8a"; }
    
    htmlCalendrier += `<div onclick="jourSelectionne='${dateStr}'; render(); setTimeout(() => { const el = document.getElementById('liste_rdv'); if(el) el.scrollIntoView({ behavior: 'smooth' }); }, 150)" style="cursor:pointer; padding:8px 0; border-radius:6px; background:${bg}; color:${color}; border:1px solid var(--b); position:relative">
      <b>${j}</b>
      ${nbRdv > 0 ? `<div style="font-size:10px; margin-top:2px; font-weight:bold; color:#fff">${nbRdv} RDV</div>` : ""}
    </div>`;
  }
  htmlCalendrier += `</div></div>`;

  let rdvsAffiches = data.rdv;
  let titreRdv = "📅 Tous les rendez-vous à venir";
  if (jourSelectionne) {
    rdvsAffiches = data.rdv.filter(r => r.date_rdv === jourSelectionne);
    titreRdv = `📅 Rendez-vous du ${new Date(jourSelectionne).toLocaleDateString('fr-FR')}`;
  } else {
    rdvsAffiches = data.rdv.filter(r => r.date_rdv >= new Date().toISOString().slice(0,10));
  }
  rdvsAffiches = rdvsAffiches.sort((a,b) => a.date_rdv.localeCompare(b.date_rdv) || (a.heure_rdv||"").localeCompare(b.heure_rdv||""));

  A.innerHTML = `
    ${htmlCalendrier}
    ${peutEditer ? `<div class="card"><b>➕ Nouveau rendez-vous</b>
      <select id="rd_client" onchange="autoRemplirPlanning(this.value)"><option value="">Client…</option>${data.clients.map(c=>`<option value="${c.id}">${e(c.nom)}</option>`).join("")}</select>
      <div style="display:flex; gap:8px"><input id="rd_marque" placeholder="Marque" style="flex:1"><input id="rd_modele" placeholder="Modèle" style="flex:1"></div>
      <input id="rd_immat" placeholder="Immatriculation">

/* --- RAPPELS --- */
async function definirRappel(clientId) { clientRappelId = clientId; render(); }

async function sauverRappel() {
  const km = +$("rap_km").value || 0;
  const dateVal = $("rap_date").value || null;
  
  const cl = data.clients.find(c => c.id === clientRappelId);
  const vehicule = data.vehicules.find(v => v.client_id === clientRappelId);
  const veh = vehicule ? `${vehicule.marque} ${vehicule.modele} (${vehicule.immat})` : "";
  
  await supa.from("clients").update({
    prochain_km: km, prochaine_date: dateVal, vehicule_rappel: veh
  }).eq("id", clientRappelId);
  
  await jlog("Rappel défini", `${cl.nom}`, `Km: ${km}, Date: ${dateVal}`);
  clientRappelId = null; await loadAllData();
}

let clientVehiculeId = null;

async function nextRef(type) {
  const prefix = type==="Société" ? "SOC" : "PART";
  const { data: rows } = await supa.from("clients").select("ref").like("ref", prefix+"-%");
  const max = (rows||[]).map(r => +(r.ref.split("-")[1]||0)).length ? Math.max(...(rows||[]).map(r => +(r.ref.split("-")[1]||0))) : 0;
  return prefix + "-" + String(max+1).padStart(4,"0");
}

async function addClient() {
  if (!ROLES[profil.role].can.editClients) { alert("Non autorisé."); return; }
  const type = $("cl_type").value, nom = $("cl_nom").value.trim(), tel = $("cl_tel").value.trim(), adr = $("cl_adr").value.trim();
  if (!nom) { alert("Le nom est obligatoire."); return; }
  if (!/^\d{9}$/.test(tel)) { alert("Le téléphone doit contenir exactement 9 chiffres."); return; }
  if (!adr) { alert("L'adresse est obligatoire."); return; }
  const ref = await nextRef(type);
  const { data: newClient, error } = await supa.from("clients").insert({ref, type, nom, tel, adr, contact: "", nif: "", created_by: session.user.id}).select().single();
  if (error) { alert("Erreur client : "+error.message); return; }

  if ($("cl_add_veh") && $("cl_add_veh").checked) {
    const marque = $("v_marque").value.trim(), modele = $("v_modele").value.trim(), immat = $("v_immat").value.trim();
    const carburant = $("v_carb").value, boite = $("v_boite").value, portes = +$("v_portes").value || 0, vin = $("v_vin").value.trim(), km = +$("v_km").value || 0;
    if (marque && modele && immat) {
      await supa.from("vehicules").insert({ client_id: newClient.id, marque, modele, immat, carburant, boite, portes, vin, kilometrage: km, created_by: session.user.id });
    }
  }
  await jlog("Création client", `${ref} — ${nom}`, `Type: ${type}`);
  await loadAllData();
}

async function deleteClient(id) {
  if (!ROLES[profil.role].can.deleteAny) { alert("Seul le PDG peut supprimer."); return; }
  if (!confirm("Supprimer ce client et tous ses devis/factures ?")) return;
  await supa.from("clients").delete().eq("id", id); await loadAllData();
}

async function ajouterVehicule(clientId) {
  if (!clientId) { alert("Erreur : client non identifié."); return; }
  const marque = $("v_marque").value.trim(), modele = $("v_modele").value.trim(), immat = $("v_immat").value.trim();
  const carburant = $("v_carb").value, boite = $("v_boite").value, portes = +$("v_portes").value || 0, vin = $("v_vin").value.trim(), km = +$("v_km").value || 0;
  
  if (!marque || !modele || !immat) { alert("Marque, Modèle et Immatriculation sont obligatoires."); return; }

  const { error } = await supa.from("vehicules").insert({
    client_id: clientId, marque, modele, immat, carburant, boite, portes, vin, kilometrage: km, created_by: session.user.id
  });
  
  if (error) { alert("Erreur : " + error.message); return; }
  await jlog("Ajout véhicule", `${marque} ${modele} (${immat})`, `Client ID: ${clientId}`);
  
  clientVehiculeId = null; // On ferme le formulaire
  await loadAllData();
  alert("✅ Véhicule ajouté avec succès !");
}

  await supa.from("vehicules").delete().eq("id", id); await loadAllData();

  const motif = prompt("Motif du dépôt (ex: Vidange, Diagnostic, Réparation) :", "Entretien");
  if (motif === null) return;
  
  const w = window.open("", "_blank");
  const p = data.params;

  // On génère le tableau des véhicules
  let tableauVehicules = sesVehicules.map(v => `

async function saveDevis() {
  const cid = $("dv_client").value; if (!cid) { alert("Choisissez un client."); return; }
  const lignesPieces = dLignes.filter(l=>l.d.trim());
  const lignesMO = dLignesMO.filter(l=>l.d.trim());
  const lignes = [...lignesPieces.map(l => ({...l, t: "Pièce"})), ...lignesMO.map(l => ({...l, t: "Main d'œuvre"}))];
  if (!lignes.length) { alert("Ajoutez au moins une ligne."); return; }
  
  const ht = devisTotHT(), tv = +(data.params.tva_taux||18), tva = ht*tv/100, ttc = ht+tva;
  const { data: cpt } = await supa.from("compteurs").select("valeur").eq("cle","devis").single();
  const num = (cpt.valeur||0)+1, numero = "DEV-" + new Date().getFullYear() + "-" + String(num).padStart(4,"0");
  
  const { error } = await supa.from("devis").insert({
    numero, client_id: cid, client_nom: data.clients.find(c=>c.id===cid).nom, 
    vehicule: dMemo.veh, immat: dMemo.immat, 
    kilometrage: +dMemo.km || 0, motif: $("dv_motif").value.trim(), 
    delai: $("dv_delai").value.trim(), paiement: $("dv_paiement").value, 
    garantie: $("dv_garantie").value.trim(), acompte: +$("dv_acompte").value || 0,
    lignes, total_ht: ht, tva, total_ttc: ttc, statut: "Brouillon", created_by: session.user.id
  });
  if (error) { alert("Erreur : "+error.message); return; }
  await supa.from("compteurs").update({valeur: num}).eq("cle","devis"); 
  await jlog("Création devis", numero, ""); 
  dLignes = [{d:"",q:1,p:0}]; dLignesMO = [{d:"",q:1,p:0}]; 
  dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "" };
  await loadAllData();
}

async function saveFactureDirecte() {
  const cid = $("fc_client").value, veh = fMemo.veh, immat = fMemo.immat;
  const acompte = +$("fc_acompte").value || 0;
  const paiement = $("fc_paiement").value || "";
  
  if (!cid || !veh || !immat) { alert("Tous les champs sont obligatoires."); return; }
  const lignes = fLignes.filter(l => l.d.trim() !== ""); 
  const lignesMO = fLignesMO.filter(l => l.d.trim() !== "");
  const toutesLesLignes = [...lignes.map(l => ({...l, t: "Pièce"})), ...lignesMO.map(l => ({...l, t: "Main d'œuvre"}))];
  if (!toutesLesLignes.length) { alert("Ajoutez au moins une ligne."); return; }
  
  const ht = factTotHT(), tv = +(data.params.tva_taux||18), tva = ht * tv / 100, ttc = ht + tva;
  const { data: cpt } = await supa.from("compteurs").select("valeur").eq("cle","facture").single();
  const num = (cpt.valeur||0)+1, numero = "FAC-" + new Date().getFullYear() + "-" + String(num).padStart(4,"0");
  
  const { error } = await supa.from("factures").insert({
    numero, client_id: cid, client_nom: data.clients.find(c=>c.id===cid).nom, vehicule: veh, immat: immat, 
    lignes: toutesLesLignes, total_ht: ht, tva, total_ttc: ttc, acompte: acompte, paiement: paiement, 
    statut: "En attente", created_by: session.user.id
  });
  
  if (error) { alert("Erreur : "+error.message); return; }
  await supa.from("compteurs").update({valeur: num}).eq("cle","facture");
  
  for (const ligne of lignes) {
    if (ligne.stock_id) {
      const art = data.stock.find(s => s.id === ligne.stock_id);
      if (art) await supa.from("stock").update({ qte: (+art.qte || 0) - (+ligne.q || 0) }).eq("id", art.id);
    }
  }
  
  fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "" };
  fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
  await loadAllData();
  alert("✅ Facture créée !");
}

async function updateStatut(id, st) { await supa.from("factures").update({statut:st}).eq("id", id); await loadAllData(); }
async function deleteFacture(id) { if (profil.role !== "PDG") return; if (!confirm("Supprimer cette facture ?")) return; await supa.from("factures").delete().eq("id", id); await loadAllData(); }
async function deleteDevis(id) { if (profil.role !== "PDG") return; if (!confirm("Supprimer ce devis ?")) return; await supa.from("devis").delete().eq("id", id); await loadAllData(); }

let currentStockCat = "";

function filterStockCat() {
  currentStockCat = $("st_cat").value;
  currentStockSubCat = "";
  renderStock(document.getElementById('app'));
}

function filterStockSubCat() {
  currentStockSubCat = $("st_subcat").value;
  renderStock(document.getElementById('app'));
}

function renderStock(A) {
  const filtered = data.stock.filter(s => {
    if (currentStockCat && s.categorie !== currentStockCat) return false;
    if (currentStockSubCat && s.sous_categorie !== currentStockSubCat) return false;
    return true;
  });

  const subCats = currentStockCat ? stockCategories[currentStockCat] || [] : [];

  A.innerHTML = `
    <div class="card"><b>➕ Nouvel article</b>
      <div style="display:flex; gap:8px; margin-bottom:8px">
        <select id="st_cat" onchange="filterStockCat()" style="flex:1">
          <option value="">Toutes les catégories</option>
          ${Object.keys(stockCategories).sort().map(c => `<option value="${c}" ${c === currentStockCat ? 'selected' : ''}>${c}</option>`).join("")}
        </select>
        <select id="st_subcat" onchange="filterStockSubCat()" style="flex:1" ${!currentStockCat ? 'disabled' : ''}>
          <option value="">Toutes les sous-catégories</option>
          ${subCats.map(sc => `<option value="${sc}" ${sc === currentStockSubCat ? 'selected' : ''}>${sc}</option>`).join("")}
        </select>
      </div>
      <input id="st_nom" placeholder="Désignation précise">
      <div style="display:flex; gap:8px">
        <input id="st_qte" type="number" placeholder="Quantité" style="flex:1">
        <input id="st_min" type="number" placeholder="Seuil d'alerte" style="flex:1">
        <input id="st_prix" type="number" placeholder="Prix unitaire (GNF)" style="flex:2">
      </div>
      <button class="p" onclick="addStock()">Ajouter l'article</button>
    </div>

    <div class="card"><input placeholder="🔍 Rechercher un article..." value="${e(q)}" oninput="q=this.value;render()"></div>

    ${Object.keys(stockCategories).filter(c => !currentStockCat || c === currentStockCat).sort().map(cat => {
      const articlesCat = filtered.filter(s => s.categorie === cat);
      if (articlesCat.length === 0) return "";
      
      return `
        <div class="card" style="background:var(--bg); margin-bottom:8px; padding:10px"><b>📦 ${cat}</b></div>
        ${articlesCat.map(s => `
          <div class="card"><div class="row" style="border-top:0">
            <div style="flex:1">
              <b>${e(s.nom)}</b> 
              ${s.sous_categorie ? `<span class="tag" style="margin-left:5px">${e(s.sous_categorie)}</span>` : ""}
              ${+s.qte<=+s.seuil_alerte?'<span class="tag" style="background:var(--r);color:#fff">⚠️ Bas</span>':""}
              <br><span class="m">Qté : ${s.qte} · Seuil : ${s.seuil_alerte} · ${f(s.prix)}</span>
            </div>
            <div>
              <button class="s" onclick="changeStock('${s.id}',-1)">−</button>
              <button class="s" onclick="changeStock('${s.id}',1)">+</button>
              <button class="s" onclick="deleteStock('${s.id}')">🗑️</button>
            </div>
          </div></div>
        `).join("")}
      `;
    }).join("") || '<div class="card m">Aucun article trouvé.</div>'}
  `;
}

async function addStock() {
  const nom = $("st_nom").value.trim();
  const cat = $("st_cat").value;
  const subcat = $("st_subcat") ? $("st_subcat").value : "";
  const qte = +$("st_qte").value || 0;
  const min = +$("st_min").value || 0;
  const prix = +$("st_prix").value || 0;

  if (!nom || !cat) { alert("La désignation et la catégorie sont obligatoires."); return; }

  await supa.from("stock").insert({
    nom, categorie: cat, sous_categorie: subcat, qte, seuil_alerte: min, prix
  });
  await jlog("Ajout stock", `[${cat}] ${nom}`, "");
  await loadAllData();
}

async function changeStock(id, delta) { 
  const s = data.stock.find(x=>x.id===id); 
  if (s) { 
    await supa.from("stock").update({qte: (+s.qte||0)+delta}).eq("id", id); 
    await loadAllData(); 
  } 
}

async function deleteStock(id) { 
  if (!confirm("Supprimer ?")) return; 
  await supa.from("stock").delete().eq("id", id); 
  await loadAllData(); 
}

async function sauverPaie(employeId) {
  const mois = $("paie_mois").value; if (!mois) { alert("Choisissez le mois."); return; }
  const base = +$("paie_base").value || 0, primes = +$("paie_primes").value || 0, avances = +$("paie_avances").value || 0;
  const cnss = +$("paie_cnss").value || 0, impot = +$("paie_impot").value || 0;
  const solde = base + primes - avances - cnss - impot;
  const { error } = await supa.from("paie").insert({ employe_id: employeId, mois, salaire_base: base, primes, avances, cnss, impot, solde });
  if (error) { alert("Erreur : " + error.message); return; }
  const emp = data.employes.find(x => x.id === employeId);
  await jlog("Paie enregistrée", `${emp.nom} - ${mois}`, `Solde : ${f(solde)}`);
  employePaieId = null; await loadAllData(); alert("Paie enregistrée !");
}

      <div class="card" style="padding:12px; border-left: 3px solid var(--r)">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:5px">
          <b style="font-size:16px">${e(x.action)}</b>
          <span class="tag" style="background:var(--b); color:var(--t)">${e(x.role||'—')}</span>
        </div>
        <div class="m" style="margin-top:5px">
          <span>Réf : <b>${e(x.reference)}</b></span><br>
          <span>Par : <b>${e(x.utilisateur_nom)}</b> le ${new Date(x.created_at).toLocaleString('fr-FR')}</span>
          ${x.details ? `<br><span style="color:var(--r)">Détails : ${e(String(x.details).slice(0,300))}</span>` : ""}
        </div>
      </div>
    `).join("") || '<div class="card m">Aucune entrée dans le journal.</div>'}
  `;
}

async function supprimerJournal() {
  if (profil.role !== "PDG") { alert("Seul le PDG peut supprimer le journal."); return; }
  if (!confirm("⚠️ ATTENTION : Voulez-vous vraiment supprimer TOUT l'historique du journal d'audit ? Cette action est irréversible.")) return;
  
  const { error } = await supa.rpc("vider_journal");
  
  if (error) { alert("Erreur : " + error.message); return; }
  
  await jlog("Journal vidé", "Par " + profil.username, "");
  await loadAllData();
  alert("✅ Le journal d'audit a été entièrement vidé !");
}

function exportAudit() {
  if (!data.journal || data.journal.length === 0) { alert("Aucune donnée à exporter."); return; }
  
  const J = [...data.journal].sort((a,b) => a.created_at < b.created_at ? 1 : -1);
  
  let csv = "Date;Utilisateur;Role;Action;Reference;Details\n";
  J.forEach(x => {
    const ligne = [
      new Date(x.created_at).toLocaleString('fr-FR'),
      x.utilisateur_nom || "",
      x.role || "",
      x.action || "",
      x.reference || "",
      x.details || ""
    ].map(v => `"${String(v).replace(/"/g, '""')}"`).join(";");
    csv += ligne + "\n";
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "journal-audit-" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
}
/* --- STATISTIQUES --- */
function renderStats(A) {
  if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
  const caMois = {}; let totalCa = 0;
  data.factures.filter(f => f.statut === "Payé").forEach(f => { const mois = (f.date_emission || "").slice(0,7); if (!mois) return; caMois[mois] = (caMois[mois] || 0) + (+f.total_ttc || 0); totalCa += (+f.total_ttc || 0); });
  const totalSalaires = (data.paie || []).reduce((a,p) => a + (+p.solde||0), 0);
  const totalDepenses = (data.depenses || []).reduce((a,d) => a + (+d.montant||0), 0);
  const totalFournisseurs = (data.commandes || []).reduce((a,c) => a + (+c.montant_paye||0), 0);
  const totalSorties = totalSalaires + totalDepenses + totalFournisseurs;
  const beneficeNet = totalCa - totalSorties;
  const techStats = {}; data.factures.forEach(f => { if (f.technicien) techStats[f.technicien] = (techStats[f.technicien] || 0) + (+f.total_ttc || 0); });
  const topTechs = Object.entries(techStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
  const clientStats = {}; data.factures.forEach(f => { if (f.client_nom) clientStats[f.client_nom] = (clientStats[f.client_nom] || 0) + (+f.total_ttc || 0); });
  const topClients = Object.entries(clientStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
  A.innerHTML = `<div class="card" style="background:var(--bg)"><b style="font-size:16px">💰 Tableau de bord financier</b>
    <div class="grid" style="margin-top:10px">
      <div class="card" style="border-top:4px solid var(--ok)"><div class="m">Recettes</div><div class="k" style="color:var(--ok)">${f(totalCa)}</div></div>
      <div class="card" style="border-top:4px solid var(--r)"><div class="m">Sorties</div><div class="k" style="color:var(--r)">${f(totalSorties)}</div></div>
      <div class="card" style="border-top:4px solid #7c3aed"><div class="m">Bénéfice Net</div><div class="k" style="color:${beneficeNet >= 0 ? 'var(--ok)' : 'var(--r)'}">${f(beneficeNet)}</div></div>
    </div></div>
    <div class="card"><b>📈 CA par mois</b>${Object.keys(caMois).sort().reverse().map(m => `<div class="row"><span>${m}</span><b>${f(caMois[m])}</b></div>`).join("") || '<div class="m">Aucune facture payée.</div>'}</div>
    <div class="card"><b>🔧 Top techniciens</b>${topTechs.map((t, i) => `<div class="row"><span>#${i+1} ${e(t[0])}</span><b>${f(t[1])}</b></div>`).join("") || '<div class="m">—</div>'}</div>
    <div class="card"><b>👑 Top clients</b>${topClients.map((c, i) => `<div class="row"><span>#${i+1} ${e(c[0])}</span><b>${f(c[1])}</b></div>`).join("") || '<div class="m">—</div>'}</div>`;
}

/* --- PARAMÈTRES --- */
function renderParams(A) {
  const p = data.params;
  const estPDG = (profil.role === "PDG");
  
  A.innerHTML = `
    ${estPDG ? `
    <div class="card"><b>Informations du garage</b>
      <label class="m">Nom</label><input id="p_nom" value="${e(p.nom||"")}">
      <label class="m">NIF</label><input id="p_nif" value="${e(p.nif||"")}">
      <label class="m">RCCM</label><input id="p_rccm" value="${e(p.rccm||"")}">
      <label class="m">Adresse</label><input id="p_adr" value="${e(p.adresse||"")}">
      <label class="m">Téléphone</label><input id="p_tel" value="${e(p.telephone||"")}">
      <label class="m">TVA (%)</label><input id="p_tva" type="number" value="${e(p.tva_taux||"18")}">
      <button class="p" onclick="saveParams()">Enregistrer</button></div>
    ` : ""}

    <div class="card"><b>🔐 Changer mon mot de passe</b>
      <p class="m">Pour des raisons de sécurité, veuillez saisir votre ancien mot de passe.</p>
      <input id="old_password" type="password" placeholder="Ancien mot de passe" style="margin-top:8px">
      <input id="new_password" type="password" placeholder="Nouveau mot de passe">
      <input id="confirm_password" type="password" placeholder="Confirmer">
      <button class="p" onclick="changerMotDePasse()">Mettre à jour mon mot de passe</button></div>

    ${estPDG ? `
    <div class="card"><b>💾 Sauvegarde (PDG uniquement)</b><br>
      <button class="p" onclick="exportAll()">📥 Exporter</button>
      <div style="margin-top:10px; border-top:1px solid var(--b); padding-top:10px">
        <input type="file" id="import_file" accept=".json" style="display:none" onchange="importAll(this)">
        <button class="p" onclick="document.getElementById('import_file').click()" style="background:#0891b2">📤 Importer</button>
      </div></div>
    ` : ""}
  `;
}

async function saveParams() {
  const updates = [{cle:"nom", valeur:$("p_nom").value.trim()},{cle:"nif", valeur:$("p_nif").value.trim()},{cle:"rccm", valeur:$("p_rccm").value.trim()},{cle:"adresse", valeur:$("p_adr").value.trim()},{cle:"telephone", valeur:$("p_tel").value.trim()},{cle:"tva_taux", valeur:$("p_tva").value.trim()}];
  for (const u of updates) await supa.from("parametres").update({valeur:u.valeur}).eq("cle",u.cle);
  await loadAllData(); alert("Enregistré !");
}

async function changerMotDePasse() {
  const oldPass = $("old_password").value, newPass = $("new_password").value, confirmPass = $("confirm_password").value;
  if (!oldPass) { alert("Ancien mot de passe requis."); return; }
  if (newPass.length < 8) { alert("8 caractères minimum."); return; }
  if (newPass !== confirmPass) { alert("Les mots de passe ne correspondent pas."); return; }
  const { error: loginError } = await supa.auth.signInWithPassword({ email: session.user.email, password: oldPass });
  if (loginError) { alert("Ancien mot de passe incorrect."); return; }
  const { error } = await supa.auth.updateUser({ password: newPass });
  if (error) { alert("Erreur : " + error.message); } else { alert("✅ Mot de passe mis à jour !"); $("old_password").value = ""; $("new_password").value = ""; $("confirm_password").value = ""; }
}

function exportAll() {
  const dataStr = JSON.stringify({ exporte_le: new Date().toISOString(), clients: data.clients, vehicules: data.vehicules, devis: data.devis, factures: data.factures, stock: data.stock, employes: data.employes, paie: data.paie, depenses: data.depenses, fournisseurs: data.fournisseurs, commandes: data.commandes, journal: data.journal }, null, 1);
  const blob = new Blob([dataStr], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "sauvegarde-speed-garage-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
}

function importAll(input) {
  const file = input.files[0]; if (!file) return;
  if (!confirm("⚠️ Cela va ajouter les données du fichier. Continuer ?")) { input.value = ""; return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const json = JSON.parse(e.target.result);
      if (!json.clients && !json.factures) { alert("Fichier invalide."); return; }
      alert("Importation en cours...");
      for (const c of (json.clients || [])) { delete c.id; await supa.from("clients").insert(c); }
      for (const v of (json.vehicules || [])) { delete v.id; await supa.from("vehicules").insert(v); }
      for (const d of (json.devis || [])) { delete d.id; await supa.from("devis").insert(d); }
      for (const f of (json.factures || [])) { delete f.id; await supa.from("factures").insert(f); }
      alert("✅ Importation terminée !"); await loadAllData();
    } catch(err) { alert("Erreur : " + err.message); }
  };
  reader.readAsText(file);
}

function renderLogout(A) { A.innerHTML = `<div class="card"><h3>Se déconnecter</h3><button class="p" onclick="logout()">Se déconnecter</button></div>`; }

/* --- DÉMARRAGE --- */
(async () => {
  showLock('<div class="loading">Chargement…</div>');
  try {
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { session: s } } = await supa.auth.getSession();
    if (s) { session = s; await loadProfil(); } else showLogin();
  } catch(x) { 
    showLock(`<div class="card" style="margin:40px auto;max-width:400px">
      <b>Erreur</b>
      <p class="m">${e(x.message)}</p>
      <button class="p" onclick="location.reload()">Réessayer</button>
    </div>`); 
  }
})();

supa && supa.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });
</script>
