<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Speed Garage Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#f4f4f5;--c:#fff;--t:#18181b;--m:#71717a;--b:#e4e4e7;--r:#dc2626;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--c:#1c1c1f;--t:#f4f4f5;--m:#a1a1aa;--b:#33333a}}
:root[data-theme="dark"]{--bg:#111;--c:#1c1c1f;--t:#f4f4f5;--m:#a1a1aa;--b:#33333a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,sans-serif}
header{background:#000;color:#fff;padding:10px 16px;font-weight:700;border-bottom:3px solid var(--r);display:flex;align-items:center;gap:10px}
header span{flex:1}
header small{font-weight:400;font-size:12px;opacity:.85}
nav{display:flex;flex-direction:column;gap:4px;padding:8px;width:220px;flex:none;background:var(--c);border-right:1px solid var(--b);min-height:calc(100vh - 60px)}
nav button{text-align:left;border:0;background:none;color:var(--m);padding:10px 12px;border-radius:8px;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
nav button.on{background:var(--r);color:#fff}
nav button:hover:not(.on){background:var(--b)}
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 60px)}
main{flex:1;min-width:0;padding:16px;max-width:1000px}
.mb{display:none;background:none;border:0;color:#fff;font-size:22px;padding:0;cursor:pointer}
@media (max-width:700px){nav{position:fixed;left:0;top:0;bottom:0;z-index:20;width:230px;transform:translateX(-100%);transition:transform .2s;overflow-y:auto}nav.open{transform:none;box-shadow:4px 0 16px rgba(0,0,0,.4)}.mb{display:inline-block}}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.k{font-size:24px;font-weight:700}
.m{color:var(--m);font-size:13px}
input,select,textarea{width:100%;padding:10px;margin:4px 0;border:1px solid var(--b);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
button.p{background:var(--r);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;margin-top:8px;cursor:pointer}
button.p:hover{opacity:.9}
button.s{background:none;border:1px solid var(--b);color:var(--t);border-radius:6px;padding:5px 10px;font:inherit;font-size:13px;cursor:pointer;margin:2px}
button.s:hover{background:var(--b)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--b)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--b)}
.tag.pdg{background:#7c3aed;color:#fff}
.tag.sec{background:#0891b2;color:#fff}
.tag.mkt{background:#ea580c;color:#fff}
.ref{font-family:monospace;font-size:12px;background:var(--b);padding:2px 7px;border-radius:5px}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
.loading{text-align:center;padding:40px;color:var(--m)}
</style>
</head>
<body>

<div id="lock"></div>
<header id="hd" style="display:none"></header>
<div class="wrap" id="wrap" style="display:none">
  <nav id="nav"></nav>
  <main id="app"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://qmgjokjuvnscuqvivklc.supabase.co";
const SUPABASE_KEY = "sb_publishable_6dWTuzuT9i_DTM1qo3Yz_Q_N78vPXqL";

const $ = id => document.getElementById(id);
const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f = n => (+n || 0).toLocaleString("fr-FR", {maximumFractionDigits:0}) + " GNF";

let supa = null, session = null, profil = null;
let data = {clients:[], techs:[], devis:[], factures:[], stock:[], journal:[], params:{}, rdv:[], vehicules:[], employes:[], paie:[], depenses:[]};
let tab = "Tableau de bord", idleT = null, q = "";

const ROLES = {
  PDG: {label:"PDG", cls:"pdg", pages:["Tableau de bord","Planning","Rappels d'entretien","Clients","Véhicules","Devis","Factures","Stock","Techniciens","Gestion de paie","Dépenses","Journal d'audit","Statistiques","Paramètres","Se déconnecter"],
    can:{editClients:true,editDevis:true,editFactures:true,editStock:true,deleteAny:true,viewAudit:true,exportData:true}},
  SECRETAIRE: {label:"Secrétaire", cls:"sec", pages:["Tableau de bord","Planning","Rappels d'entretien","Clients","Véhicules","Devis","Factures","Stock","Se déconnecter"],
    can:{editClients:true,editDevis:true,editFactures:true,editStock:true,deleteAny:false,viewAudit:false,exportData:false}},
  MARKETING: {label:"Marketing", cls:"mkt", pages:["Tableau de bord","Clients","Véhicules","Se déconnecter"],
    can:{editClients:false,editDevis:false,editFactures:false,editStock:false,deleteAny:false,viewAudit:false,exportData:true}}
};

function showLock(html){ $("lock").style.display="block"; $("hd").style.display="none"; $("wrap").style.display="none"; $("lock").innerHTML=html; }

function showLogin(msg) {
  showLock(`<div style="max-width:400px;margin:8vh auto;padding:24px">
    <div style="text-align:center"><div style="font-size:48px">🔧</div>
    <h2 style="margin:8px 0">SPEED GARAGE PRO</h2>
    <div style="border-top:2px solid var(--r);margin:10px 0 18px"></div></div>
    <div class="card">
      <label class="m">Email</label>
      <input id="lu" type="email" value="pdg@speedgarage.local">
      <label class="m">Mot de passe</label>
      <input id="lp" type="password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="p" style="width:100%" onclick="doLogin()">SE CONNECTER</button>
      <p id="lm" class="m" style="color:var(--r);margin-top:10px">${msg||""}</p>
    </div>
    <p class="m" style="text-align:center">NIF 931828172 · RCCM GN.TCC.2026.B.13913</p>
  </div>`);
}

async function doLogin() {
  const email = $("lu").value.trim().toLowerCase(), pw = $("lp").value, m = $("lm");
  m.textContent = "Connexion…";
  try {
    const { data: d, error } = await supa.auth.signInWithPassword({email, password:pw});
    if (error) { m.textContent = "Échec : " + error.message; return; }
    session = d.session; await loadProfil();
  } catch(x) { m.textContent = "Erreur réseau."; }
}

async function loadProfil() {
  const { data: p, error } = await supa.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { showLogin("Profil introuvable."); return; }
  profil = p; enterApp();
}

function enterApp() {
  $("lock").style.display="none"; $("hd").style.display="flex"; $("wrap").style.display="flex";
  jlog("Connexion", profil.username, ""); loadAllData(); resetIdle();
}

function logout() { if (!confirm("Se déconnecter ?")) return; supa.auth.signOut().then(()=>location.reload()); }
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(()=>{ supa.auth.signOut().then(()=>location.reload()); }, 7200000); }
["click","keydown","touchstart"].forEach(ev => addEventListener(ev, () => { if(profil) resetIdle(); }));
function go(t){ tab=t; q=""; $("nav").classList.remove("open"); render(); }

async function loadAllData() {
  const R = ROLES[profil.role];
  const tasks = [
    supa.from("clients").select("*").order("created_at",{ascending:false}).then(r=>data.clients=r.data||[]),
    supa.from("techniciens").select("*").order("nom").then(r=>data.techs=r.data||[]),
    supa.from("devis").select("*").order("created_at",{ascending:false}).then(r=>data.devis=r.data||[]),
    supa.from("factures").select("*").order("created_at",{ascending:false}).then(r=>data.factures=r.data||[]),
    supa.from("rdv").select("*").order("date_rdv", {ascending:true}).then(r=>data.rdv=r.data||[]),
    supa.from("vehicules").select("*").then(r=>data.vehicules=r.data||[]),
supa.from("employes").select("*").order("nom").then(r=>data.employes=r.data||[]),
supa.from("paie").select("*").then(r=>data.paie=r.data||[]),
supa.from("depenses").select("*").order("date_depense", {ascending:false}).then(r=>data.depenses=r.data||[]),
    supa.from("parametres").select("*").then(r=>{ data.params = {}; (r.data||[]).forEach(p=>data.params[p.cle]=p.valeur); })
  ];
  if (R.can.editStock) tasks.push(supa.from("stock").select("*").order("nom").then(r=>data.stock=r.data||[]));
  if (R.can.viewAudit) tasks.push(supa.from("journal").select("*").then(r=>data.journal=r.data||[]));
  await Promise.all(tasks); render();
}

async function jlog(action, reference, details) {
  if (!profil || !session) { console.log("jlog ignoré (pas de session)"); return; }
  try {
    const { error } = await supa.from("journal").insert({
      utilisateur_id: session.user.id,
      utilisateur_nom: profil.username,
      role: profil.role,
      action: action,
      reference: reference,
      details: details || ""
    });
    if (error) {
      console.error("ERREUR JOURNAL :", error);
      alert("Erreur journal : " + error.message);
    }
  } catch(x) {
    console.error("ERREUR CATCH JOURNAL :", x);
    alert("Erreur catch journal : " + x.message);
  }
}

function render() {
  if (!profil) return;
  const R = ROLES[profil.role];
  if (!R.pages.includes(tab)) tab = "Tableau de bord";
  $("hd").innerHTML = `<button class="mb" onclick="$('nav').classList.toggle('open')">☰</button><span>SPEED GARAGE PRO</span><small>${e(profil.name||profil.username)} · <span class="tag ${R.cls}">${R.label}</span></small>`;
  $("nav").innerHTML = R.pages.map(t => `<button class="${t===tab?"on":""}" onclick="go('${t.replace(/'/g,"\\'")}')">${t}</button>`).join("");
  const A = $("app");
  if (tab==="Tableau de bord") renderDashboard(A);
  else if (tab==="Planning") renderPlanning(A);
  else if (tab==="Rappels d'entretien") renderRappels(A);
  else if (tab==="Clients") renderClients(A);
  else if (tab==="Véhicules") renderVehicules(A);
  else if (tab==="Devis") renderDevis(A);
  else if (tab==="Factures") renderFactures(A);
  else if (tab==="Stock") renderStock(A);
  else if (tab==="Techniciens") renderTechs(A);
else if (tab==="Gestion de paie") renderPaie(A);
else if (tab==="Dépenses") renderDepenses(A);
  else if (tab==="Journal d'audit") renderAudit(A);
  else if (tab==="Statistiques") renderStats(A);
  else if (tab==="Paramètres") renderParams(A);
  else if (tab==="Se déconnecter") renderLogout(A);
}

function renderDashboard(A) {
  const ca = data.factures.filter(o=>o.statut==="Payé").reduce((a,o)=>a+(+o.total_ttc||0),0);
  const impayees = data.factures.filter(o=>o.statut!=="Payé").length;
  const stockBas = data.stock.filter(s=>+s.qte<=+s.seuil_alerte).length;
  const rdvJour = data.rdv.filter(r=>r.date_rdv === new Date().toISOString().slice(0,10)).length;

  A.innerHTML = `<div class="grid">
    <div class="card"><div class="k">${data.clients.length}</div><div class="m">Clients</div></div>
    <div class="card"><div class="k">${data.vehicules.length}</div><div class="m">Véhicules</div></div>
    <div class="card"><div class="k">${impayees}</div><div class="m">Factures en cours</div></div>
    <div class="card"><div class="k">${f(ca)}</div><div class="m">Encaissé TTC</div></div>
    ${ROLES[profil.role].can.editStock?`<div class="card"><div class="k">${stockBas}</div><div class="m">Stock bas</div></div>`:""}
    <div class="card"><div class="k">${rdvJour}</div><div class="m">RDV aujourd'hui</div></div>
  </div>
  <div class="card"><b>Bienvenue ${e(profil.name||profil.username)}</b><p class="m">Connecté en tant que <b>${ROLES[profil.role].label}</b>.</p></div>`;
}

/* --- PLANNING --- */
async function addRdv() {
  if (!ROLES[profil.role].can.editClients) return;
  const cid = $("rd_client").value; if (!cid) { alert("Choisissez un client."); return; }
  const d = $("rd_date").value; if (!d) { alert("Choisissez une date."); return; }
  const { error } = await supa.from("rdv").insert({
    client_id: cid, client_nom: data.clients.find(c=>c.id===cid).nom,
    vehicule: ($("rd_marque").value.trim() + " " + $("rd_modele").value.trim()).trim(), immat: $("rd_immat").value.trim(),
    date_rdv: d, heure_rdv: $("rd_heure").value, motif: $("rd_motif").value.trim(), created_by: session.user.id
  });
  if (error) { alert("Erreur : "+error.message); return; }
  await jlog("Nouveau RDV", cid + " le " + d, ""); await loadAllData();
}

function remplirVehiculeRdv(id) {
  if (!id) return; const v = data.vehicules.find(x => x.id === id); if (!v) return;
  $("rd_marque").value = v.marque; $("rd_modele").value = v.modele; $("rd_immat").value = v.immat;
  if (v.client_id) $("rd_client").value = v.client_id;
}

async function deleteRdv(id) { if (!confirm("Annuler ce RDV ?")) return; await supa.from("rdv").delete().eq("id", id); await loadAllData(); }

function renderPlanning(A) {
  const peutEditer = ROLES[profil.role].can.editClients;
  const today = new Date().toISOString().slice(0,10);
  const prochains = [...data.rdv].sort((a,b) => a.date_rdv.localeCompare(b.date_rdv)).filter(r => r.date_rdv >= today);

  A.innerHTML = `
    ${peutEditer?`<div class="card"><b>➕ Nouveau rendez-vous</b>
      <select id="rd_client"><option value="">Client…</option>${data.clients.map(c=>`<option value="${c.id}">${e(c.nom)}</option>`).join("")}</select>
      <select id="rd_vehicule_select" onchange="remplirVehiculeRdv(this.value)" style="font-weight:bold; margin-bottom:5px">
        <option value="">⬇️ Choisir un véhicule existant...</option>
        ${data.vehicules.map(v => `<option value="${v.id}">${e(v.marque)} ${e(v.modele)} (${e(v.immat)})</option>`).join("")}
      </select>
      <div style="display:flex; gap:8px"><input id="rd_marque" placeholder="Marque" style="flex:1"><input id="rd_modele" placeholder="Modèle" style="flex:1"></div>
      <input id="rd_immat" placeholder="Immatriculation">
      <div style="display:flex; gap:8px"><input id="rd_date" type="date" style="flex:2"><input id="rd_heure" type="time" style="flex:1"></div>
      <input id="rd_motif" placeholder="Motif (ex: Vidange)">
      <button class="p" onclick="addRdv()">Enregistrer le RDV</button></div>`:""}
    <div class="card"><b>📅 Prochains rendez-vous</b></div>
    ${prochains.map(r=>`<div class="card" style="border-left: 4px solid var(--r)"><div class="row" style="border-top:0"><div style="flex:1">
      <b style="font-size:16px">${e(r.date_rdv)}</b> à <b>${e(r.heure_rdv || '--:--')}</b><br>
      <b>${e(r.client_nom)}</b> — ${e(r.vehicule)} ${e(r.immat)}<br><span class="m">${e(r.motif || 'Pas de motif')}</span>
    </div><div>${peutEditer?`<button class="s" onclick="deleteRdv('${r.id}')">🗑️</button>`:""}</div></div></div>`).join("") || '<div class="card m">Aucun rendez-vous.</div>'}`;
}

/* --- RAPPELS --- */
let clientRappelId = null;
async function definirRappel(clientId) { clientRappelId = clientId; render(); }
async function sauverRappel() {
  const km = +$("rap_km").value || 0, dateVal = $("rap_date").value || null, veh = $("rap_vehicule").value.trim();
  await supa.from("clients").update({prochain_km: km, prochaine_date: dateVal, vehicule_rappel: veh}).eq("id", clientRappelId);
  const cl = data.clients.find(c => c.id === clientRappelId);
  await jlog("Rappel défini", `${cl.nom}`, `Km: ${km}, Date: ${dateVal}`);
  clientRappelId = null; await loadAllData();
}

function renderRappels(A) {
  const peutEditer = ROLES[profil.role].can.editClients;
  const aRappeler = data.clients.filter(c => (c.prochain_km > 0) || c.prochaine_date);
  let formHtml = "";
  if (clientRappelId) {
    const cl = data.clients.find(c => c.id === clientRappelId);
    if (cl) formHtml = `<div class="card" style="border:2px solid var(--r)"><b>🔔 Définir le rappel pour ${e(cl.nom)}</b>
      <input id="rap_vehicule" placeholder="Véhicule / Immatriculation" value="${e(cl.vehicule_rappel || (data.vehicules.find(v => v.client_id === cl.id)?.immat) || '')}">
      <input id="rap_km" type="number" placeholder="Prochain entretien km (ex: 65000)" value="${cl.prochain_km || ''}">
      <input id="rap_date" type="date" value="${cl.prochaine_date || (() => { let d = new Date(); d.setMonth(d.getMonth() + 6); return d.toISOString().slice(0,10); })()}">
      <div style="display:flex; gap:8px; margin-top:8px"><button class="p" onclick="sauverRappel()">Enregistrer</button><button class="s" onclick="clientRappelId=null; render()">Annuler</button></div></div>`;
  }
  A.innerHTML = `${formHtml}<div class="card"><b>🔔 Prochains entretiens</b></div>
    ${aRappeler.map(c => {
      const facturesClient = data.factures.filter(f => f.client_id === c.id).sort((a,b) => new Date(b.date_emission) - new Date(a.date_emission));
      let factureVeh = facturesClient.find(f => f.immat && c.vehicule_rappel && c.vehicule_rappel.includes(f.immat)) || facturesClient[0];
      const dernierKm = factureVeh ? factureVeh.kilometrage : 0;
      const estDepasse = c.prochain_km > 0 && dernierKm >= c.prochain_km;
      let msgSMS = `Bonjour ${c.nom}, il est temps de prévoir l'entretien de votre véhicule ${c.vehicule_rappel || 'inconnu'}. Contactez Speed Garage Pro.`;
      return `<div class="card" style="border-left: 4px solid ${estDepasse ? 'var(--r)' : 'var(--ok)'}"><div class="row" style="border-top:0"><div style="flex:1">
        <b>${e(c.nom)}</b> ${estDepasse ? '<span class="tag" style="background:var(--r);color:#fff">⚠️ À RAPPELER</span>' : ''}<br>
        <span class="m">🚗 ${e(c.vehicule_rappel || 'Inconnu')}<br>📏 Dernier km : <b>${dernierKm.toLocaleString('fr-FR')}</b><br>🎯 Rappel : <b>${c.prochain_km ? c.prochain_km.toLocaleString('fr-FR') : '—'} km</b></span>
      </div><div style="display:flex; flex-direction:column; gap:5px; align-items:flex-end">
        ${peutEditer ? `<button class="s" onclick="definirRappel('${c.id}')">✏️ Modifier</button>` : ''}
        <button class="s" style="background:#0891b2; color:#fff; border:none" onclick="envoyerSMS('${c.tel}', \`${msgSMS}\`)">💬 SMS</button>
      </div></div></div>`;
    }).join("") || '<div class="card m">Aucun rappel défini.</div>'}`;
}

/* --- CLIENTS --- */
async function nextRef(type) {
  const prefix = type==="Société" ? "SOC" : "PART";
  const { data: rows } = await supa.from("clients").select("ref").like("ref", prefix+"-%");
  const max = (rows||[]).map(r => +(r.ref.split("-")[1]||0)).length ? Math.max(...(rows||[]).map(r => +(r.ref.split("-")[1]||0))) : 0;
  return prefix + "-" + String(max+1).padStart(4,"0");
}
let blocVehCount = 1;
function ajouterBlocVehicule() {
  blocVehCount++;
  const container = document.getElementById("veh_form");
  const newBlock = document.createElement("div");
  newBlock.id = "veh_block_" + blocVehCount;
  newBlock.innerHTML = `
    <hr style="border:0; border-top:1px dashed var(--b); margin:10px 0">
    <div style="display:flex; gap:8px">
      <input class="v_marque_${blocVehCount}" placeholder="Marque *" style="flex:1">
      <input class="v_modele_${blocVehCount}" placeholder="Modèle *" style="flex:1">
    </div>
    <input class="v_immat_${blocVehCount}" placeholder="Immatriculation *">
    <div style="display:flex; gap:8px">
      <select class="v_carb_${blocVehCount}" style="flex:1"><option value="">Carburant…</option><option>Essence</option><option>Diesel</option><option>Hybride</option><option>Électrique</option></select>
      <select class="v_boite_${blocVehCount}" style="flex:1"><option value="">Boîte…</option><option>Manuelle</option><option>Automatique</option></select>
      <input class="v_portes_${blocVehCount}" type="number" placeholder="Portes" style="flex:1">
    </div>
    <input class="v_vin_${blocVehCount}" placeholder="VIN / Châssis">
    <input class="v_km_${blocVehCount}" type="number" placeholder="Kilométrage actuel">
  `;
  container.appendChild(newBlock);
}
async function addClient() {
  if (!ROLES[profil.role].can.editClients) { alert("Non autorisé."); return; }
  const type = $("cl_type").value, nom = $("cl_nom").value.trim(), tel = $("cl_tel").value.trim(), adr = $("cl_adr").value.trim();
  
  if (!nom) { alert("Le nom est obligatoire."); return; }
  if (!/^\d{9}$/.test(tel)) { alert("Le téléphone doit contenir exactement 9 chiffres."); return; }
  if (!adr) { alert("L'adresse est obligatoire."); return; }
  
  const ref = await nextRef(type);
  
  // 1. On crée le client
  const { data: newClient, error } = await supa.from("clients").insert({
    ref, type, nom, tel, adr, contact: "", nif: "", created_by: session.user.id
  }).select().single();

  if (error) { alert("Erreur client : "+error.message); return; }

  // 2. Si la case "Ajouter un véhicule" est cochée, on crée le véhicule lié
    if ($("cl_add_veh").checked) {
    for (let i = 1; i <= blocVehCount; i++) {

function remplirVehiculeFacture(clientId) {
  if (!clientId) return;

    fMemo.immat = v.immat;

  employePaieId = null;
  await loadAllData();
  alert("Paie enregistrée avec succès !");
}

function renderPaie(A) {
  if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
  
  if (employePaieId) {
    const emp = data.employes.find(x => x.id === employePaieId);
    if (!emp) { employePaieId = null; render(); return; }
    
    const base = +$("paie_base")?.value || emp.salaire_base || 0;
    const primes = +$("paie_primes")?.value || 0;
    const avances = +$("paie_avances")?.value || 0;
    const cnss = +$("paie_cnss")?.value || 0;
    const impot = +$("paie_impot")?.value || 0;
    const solde = base + primes - avances - cnss - impot;

    A.innerHTML = `
      <div class="card">
        <button class="s" onclick="employePaieId=null; render()">← Retour à la liste</button>
        <h3 style="margin-top:10px">Fiche de paie : ${e(emp.nom)}</h3>
        <p class="m">Poste : ${e(emp.poste)}</p>
        
        <div style="display:flex; gap:8px; margin-bottom:8px">
          <input id="paie_mois" type="month" style="flex:1" value="${new Date().toISOString().slice(0,7)}">
        </div>
        
        <label class="m">Salaire de base (GNF)</label>
        <input id="paie_base" type="number" value="${base}" oninput="renderPaie(document.getElementById('app'))">
        
        <label class="m">Primes (GNF)</label>
        <input id="paie_primes" type="number" value="${primes}" oninput="renderPaie(document.getElementById('app'))">
        
        <label class="m">Avances (GNF)</label>
        <input id="paie_avances" type="number" value="${avances}" oninput="renderPaie(document.getElementById('app'))">
        
        <label class="m">Retenue CNSS (GNF)</label>
        <input id="paie_cnss" type="number" value="${cnss}" oninput="renderPaie(document.getElementById('app'))">
        
        <label class="m">Impôt sur le revenu (GNF)</label>
        <input id="paie_impot" type="number" value="${impot}" oninput="renderPaie(document.getElementById('app'))">
        
        <div style="background:var(--bg); padding:15px; border-radius:8px; margin-top:15px; border:1px solid var(--r)">
          <b style="font-size:18px">Solde à payer : ${f(solde)}</b>
        </div>
        <button class="p" onclick="sauverPaie('${emp.id}')" style="margin-top:15px">Enregistrer la paie</button>
      </div>`;
    return;
  }

  A.innerHTML = `
    <div class="card"><b>👥 Registre des salaires</b>
      <div style="display:flex; gap:8px; margin-bottom:8px">
        <input id="emp_nom" placeholder="Nom complet *" style="flex:1">
        <input id="emp_poste" placeholder="Poste *" style="flex:1">
      </div>
      <div style="display:flex; gap:8px; margin-bottom:8px">
        <input id="emp_salaire" type="number" placeholder="Salaire de base (GNF)" style="flex:1">
        <input id="emp_tel" placeholder="Téléphone" style="flex:1">
        <input id="emp_date" type="date" style="flex:1">
      </div>
      <button class="p" onclick="addEmploye()">Ajouter un employé</button>
    </div>
    
    <div class="card">
      <table><thead><tr><th>Nom</th><th>Poste</th><th>Salaire de base</th><th>Action</th></tr></thead><tbody>
        ${data.employes.map(emp => `
          <tr>
            <td><b>${e(emp.nom)}</b></td>
            <td>${e(emp.poste)}</td>
            <td>${f(emp.salaire_base)}</td>
            <td><button class="s" onclick="employePaieId='${emp.id}';render()">Faire la paie</button></td>
          </tr>
        `).join("") || '<tr><td colspan="4" style="text-align:center; padding:20px;">Aucun employé enregistré.</td></tr>'}
      </tbody></table>
    </div>

    <div class="card"><b>📜 Historique des paies</b>
      <table><thead><tr><th>Employé</th><th>Mois</th><th>Net à payer</th><th>Action</th></tr></thead><tbody>
        ${(data.paie || []).sort((a,b) => b.mois.localeCompare(a.mois)).map(paie => {
          const emp = data.employes.find(x => x.id === paie.employe_id);
          return `
            <tr>
              <td>${e(emp ? emp.nom : "Inconnu")}</td>
              <td>${e(paie.mois)}</td>
              <td>${f(paie.solde)}</td>
              <td><button class="s" onclick="printBulletinPaie('${paie.id}')">🖨️ Bulletin</button></td>
            </tr>`;
        }).join("") || '<tr><td colspan="4" style="text-align:center;">Aucune paie enregistrée.</td></tr>'}
      </tbody></table>
    </div>`;
}
/* --- DÉPENSES --- */
async function addDepense() {
  const cat = $("dep_cat").value;
  const desc = $("dep_desc").value.trim();
  const montant = +$("dep_montant").value || 0;
  const dateVal = $("dep_date").value || new Date().toISOString().slice(0,10);

  if (!desc || montant <= 0) { alert("Description et montant obligatoires."); return; }

  await supa.from("depenses").insert({
    categorie: cat, description: desc, montant: montant, date_depense: dateVal, created_by: session.user.id
  });
  await jlog("Nouvelle dépense", desc, `${cat} - ${f(montant)}`);
  await loadAllData();
}

async function deleteDepense(id) {
  if (!confirm("Supprimer cette dépense ?")) return;
  await supa.from("depenses").delete().eq("id", id);
  await loadAllData();
}

function renderDepenses(A) {
  if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
  
  const total = data.depenses.reduce((a,d) => a + (+d.montant||0), 0);

  A.innerHTML = `
    <div class="card"><b>➕ Enregistrer une dépense</b>
      <select id="dep_cat">
        <option value="Achat pièces">Achat de pièces</option>
        <option value="Salaires">Salaires (si non géré via la paie)</option>
        <option value="Loyer">Loyer du local</option>
        <option value="Électricité">Électricité (EDG)</option>
        <option value="Eau">Eau</option>
        <option value="Carburant">Carburant</option>
        <option value="Entretien">Entretien / Réparation</option>
        <option value="Fournitures">Fournitures de bureau</option>
        <option value="Divers">Divers</option>
      </select>
      <input id="dep_desc" placeholder="Description (ex: Facture EDG Octobre)">
      <input id="dep_montant" type="number" placeholder="Montant (GNF)">
      <input id="dep_date" type="date" value="${new Date().toISOString().slice(0,10)}">
      <button class="p" onclick="addDepense()">Ajouter la dépense</button>
    </div>

    <div class="card" style="background:var(--bg); border-left:4px solid var(--r)">
      <b style="font-size:18px">Total des dépenses : ${f(total)}</b>
    </div>

    <div class="card"><b>📜 Historique des dépenses</b>
      <table><thead><tr><th>Date</th><th>Catégorie</th><th>Description</th><th>Montant</th><th></th></tr></thead><tbody>
        ${data.depenses.map(d => `
          <tr>
            <td>${new Date(d.date_depense).toLocaleDateString('fr-FR')}</td>
            <td><span class="tag">${e(d.categorie)}</span></td>
            <td>${e(d.description)}</td>
            <td><b>${f(d.montant)}</b></td>
            <td><button class="s" onclick="deleteDepense('${d.id}')">🗑️</button></td>
          </tr>
        `).join("") || '<tr><td colspan="5" style="text-align:center;">Aucune dépense enregistrée.</td></tr>'}
      </tbody></table>
    </div>
  `;
}
/* --- STATISTIQUES --- */
function renderStats(A) {
  if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
  
  // 1. Calcul du CA (Factures payées)
  const caMois = {}; let totalCa = 0;
  data.factures.filter(f => f.statut === "Payé").forEach(f => {
    const mois = (f.date_emission || "").slice(0, 7); if (!mois) return;
    caMois[mois] = (caMois[mois] || 0) + (+f.total_ttc || 0); totalCa += (+f.total_ttc || 0);
  });
  const moisTries = Object.keys(caMois).sort().reverse();

  // 2. Total des salaires payés
  const totalSalaires = (data.paie || []).reduce((a,p) => a + (+p.solde||0), 0);

  // 3. Total des dépenses
  const totalDepenses = (data.depenses || []).reduce((a,d) => a + (+d.montant||0), 0);

  // 4. Bénéfice Net
  const beneficeNet = totalCa - totalSalaires - totalDepenses;

  // 5. Top techniciens et clients
  const techStats = {}; data.factures.forEach(f => { if (f.technicien) techStats[f.technicien] = (techStats[f.technicien] || 0) + (+f.total_ttc || 0); });
  const topTechs = Object.entries(techStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
  
  const clientStats = {}; data.factures.forEach(f => { if (f.client_nom) clientStats[f.client_nom] = (clientStats[f.client_nom] || 0) + (+f.total_ttc || 0); });
  const topClients = Object.entries(clientStats).sort((a,b) => b[1] - a[1]).slice(0, 5);

  A.innerHTML = `
    <div class="grid">
      <div class="card" style="border-top:4px solid var(--ok)"><div class="m">Chiffre d'Affaires (Encaissé)</div><div class="k">${f(totalCa)}</div></div>
      <div class="card" style="border-top:4px solid #f59e0b"><div class="m">Total Salaires</div><div class="k">${f(totalSalaires)}</div></div>
      <div class="card" style="border-top:4px solid #ea580c"><div class="m">Total Dépenses</div><div class="k">${f(totalDepenses)}</div></div>
      <div class="card" style="border-top:4px solid var(--r)"><div class="m">Bénéfice Net</div><div class="k" style="color:var(--r)">${f(beneficeNet)}</div></div>
    </div>

    <div class="card"><b>📈 CA par mois</b>
      ${moisTries.map(m => {
        const [annee, moisNum] = m.split("-");
        const nomsMois = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
        return `<div class="row" style="border-top:1px solid var(--b)"><span>${nomsMois[parseInt(moisNum)-1] || moisNum} ${annee}</span><b>${f(caMois[m])}</b></div>`;
      }).join("") || '<div class="m">Aucune facture payée.</div>'}
    </div>

    <div class="card"><b>🔧 Top 5 techniciens</b>
      ${topTechs.map((t, i) => `<div class="row" style="border-top:1px solid var(--b)"><span><b>#${i+1}</b> ${e(t[0])}</span><b>${f(t[1])}</b></div>`).join("") || '<div class="m">Aucune donnée.</div>'}
    </div>

    <div class="card"><b>👑 Top 5 clients</b>
      ${topClients.map((c, i) => `<div class="row" style="border-top:1px solid var(--b)"><span><b>#${i+1}</b> ${e(c[0])}</span><b>${f(c[1])}</b></div>`).join("") || '<div class="m">Aucune donnée.</div>'}
    </div>
  `;
}

/* --- PARAMÈTRES --- */
function renderParams(A) {
  if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
  const p = data.params;
  A.innerHTML = `<div class="card"><b>Informations du garage</b>
    <label class="m">Nom</label><input id="p_nom" value="${e(p.nom||"")}">
    <label class="m">NIF</label><input id="p_nif" value="${e(p.nif||"")}">
    <label class="m">RCCM</label><input id="p_rccm" value="${e(p.rccm||"")}">
    <label class="m">Adresse</label><input id="p_adr" value="${e(p.adresse||"")}">
    <label class="m">Téléphone</label><input id="p_tel" value="${e(p.telephone||"")}">
    <label class="m">TVA (%)</label><input id="p_tva" type="number" value="${e(p.tva_taux||"18")}">
    <button class="p" onclick="saveParams()">Enregistrer</button></div>`;
}
async function saveParams() {
  const updates = [{cle:"nom", valeur:$("p_nom").value.trim()},{cle:"nif", valeur:$("p_nif").value.trim()},{cle:"rccm", valeur:$("p_rccm").value.trim()},{cle:"adresse", valeur:$("p_adr").value.trim()},{cle:"telephone", valeur:$("p_tel").value.trim()},{cle:"tva_taux", valeur:$("p_tva").value.trim()}];
  for (const u of updates) await supa.from("parametres").update({valeur:u.valeur}).eq("cle",u.cle);
  await loadAllData(); alert("Enregistré ✓");
}

function renderLogout(A) { A.innerHTML = `<div class="card"><h3>Se déconnecter</h3><button class="p" onclick="logout()">Se déconnecter</button></div>`; }

/* --- DÉMARRAGE --- */
(async () => {
  showLock('<div class="loading">Chargement…</div>');
  try {
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { session: s } } = await supa.auth.getSession();
    if (s) { session = s; await loadProfil(); } else showLogin();
  } catch(x) { showLock(`<div class="card" style="margin:40px auto;max-width:400px"><b>Erreur</b><p class="m">${e(x.message)}</p><button class="p" onclick="location.reload()">Réessayer</button></div>`); }
})();

supa && supa.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });
</script>
</body>
</html>
