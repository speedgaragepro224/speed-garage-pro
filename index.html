<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Speed Garage Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --c: #18181b;
  --t: #fafafa;
  --m: #a1a1aa;
  --b: #27272a;
  --r: #e50914;
  --r-light: #ff2d3b;
  --ok: #10b981;
  --warn: #f59e0b;
  --blue: #3b82f6;
  --purple: #7c3aed;
  --cyan: #0891b2;
  --glass: rgba(24, 24, 27, 0.6);
  --glass-border: rgba(255, 255, 255, 0.08);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --shadow-hover: 0 12px 40px rgba(229, 9, 20, 0.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background: #0a0a0f;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(229, 9, 20, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
    linear-gradient(rgba(10, 10, 15, 0.85), rgba(10, 10, 15, 0.85)),
    url('https://raw.githubusercontent.com/speedgaragepro224/speed-garage-pro/main/fond-coucher-soleil.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color:var(--t);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  font-weight: 400;
  overflow-x:hidden;
  min-height: 100vh;
  letter-spacing: -0.01em;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes countUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

header{
  background: rgba(17, 17, 17, 0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color:var(--t);
  padding:14px 24px;
  border-bottom:1px solid var(--glass-border);
  display:flex;
  align-items:center;
  gap:16px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
header .logo-area { display: flex; align-items: center; gap: 12px; }
header .logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--r), var(--r-light));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 900;
  box-shadow: 0 4px 12px rgba(229, 9, 20, 0.4);
}
header span{flex:1;font-size:16px;font-weight:700; letter-spacing: -0.02em;}
header small{font-weight:500;font-size:12px;opacity:.85}
.user-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--r), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; color: white;
  cursor: pointer; transition: all 0.2s;
  border: 2px solid transparent;
}
.user-avatar:hover { transform: scale(1.05); border-color: var(--r); }
.notif-badge {
  position: relative;
  width: 36px; height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.05);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
}
.notif-badge:hover { background: rgba(255,255,255,0.1); }
.notif-badge .dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px;
  background: var(--r); border-radius: 50%;
  border: 2px solid #111;
  animation: pulse 2s infinite;
}
nav{
  display:flex; flex-direction:column; gap:4px;
  padding:16px 8px; width:240px; flex:none;
  background: rgba(23, 23, 27, 0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-right:1px solid var(--glass-border);
  height:100vh; position:sticky; top:0; overflow-y:auto;
}
nav button{
  text-align:left; border:0; background:none;
  color:var(--m); padding:12px 16px; border-radius:10px;
  font:inherit; font-size:14px; font-weight:500;
  cursor:pointer; transition:all 0.2s ease;
  display: flex; align-items: center; gap: 12px;
  position: relative; overflow: hidden;
}
nav button .nav-icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
nav button.on{
  background: linear-gradient(135deg, rgba(229, 9, 20, 0.15), rgba(229, 9, 20, 0.05));
  color:#fff; font-weight:600;
  border-left: 3px solid var(--r);
  box-shadow: inset 0 0 20px rgba(229, 9, 20, 0.1);
}
nav button:not(.on):hover{
  background: rgba(255,255,255,0.05);
  color: var(--t); transform: translateX(4px);
}
.wrap{display:flex;align-items:stretch;min-height:calc(100vh - 60px)}
main{flex:1;min-width:0;padding:20px;width:100%;max-width:100%;margin:0}
.mb{display:none;background:none;border:0;color:#fff;font-size:24px;padding:0;cursor:pointer}

/* RESPONSIVE & MOBILE */
@media (max-width:768px){
  .mb{display:inline-block}
  nav{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;transform:translateX(-100%);transition:transform .3s cubic-bezier(0.4, 0, 0.2, 1);box-shadow:4px 0 30px rgba(0,0,0,0.5);padding-top:20px}
  nav.open{transform:none}
  main{padding:12px}
  .grid{grid-template-columns:1fr 1fr}
  
  table, thead, tbody, th, td, tr { display: block; }
  thead tr { position: absolute; top: -9999px; left: -9999px; }
  tr { border: 1px solid var(--glass-border); margin-bottom: 10px; border-radius: 10px; padding: 10px; background: rgba(0,0,0,0.2); }
  td { border: none; position: relative; padding-left: 50% !important; text-align: right !important; border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 35px; }
  td:before { position: absolute; top: 12px; left: 12px; width: 45%; padding-right: 10px; white-space: nowrap; text-align: left; font-weight: 600; color: var(--m); font-size: 11px; text-transform: uppercase; }
  
  .table-depenses td:nth-of-type(1):before { content: "Date"; }
  .table-depenses td:nth-of-type(2):before { content: "Catégorie"; }
  .table-depenses td:nth-of-type(3):before { content: "Description"; }
  .table-depenses td:nth-of-type(4):before { content: "Montant"; }
  .table-depenses td:nth-of-type(5):before { content: "Action"; }

  .table-fournisseurs td:nth-of-type(1):before { content: "Date"; }
  .table-fournisseurs td:nth-of-type(2):before { content: "Fournisseur"; }
  .table-fournisseurs td:nth-of-type(3):before { content: "Description"; }
  .table-fournisseurs td:nth-of-type(4):before { content: "Montant"; }
  .table-fournisseurs td:nth-of-type(5):before { content: "Statut"; }
  .table-fournisseurs td:nth-of-type(6):before { content: "Action"; }
}

.card{
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border:1px solid var(--glass-border);
  border-radius:16px;
  padding:20px;
  margin-bottom:16px;
  box-shadow: var(--shadow);
  overflow-x:auto;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  animation: fadeIn 0.4s ease-out;
}
.card:hover { border-color: rgba(255,255,255,0.12); box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi-card {
  position: relative; overflow: hidden;
  padding: 24px; border-radius: 20px;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  backdrop-filter: blur(20px);
  transition: all 0.3s ease;
  animation: countUp 0.6s ease-out;
}
.kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--r), var(--r-light)); }
.kpi-card.green::before { background: linear-gradient(90deg, var(--ok), #34d399); }
.kpi-card.blue::before { background: linear-gradient(90deg, var(--blue), #60a5fa); }
.kpi-card.purple::before { background: linear-gradient(90deg, var(--purple), #a78bfa); }
.kpi-card.orange::before { background: linear-gradient(90deg, var(--warn), #fbbf24); }
.kpi-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.kpi-card .kpi-icon { position: absolute; top: 20px; right: 20px; font-size: 32px; opacity: 0.3; }
.k{font-size:28px;font-weight:800; letter-spacing: -0.02em;}
.m{color:var(--m);font-size:13px}
input,select,textarea{
  width:100%; padding:12px 14px; margin:4px 0;
  border:1px solid var(--b); border-radius:10px;
  background: rgba(9, 9, 11, 0.6);
  backdrop-filter: blur(10px);
  color:var(--t); font:inherit; font-size:14px;
  transition: all 0.2s ease;
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color: var(--r);
  background: rgba(9, 9, 11, 0.8);
  box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.1);
}
button.p{
  background: linear-gradient(135deg, var(--r), var(--r-light));
  color:#fff; border:0; border-radius:10px;
  padding:12px 20px; font:inherit; font-weight:600; font-size:13px;
  margin-top:8px; cursor:pointer; width:auto;
  text-transform:uppercase; letter-spacing:0.5px;
  box-shadow: 0 4px 16px rgba(229, 9, 20, 0.3);
  transition: all 0.2s ease;
}
button.p:hover{ transform: translateY(-2px); box-shadow: 0 8px 24px rgba(229, 9, 20, 0.4); }
button.s{
  background: rgba(255,255,255,0.05);
  border:1px solid var(--glass-border);
  color:var(--t); border-radius:8px;
  padding:8px 12px; font:inherit; font-size:13px;
  cursor:pointer; margin:2px; transition: all 0.2s;
}
button.s:hover{ background: rgba(255,255,255,0.1); transform: translateY(-1px); }
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--glass-border);flex-wrap:wrap}
.tag{ font-size:11px; padding:4px 10px; border-radius:99px; background: rgba(255,255,255,0.08); display:inline-block; font-weight: 600; letter-spacing: 0.3px; }
.ref{ font-family: 'SF Mono', Monaco, monospace; font-size:12px; background: rgba(255,255,255,0.05); padding:3px 8px; border-radius:6px; font-weight: 500; }
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto}
table{width:100%;border-collapse:collapse;margin:8px 0;min-width:500px}
th,td{padding:14px 10px;text-align:left;border-bottom:1px solid var(--glass-border);font-size:14px}
th{ background: rgba(0,0,0,0.3); font-weight:600; color:var(--m); font-size:11px; text-transform:uppercase; letter-spacing: 0.5px; }
tr:hover{background: rgba(255,255,255,0.02)}
.loading{text-align:center;padding:40px;color:var(--m);font-size: 14px;}
input.erreur, select.erreur, textarea.erreur { border: 2px solid var(--r) !important; background: rgba(229, 9, 20, 0.08) !important; animation: shake 0.3s; }
.msg-erreur {
  background: linear-gradient(135deg, rgba(229, 9, 20, 0.15), rgba(229, 9, 20, 0.05));
  border: 1px solid var(--r); border-radius: 12px;
  padding: 16px 20px; margin: 16px 0;
  color: #fca5a5; font-size: 14px; font-weight: 500;
  display: flex; align-items: flex-start; gap: 12px;
  animation: fadeIn 0.3s ease-out;
  backdrop-filter: blur(10px);
}
.msg-erreur::before { content: "⚠️"; font-size: 20px; flex-shrink: 0; }
.calendar-container {
  background: linear-gradient(145deg, rgba(26, 26, 36, 0.8), rgba(19, 19, 26, 0.8));
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 20px; padding: 24px; margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--glass-border); }
.calendar-title { font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; text-transform: capitalize; }
.calendar-nav-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #ffffff; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
.calendar-nav-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 12px; }
.calendar-weekday { text-align: center; font-size: 11px; font-weight: 700; color: #6b6b7a; text-transform: uppercase; letter-spacing: 1px; padding: 8px 0; }
.calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.calendar-day { height: 52px; padding: 8px; background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; }
.calendar-day:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.1); transform: translateY(-2px); }
.calendar-day-number { font-size: 14px; font-weight: 600; color: #a1a1aa; transition: color 0.2s; }
.calendar-day:hover .calendar-day-number { color: #ffffff; }
.calendar-day-empty { background: transparent; border: none; cursor: default; height: 52px; }
.calendar-day.today { background: linear-gradient(135deg, #dc2626, #991b1b); border-color: #ef4444; box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4); }
.calendar-day.today .calendar-day-number { color: #ffffff; font-weight: 800; }
.calendar-day.selected { background: linear-gradient(135deg, #2563eb, #1d4ed8); border-color: #3b82f6; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4); }
.calendar-day.selected .calendar-day-number { color: #ffffff; }
.calendar-day.has-rdv { border-left: 3px solid #22c55e; background: rgba(34, 197, 94, 0.05); }
.rdv-indicator { display: flex; gap: 3px; margin-top: 2px; flex-wrap: wrap; }
.rdv-dot { width: 5px; height: 5px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.6); }
.rdv-count { font-size: 9px; font-weight: 700; color: #22c55e; margin-top: 2px; background: rgba(34, 197, 94, 0.15); padding: 2px 6px; border-radius: 8px; }
.calendar-day.today .rdv-count { color: #ffffff; background: rgba(255,255,255,0.2); }
.calendar-day.today .rdv-dot { background: #ffffff; box-shadow: 0 0 6px rgba(255, 255, 255, 0.8); }
.section-title { font-size: 20px; font-weight: 800; margin: 0 0 16px 0; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.section-title::before { content: ''; width: 4px; height: 24px; background: linear-gradient(180deg, var(--r), var(--r-light)); border-radius: 2px; }
@media (max-width: 768px) { .calendar-day { height: 50px; padding: 6px 8px; } .calendar-day-number { font-size: 13px; } }

/* TOASTS */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { background: var(--c); border-left: 4px solid var(--r); padding: 12px 20px; border-radius: 8px; box-shadow: var(--shadow); color: #fff; font-weight: 500; animation: slideInRight 0.3s ease-out; display: flex; align-items: center; gap: 10px; }
/* --- AMÉLIORATIONS MOBILES --- */
@media (max-width: 768px) {
  /* 1. Tableaux transformés en cartes */
  table, thead, tbody, th, td, tr { display: block; width: 100%; }
  thead tr { position: absolute; top: -9999px; left: -9999px; }
  tr { border: 1px solid var(--glass-border); margin-bottom: 12px; border-radius: 12px; padding: 12px; background: rgba(255,255,255,0.03); }
  td { border: none; position: relative; padding-left: 45% !important; text-align: right !important; border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 40px; padding-top: 10px; padding-bottom: 10px; }
  td:last-child { border-bottom: none; }
  td:before { position: absolute; top: 12px; left: 12px; width: 40%; white-space: nowrap; text-align: left; font-weight: 700; color: var(--m); font-size: 11px; text-transform: uppercase; }
  
  .table-depenses td:nth-of-type(1):before { content: "Date"; }
  .table-depenses td:nth-of-type(2):before { content: "Catégorie"; }
  .table-depenses td:nth-of-type(3):before { content: "Description"; }
  .table-depenses td:nth-of-type(4):before { content: "Montant"; }
  .table-depenses td:nth-of-type(5):before { content: "Action"; }

  .table-fournisseurs td:nth-of-type(1):before { content: "Date"; }
  .table-fournisseurs td:nth-of-type(2):before { content: "Fournisseur"; }
  .table-fournisseurs td:nth-of-type(3):before { content: "Description"; }
  .table-fournisseurs td:nth-of-type(4):before { content: "Montant"; }
  .table-fournisseurs td:nth-of-type(5):before { content: "Statut"; }
  .table-fournisseurs td:nth-of-type(6):before { content: "Action"; }

  /* 2. Boutons plus gros et pleine largeur */
  button.p, button.s { width: 100%; margin-bottom: 8px; padding: 14px; font-size: 14px; }
  
  /* 3. Ajustements de l'écran */
  main { padding: 10px; }
  header { padding: 10px 15px; }
  header span { font-size: 14px; }
  .grid { grid-template-columns: 1fr; }
  .card { padding: 15px; margin-bottom: 12px; }
  
  /* 4. Formulaires empilés */
  input, select, textarea { font-size: 16px; }
  div[style*="display:flex"] { flex-direction: column !important; align-items: stretch !important; }
  div[style*="display:flex"] > div, div[style*="display:flex"] > input, div[style*="display:flex"] > select { width: 100% !important; margin-bottom: 8px; }
}
</style>
</head>
<body>

<div id="lock"></div>
<header id="hd" style="display:none"></header>
<div class="wrap" id="wrap" style="display:none">
  <nav id="nav"></nav>
  <main id="app"></main>
</div>

    if (msgErreur) msgErreur.remove();

  document.addEventListener('focus', (ev) => nettoyerErreur(ev.target), true);
  document.addEventListener('input', (ev) => nettoyerErreur(ev.target), true);

}

function toast(message, type = 'success') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.className = 'toast-container';
    document.body.appendChild(container);
  }
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderLeftColor = type === 'error' ? 'var(--r)' : (type === 'info' ? 'var(--blue)' : 'var(--ok)');
  t.innerHTML = `<span>${type === 'error' ? '❌' : (type === 'info' ? 'ℹ️' : '✅')}</span> ${message}`;
  container.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = 'all 0.3s'; setTimeout(() => t.remove(), 300); }, 3500);
}

function afficherNotifications() {
  const rdvJour = data.rdv.filter(r => r.date_rdv === new Date().toISOString().slice(0,10));
  const stockBas = data.stock.filter(s => +s.qte <= +s.seuil_alerte);
  const impayees = data.factures.filter(f => f.statut === "En attente" || f.statut === "En cours");
  
  let msg = "📢 Vos notifications du jour :\n\n";
  if (rdvJour.length > 0) msg += `📅 ${rdvJour.length} rendez-vous aujourd'hui.\n`;
  if (stockBas.length > 0) msg += `📦 ${stockBas.length} article(s) en rupture de stock.\n`;
  if (impayees.length > 0) msg += `⏳ ${impayees.length} facture(s) en attente de paiement.\n`;
  
  if (rdvJour.length === 0 && stockBas.length === 0 && impayees.length === 0) msg = "✅ Tout est à jour ! Aucune alerte.";
  alert(msg);
}

async function doLogin() {
  const email = $("lu").value.trim().toLowerCase(), pw = $("lp").value, m = $("lm");
  m.textContent = "Connexion en cours…";
  try {
    const { data: d, error } = await supa.auth.signInWithPassword({email, password:pw});
    if (error) { m.textContent = "❌ " + error.message; return; }
    session = d.session; await loadProfil();
  } catch(x) { m.textContent = "❌ Erreur réseau."; }
}

async function loadProfil() {
  const { data: p, error } = await supa.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !p) { showLogin("Profil introuvable."); return; }
  profil = p; enterApp();
}

function enterApp() {
  $("lock").style.display="none"; $("hd").style.display="flex"; $("wrap").style.display="flex";

}

async function loadAllData() {
  const R = ROLES[profil.role];
  const tasks = [
    supa.from("clients").select("*").order("created_at",{ascending:false}).then(r=>data.clients=r.data||[]),
    supa.from("techniciens").select("*").order("nom").then(r=>data.techs=r.data||[]),
    supa.from("devis").select("*").order("created_at",{ascending:false}).then(r=>data.devis=r.data||[]),
    supa.from("factures").select("*").order("created_at",{ascending:false}).then(r=>data.factures=r.data||[]),
    supa.from("rdv").select("*").order("date_rdv", {ascending:true}).then(r=>data.rdv=r.data||[]),
    supa.from("vehicules").select("*").then(r=>data.vehicules=r.data||[]),
    supa.from("employes").select("*").order("nom").then(r=>data.employes=r.data||[]),
    supa.from("paie").select("*").then(r=>data.paie=r.data||[]),
    supa.from("depenses").select("*").order("date_depense", {ascending:false}).then(r=>data.depenses=r.data||[]),
    supa.from("fournisseurs").select("*").order("nom").then(r=>data.fournisseurs=r.data||[]),
    supa.from("commandes").select("*").order("date_commande", {ascending:false}).then(r=>data.commandes=r.data||[]),
    supa.from("parametres").select("*").then(r=>{ data.params = {}; (r.data||[]).forEach(p=>data.params[p.cle]=p.valeur); })
  ];
  if (R.can.editStock) tasks.push(supa.from("stock").select("*").order("nom").then(r=>data.stock=r.data||[]));
  if (R.can.viewAudit) tasks.push(supa.from("journal").select("*").order("created_at",{ascending:false}).limit(300).then(r=>data.journal=r.data||[]));
    await Promise.all(tasks); render();

  // --- ACTIVATION DU TEMPS RÉEL (MULTI-ORDINATEURS) ---
  if (!window.realtimeChannel) {
    window.realtimeChannel = supa.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'factures' }, payload => { loadAllData(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'clients' }, payload => { loadAllData(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'devis' }, payload => { loadAllData(); })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'rdv' }, payload => { loadAllData(); })
      .subscribe();
  }
}

function animateCounter(element, target, duration = 1000) {
  const startTime = performance.now();
  function update(currentTime) {
    const elapsed = currentTime - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    element.textContent = f(Math.floor(target * eased));
    if (progress < 1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}

async function definirRappel(clientId) {
  const cl = data.clients.find(c => c.id === clientId);
  if (!cl) return;
  
  let type = prompt(`Type de rappel pour ${cl.nom} ?\nTapez le chiffre :\n1 = Diagnostic général\n2 = Rappel d'entretien périodique\n3 = Changement de filtre`, "2");
  if (type === null) return;
  if (type === "1") type = "Diagnostic général";
  else if (type === "3") type = "Changement de filtre";
  else type = "Rappel d'entretien périodique";

  const km = prompt(`Rappel pour ${cl.nom} : À quel kilométrage ? (ex: 65000)`, cl.prochain_km || "");
  if (km === null) return;
  
  const mois = prompt(`Dans combien de mois souhaitez-vous rappeler ${cl.nom} ? (ex: 6)`, "6");
  if (mois === null) return;
  
  let dateStr = null;
  if (mois && !isNaN(mois)) {
    let d = new Date();
    d.setMonth(d.getMonth() + parseInt(mois));
    dateStr = d.toISOString().slice(0, 10);
  }
  
  const v = data.vehicules.find(x => x.client_id === clientId);
  const veh = v ? `${v.marque} ${v.modele} (${v.immat})` : "";

    prochain_km: +km || 0, 
    prochaine_date: dateStr, 
    vehicule_rappel: veh,
    type_rappel: type 
  }).eq("id", clientId);
  
  if (error) { alert("Erreur : " + error.message); return; }
  await jlog("Rappel modifié", `${cl.nom}`, `Type: ${type}, Km: ${km}, Dans: ${mois} mois`);

  toast(`✅ Rappel programmé dans ${mois} mois !`);
}
async function sauverRappel() {
  const km = +$("rap_km").value || 0;
  const type = $("rap_type") ? $("rap_type").value : "Rappel d'entretien périodique";
  const mois = parseInt($("rap_mois").value) || 6;
  
  let d = new Date();
  d.setMonth(d.getMonth() + mois);
  const dateVal = d.toISOString().slice(0, 10);
  
  const cl = data.clients.find(c => c.id === clientRappelId);
  const vehicule = data.vehicules.find(v => v.client_id === clientRappelId);
  const veh = vehicule ? `${vehicule.marque} ${vehicule.modele} (${vehicule.immat})` : "";
  
  await supa.from("clients").update({ 
    prochain_km: km, 
    prochaine_date: dateVal, 
    vehicule_rappel: veh,
    type_rappel: type 
  }).eq("id", clientRappelId);
  
  await jlog("Rappel défini", `${cl.nom}`, `Type: ${type}, Km: ${km}, Dans: ${mois} mois`);
  clientRappelId = null; await loadAllData();
}

async function nextRef(type) {
  const prefix = type==="Société" ? "SOC" : "PART";
  const { data: rows } = await supa.from("clients").select("ref").like("ref", prefix+"-%");
  const max = (rows||[]).map(r => +(r.ref.split("-")[1]||0)).length ? Math.max(...(rows||[]).map(r => +(r.ref.split("-")[1]||0))) : 0;
  return prefix + "-" + String(max+1).padStart(4,"0");
}

async function addClient() {
  if (!ROLES[profil.role].can.editClients) { alert("Non autorisé."); return; }
  const type = $("cl_type").value, nom = $("cl_nom").value.trim(), tel = $("cl_tel").value.trim(), adr = $("cl_adr").value.trim();
  if (!nom) { alert("Le nom est obligatoire."); return; }
  if (!/^\d{9}$/.test(tel)) { alert("Le téléphone doit contenir exactement 9 chiffres."); return; }
  if (!adr) { alert("L'adresse est obligatoire."); return; }
  const ref = await nextRef(type);
  const { data: newClient, error } = await supa.from("clients").insert({ref, type, nom, tel, adr, contact: "", nif: "", created_by: session.user.id}).select().single();
  if (error) { alert("Erreur client : "+error.message); return; }
  if ($("cl_add_veh") && $("cl_add_veh").checked) {
    const marque = $("v_marque").value.trim(), modele = $("v_modele").value.trim(), immat = $("v_immat").value.trim();

    if (marque && modele && immat) { await supa.from("vehicules").insert({ client_id: newClient.id, marque, modele, immat, carburant, boite, portes, vin, kilometrage: km, created_by: session.user.id }); }
  }
  await jlog("Création client", `${ref} — ${nom}`, `Type: ${type}`);
  await loadAllData();
}

async function ajouterVehicule(clientId) {

  body { font-family: 'Montserrat', sans-serif; font-size: 12px; color: #222; margin: 0; padding: 0; background: #f5f5f5; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { width: 210mm; min-height: 297mm; margin: 20px auto; background: white; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
  .header { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0a0a0a 100%); color: white; padding: 20px 35px; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; top: 0; right: 0; width: 40%; height: 100%; background: linear-gradient(135deg, transparent 0%, rgba(200,0,0,0.15) 100%); clip-path: polygon(30% 0, 100% 0, 100% 100%, 0% 100%); }
  .header-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
  .logo-area { display: flex; align-items: center; gap: 15px; }
  .logo-img { width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,0,0,0.3)); }
  .company-title { font-size: 28px; font-weight: 900; letter-spacing: 1px; margin: 0; }
  .company-title .red { color: #e50914; }
  .company-subtitle { font-size: 14px; font-weight: 700; letter-spacing: 3px; margin: 5px 0 0 0; color: #ddd; }
  .company-slogan { font-size: 22px; color: #e50914; margin: 8px 0 0 0; font-weight: 700; font-style: italic; }
  .services-bar { display: flex; justify-content: center; gap: 25px; margin-top: 15px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.2); position: relative; z-index: 2; }
  .service-item { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 600; }
  .service-icon { width: 26px; height: 26px; background: rgba(229,9,20,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .red-bar { height: 4px; background: linear-gradient(90deg, #c00 0%, #e50914 50%, #c00 100%); }
  .content { padding: 25px 35px; position: relative; }
  .watermark { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: 900; color: rgba(200,0,0,0.04); letter-spacing: 5px; pointer-events: none; z-index: 0; white-space: nowrap; font-style: italic; }
  .recu-info-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; position: relative; z-index: 1; }
  .recu-number-block { font-size: 13px; line-height: 1.8; }
  .recu-number-block b { color: #c00; font-size: 16px; }
  .recu-title-badge { background: linear-gradient(135deg, #c00 0%, #e50914 100%); color: white; padding: 12px 45px; border-radius: 12px; font-size: 28px; font-weight: 900; letter-spacing: 3px; box-shadow: 0 4px 15px rgba(200,0,0,0.3); }
  .info-blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; position: relative; z-index: 1; }
  .info-block { border: 1px solid #ddd; border-radius: 8px; padding: 15px; position: relative; background: white; }
  .info-block-title { position: absolute; top: -12px; left: 15px; background: #c00; color: white; padding: 4px 15px; border-radius: 15px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .info-block h3 { margin: 10px 0 5px 0; font-size: 16px; color: #111; }
  .info-block p { margin: 4px 0; font-size: 12px; line-height: 1.6; }
  .info-block .icon { display: inline-block; width: 18px; text-align: center; margin-right: 5px; }
  .info-line { display: flex; margin: 6px 0; font-size: 12px; }
  .info-line .label { width: 140px; font-weight: 600; color: #555; display: flex; align-items: center; gap: 5px; }
  .info-line .value { flex: 1; border-bottom: 1px dotted #999; min-height: 18px; padding-left: 5px; color: #111; font-weight: 600; }
  .items-table { width: 100%; border-collapse: collapse; margin: 20px 0; border: 1px solid #c00; position: relative; z-index: 1; }
  .items-table thead th { background: linear-gradient(135deg, #c00 0%, #e50914 100%); color: white; padding: 12px; text-align: left; font-weight: 700; font-size: 13px; text-transform: uppercase; }
  .items-table tbody td { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; }
  .items-table tbody tr:nth-child(even) { background: #fafafa; }
  .motif-section { background: #f9f9f9; border-left: 4px solid #c00; padding: 15px 20px; margin: 20px 0; border-radius: 4px; position: relative; z-index: 1; }
  .motif-section h4 { margin: 0 0 8px 0; color: #c00; font-size: 13px; text-transform: uppercase; }
  .motif-section p { margin: 5px 0; font-size: 12px; }
  .notice-box { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 12px 15px; margin: 20px 0; font-size: 11px; color: #856404; position: relative; z-index: 1; }
  .signature-section { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 40px 0 20px 0; position: relative; z-index: 1; }
  .signature-box { text-align: center; }
  .signature-box h4 { background: #c00; color: white; padding: 6px 15px; border-radius: 15px; display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 0 0 10px 0; }
  .signature-frame { border: 2px solid #ddd; border-radius: 8px; height: 80px; background: white; }
  .footer { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: white; padding: 20px 35px; display: flex; justify-content: space-between; align-items: center; position: relative; }
  .footer::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #c00, #e50914, #c00); }
  .footer-left { display: flex; align-items: center; gap: 15px; }
  .footer-phone { font-size: 24px; }
  .footer-phones { font-size: 12px; line-height: 1.6; font-weight: 600; }
  .footer-center { font-size: 11px; line-height: 1.5; text-align: center; }
  .footer-slogan { font-size: 22px; color: #e50914; font-weight: 700; font-style: italic; }
  @media print { body { background: white; padding: 0; } .page { box-shadow: none; margin: 0; width: 100%; } button { display: none; } }
</style>

<body>
<div class="page">
  <div class="header">
    <div class="header-top">
      <div class="logo-area">
        <img src="${LOGO_URL}" alt="Speed Garage Pro" class="logo-img" onerror="this.style.display='none'">
        <div>
          <h1 class="company-title">SPEED <span class="red">GARAGE</span> PRO SARL</h1>
          <p class="company-subtitle">MÉCANIQUE • PIÈCES DÉTACHÉES</p>
          <p class="company-slogan">Votre partenaire automobile</p>
        </div>
      </div>
    </div>
    <div class="services-bar">
      <div class="service-item"><div class="service-icon">🔧</div><div>Entretien<br>Réparation</div></div>
      <div class="service-item"><div class="service-icon">⚙️</div><div>Diagnostic<br>Auto</div></div>
      <div class="service-item"><div class="service-icon">🛞</div><div>Pneumatiques<br>& Équilibrage</div></div>
      <div class="service-item"><div class="service-icon">🔑</div><div>Décodage<br>de Clés</div></div>
    </div>
  </div>
  <div class="red-bar"></div>
  <div class="content">
    <div class="watermark">SPEED GARAGE PRO</div>
    <div class="recu-info-row">
      <div class="recu-number-block">
        <div>N° Reçu : <b>${e(numeroRecu)}</b></div>
        <div>Date de dépôt : <b>${e(dateDepot)}</b> à <b>${e(heureDepot)}</b></div>
      </div>
      <div class="recu-title-badge">REÇU DE DÉPÔT</div>
    </div>
    <div class="info-blocks">
      <div class="info-block">
        <div class="info-block-title">Société</div>
        <h3>${e(p.nom || "SPEED GARAGE PRO SARL")}</h3>
        <p><span class="icon">📍</span> ${e(p.adresse || "Transversale T8, Quartier Samatran, Commune Kagbelen, Conakry – Guinée")}</p>
        <p><span class="icon">📞</span> ${e(p.telephone || "+224 628 00 00 00 / 622 00 00 00")}</p>
        <p><span class="icon">✉️</span> ${e(p.email || "speedgaragepro3@gmail.com")}</p>
      </div>
      <div class="info-block">
        <div class="info-block-title">Informations Client</div>
        <div class="info-line"><span class="label">Nom / Société :</span><span class="value">${e(cl.nom || "")}</span></div>
        <div class="info-line"><span class="label">Téléphone :</span><span class="value">${e(cl.tel || "")}</span></div>
        <div class="info-line"><span class="label">Adresse :</span><span class="value">${e(cl.adr || "")}</span></div>
      </div>
    </div>
    <table class="items-table">
      <thead>
        <tr>
          <th style="width: 35%;">Véhicule</th>
          <th style="width: 20%;">Immatriculation</th>
          <th style="width: 25%;">Kilométrage</th>
          <th style="width: 20%;">Carburant</th>
        </tr>
      </thead>
      <tbody>${vehiculesHtml}</tbody>
    </table>
    <div class="motif-section">
      <h4>📋 Motif du dépôt</h4>
      <p><strong>Motif :</strong> ${e(motif || "Entretien")}</p>
      <p><strong>Nombre de véhicule(s) déposé(s) :</strong> ${sesVehicules.length}</p>
      <p><strong>Date de réception :</strong> ${e(dateDepot)} à ${e(heureDepot)}</p>
    </div>
    <div class="notice-box">
      <strong>⚠️ Important :</strong> Ce reçu atteste du dépôt de votre(vos) véhicule(s) dans nos locaux. Veuillez le conserver précieusement. Il vous sera demandé lors du retrait. SPEED GARAGE PRO SARL décline toute responsabilité en cas de perte de ce document.
    </div>
    <div class="signature-section">
      <div class="signature-box"><h4>Signature du Client</h4><div class="signature-frame"></div></div>
      <div class="signature-box"><h4>Cachet et Signature du Garage</h4><div class="signature-frame" style="display: flex; align-items: center; justify-content: center; color: #c00; font-weight: 900; font-size: 11px;">SPEED GARAGE PRO SARL</div></div>
    </div>
  </div>
  <div class="footer">
    <div class="footer-left">
      <div class="footer-phone">📞</div>
      <div class="footer-phones">${e(p.telephone || "+224 628 00 00 00<br>+224 622 00 00 00")}</div>
    </div>
    <div class="footer-center">📍 ${e(p.adresse || "Transversale T8, Quartier Samatran<br>Commune Kagbelen, Conakry – Guinée")}</div>
    <div class="footer-slogan">Roulez en toute confiance !</div>
  </div>
</div>
<div style="text-align: center; margin: 20px 0; padding-bottom: 20px;">
  <button onclick="window.print()" style="padding: 14px 50px; font-size: 15px; background: #e50914; color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: 800; font-family: 'Montserrat', sans-serif; box-shadow: 0 4px 15px rgba(229,9,20,0.4); letter-spacing: 1px;">🖨️ IMPRIMER LE REÇU</button>
</div>
</body>
</html>`);
  w.document.close();
}

function renderVehicules(A) {
  const liste = data.vehicules.filter(v => (v.marque + v.modele + v.immat).toLowerCase().includes(q.toLowerCase()));
  A.innerHTML = `
    <div class="card"><input id="search_vehicule" placeholder="🔍 Rechercher un véhicule..." value="${e(q)}" oninput="filterVehicules()"><p class="m" id="count_vehicules" style="margin-top:8px">${liste.length} véhicule(s) trouvé(s)</p></div>
    <div id="liste_vehicules_container">
      ${liste.map(v => { const cl = data.clients.find(c => c.id === v.client_id); return `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
          <div style="display:flex; align-items:center; gap:15px;">
            <div style="font-size:30px; background:var(--bg); padding:10px; border-radius:10px;">🚗</div>
            <div>
              <div style="font-size:16px; font-weight:bold; margin-bottom:4px;">${e(v.marque)} ${e(v.modele)} <span class="ref" style="margin-left:8px;">${e(v.immat)}</span></div>
              <div class="m" style="display:flex; gap:15px;"><span>👤 ${e(cl ? cl.nom : 'Inconnu')}</span><span>📏 ${v.kilometrage ? v.kilometrage.toLocaleString('fr-FR') + ' km' : 'Kilométrage inconnu'}</span><span>⛽ ${e(v.carburant || '—')}</span></div>
            </div>
          </div>
        </div>`; }).join("") || '<div class="card m">Aucun véhicule enregistré.</div>'}
    </div>`;
}

function filterVehicules() {
  const input = $("search_vehicule"); if (!input) return;
  q = input.value;
  const liste = data.vehicules.filter(v => (v.marque + v.modele + v.immat).toLowerCase().includes(q.toLowerCase()));
  const container = $("liste_vehicules_container");
  const counter = $("count_vehicules");
  if (counter) counter.textContent = liste.length + " véhicule(s) trouvé(s)";
  if (container) {
    container.innerHTML = liste.map(v => { const cl = data.clients.find(c => c.id === v.client_id); return `
      <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
        <div style="display:flex; align-items:center; gap:15px;">
          <div style="font-size:30px; background:var(--bg); padding:10px; border-radius:10px;">🚗</div>
          <div>
            <div style="font-size:16px; font-weight:bold; margin-bottom:4px;">${e(v.marque)} ${e(v.modele)} <span class="ref" style="margin-left:8px;">${e(v.immat)}</span></div>
            <div class="m" style="display:flex; gap:15px;"><span>👤 ${e(cl ? cl.nom : 'Inconnu')}</span><span>📏 ${v.kilometrage ? v.kilometrage.toLocaleString('fr-FR') + ' km' : 'Kilométrage inconnu'}</span><span>⛽ ${e(v.carburant || '—')}</span></div>
          </div>
        </div>
      </div>`; }).join("") || '<div class="card m">Aucun véhicule trouvé.</div>';
  }
}

let dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "", vehicule_id: "" };
let dLignes = [{d:"",q:1,p:0}];
let dLignesMO = [{d:"",q:1,p:0}];

function devisTotHT(){ const htPieces = dLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0); const htMO = dLignesMO.reduce((a,x)=>a+(+x.p||0),0); return htPieces + htMO; }
function updateDevisTotals() { 
  const ht = devisTotHT(), tv = +(data.params.tva_taux||18), tva = ht*tv/100, ttc = ht+tva;
  const acompteVal = $("dv_acompte")?.value;
  const acompte = (acompteVal !== "" && acompteVal !== undefined) ? +acompteVal : (+dMemo.acompte || 0);
  const reste = ttc - acompte;
  if ($("dv_tot_ht")) $("dv_tot_ht").textContent = f(ht); 
  if ($("dv_tot_tva")) $("dv_tot_tva").textContent = f(tva); 
  if ($("dv_tot_ttc")) $("dv_tot_ttc").textContent = f(ttc);
  if ($("dv_reste")) $("dv_reste").textContent = f(reste > 0 ? reste : 0);
}

function remplirVehiculeDevis(clientId) {
  dMemo.client = clientId;
  if (!clientId) {
    dMemo.veh = ""; dMemo.immat = ""; dMemo.km = ""; dMemo.vehicule_id = "";
  } else {
    const vehiculesClient = data.vehicules.filter(x => x.client_id === clientId);
    if (vehiculesClient.length === 1) { 
      const v = vehiculesClient[0]; dMemo.veh = v.marque + " " + v.modele; dMemo.immat = v.immat; dMemo.km = v.kilometrage || ""; dMemo.vehicule_id = v.id; 
    } else { dMemo.veh = ""; dMemo.immat = ""; dMemo.km = ""; dMemo.vehicule_id = ""; }
  }
  // On recharge la page pour afficher les champs du véhicule (mais on garde le focus)
  renderDevis(document.getElementById('app'));
}

function rechercherPieceDevis(index, valeur) {
  dLignes[index].d = valeur;
  const article = data.stock.find(s => s.nom.toLowerCase() === valeur.toLowerCase());
  if (article) { 
    dLignes[index].p = article.prix; 
    dLignes[index].stock_id = article.id;
    const prixInput = document.getElementById(`dv_p_${index}`);
    if (prixInput) prixInput.value = article.prix;
    updateDevisTotals();
  }
}

function validerDevis() {
  document.querySelectorAll('.erreur').forEach(el => el.classList.remove('erreur'));
  const erreurs = [];
  const dv_client = $("dv_client"); if (!dv_client.value) { dv_client.classList.add('erreur'); erreurs.push("• Client"); }
  if (!dMemo.veh) erreurs.push("• Véhicule");
  if (!dMemo.immat) erreurs.push("• Immatriculation");
  const dv_motif = $("dv_motif"); if (!dv_motif.value.trim()) { dv_motif.classList.add('erreur'); erreurs.push("• Motif"); }
  const dv_delai = $("dv_delai"); if (!dv_delai.value.trim()) { dv_delai.classList.add('erreur'); erreurs.push("• Délai"); }
  const dv_paiement = $("dv_paiement"); if (!dv_paiement.value) { dv_paiement.classList.add('erreur'); erreurs.push("• Mode de paiement"); }
  const dv_garantie = $("dv_garantie"); if (!dv_garantie.value.trim()) { dv_garantie.classList.add('erreur'); erreurs.push("• Garantie"); }
  const dv_acompte = $("dv_acompte"); if (!dv_acompte.value || +dv_acompte.value < 0) { dv_acompte.classList.add('erreur'); erreurs.push("• Acompte"); }
  const lignesPieces = dLignes.filter(l => l.d.trim()); const lignesMO = dLignesMO.filter(l => l.d.trim());
  if (lignesPieces.length === 0 && lignesMO.length === 0) erreurs.push("• Au moins une pièce OU main d'œuvre");
  dLignes.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push(`• Prix manquant : ${l.d}`); });
  dLignesMO.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push(`• Coût manquant : ${l.d}`); });
  return erreurs;
}

function editDevis(id) {
  const d = data.devis.find(x => x.id === id); if (!d) return;
  editDevisId = id;
  dMemo = { client: d.client_id || "", veh: d.vehicule || "", immat: d.immat || "", km: d.kilometrage || "", motif: d.motif || "", delai: d.delai || "", paiement: d.paiement || "", garantie: d.garantie || "", acompte: d.acompte || "", vehicule_id: "" };
  dLignes = []; dLignesMO = [];
  if (d.lignes && d.lignes.length) { d.lignes.forEach(l => { if (l.t === "Main d'œuvre") dLignesMO.push({d: l.d || "", q: 1, p: l.p || 0}); else dLignes.push({d: l.d || "", q: l.q || 1, p: l.p || 0, stock_id: l.stock_id || null}); }); }
  if (dLignes.length === 0) dLignes = [{d:"",q:1,p:0}];
  if (dLignesMO.length === 0) dLignesMO = [{d:"",q:1,p:0}];
  renderDevis(document.getElementById('app'));
}

function annulerEditionDevis() {
  if (!confirm("Annuler la modification ?")) return;
  editDevisId = null; dLignes = [{d:"",q:1,p:0}]; dLignesMO = [{d:"",q:1,p:0}];
  dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "", vehicule_id: "" };
  renderDevis(document.getElementById('app'));
}

function renderDevis(A) {
  const R = ROLES[profil.role], peutEditer = R.can.editDevis, tv = +(data.params.tva_taux||18);
  const selectedClient = data.clients.find(c => c.id === dMemo.client);
  const estEnEdition = editDevisId !== null;
  const ht = devisTotHT(), tva = ht*tv/100, ttc = ht+tva;
  const acompte = +$("dv_acompte")?.value || +dMemo.acompte || 0;
  const reste = ttc - acompte;

  A.innerHTML = `${peutEditer?`<div class="card" style="${estEnEdition ? 'border:2px solid #f59e0b' : ''}">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px"><b>${estEnEdition ? '✏️ Modifier le devis' : '➕ Nouveau devis'}</b>${estEnEdition ? `<button class="s" onclick="annulerEditionDevis()" style="color:#f59e0b">✕ Annuler</button>` : ''}</div>
      <div style="background:var(--bg); padding:10px; border-radius:8px; margin-bottom:15px; border:2px solid var(--r)">
        <b>Informations Client & Véhicule</b>
        <select id="dv_client" onchange="remplirVehiculeDevis(this.value)" style="margin-top:8px; margin-bottom:8px"><option value="">Choisir un client… *</option>${data.clients.map(c=>`<option value="${c.id}" ${c.id===dMemo.client?'selected':''}>${e(c.nom)}</option>`).join("")}</select>
        ${selectedClient ? `<div style="font-size:13px; margin-bottom:8px">📞 Téléphone : <b>${e(selectedClient.tel)}</b></div>` : ""}
        <div style="background:var(--bg); padding:8px; border-radius:6px; border:1px solid var(--b)">
          ${(() => { const vehiculesClient = data.vehicules.filter(x => x.client_id === dMemo.client); if (vehiculesClient.length > 1) { return `<div style="padding:8px;"><label style="font-size:12px; color:var(--m); display:block; margin-bottom:4px;">🚗 Choisir un véhicule :</label><select onchange="choisirVehiculeDevis(this.value)" style="width:100%; padding:8px; background:var(--c); border:1px solid var(--b); border-radius:6px; color:var(--t);"><option value="">Sélectionner…</option>${vehiculesClient.map(v => `<option value="${v.id}" ${v.id === dMemo.vehicule_id ? 'selected' : ''}>${e(v.marque)} ${e(v.modele)} — ${e(v.immat)} (${v.kilometrage || 0} km)</option>`).join("")}</select></div>`; } else if (vehiculesClient.length === 1) { return ''; } else { return `<div style="padding:8px; color:var(--m); font-style:italic;">Aucun véhicule</div>`; } })()}

async function saveDevis() {
  const erreurs = validerDevis();
  if (erreurs.length > 0) { 
    alert("⚠️ Champs obligatoires manquants :\n\n" + erreurs.join("\n")); 
    return;
  }
  const cid = $("dv_client").value;
  const clientNom = data.clients.find(c=>c.id===cid)?.nom || "Inconnu";
  const lignesPieces = dLignes.filter(l=>l.d.trim()); const lignesMO = dLignesMO.filter(l=>l.d.trim());
  const lignes = [...lignesPieces.map(l => ({...l, t: "Pièce"})), ...lignesMO.map(l => ({...l, t: "Main d'œuvre"}))];
  const ht = devisTotHT(), tv = +(data.params.tva_taux||18), tva = ht*tv/100, ttc = ht+tva;
  const acompte = +$("dv_acompte").value || 0;
  
  if (editDevisId) {
    const { error } = await supa.from("devis").update({ 
      client_id: cid, client_nom: clientNom, vehicule: dMemo.veh, immat: dMemo.immat, 
      kilometrage: +dMemo.km || 0, motif: $("dv_motif").value.trim(), delai: $("dv_delai").value.trim(), 
      paiement: $("dv_paiement").value, garantie: $("dv_garantie").value.trim(), 
      acompte: acompte, lignes, total_ht: ht, tva, total_ttc: ttc 
    }).eq("id", editDevisId);
    if (error) { alert("Erreur : "+error.message); return; }
    editDevisId = null; dLignes = [{d:"",q:1,p:0}]; dLignesMO = [{d:"",q:1,p:0}]; dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "", vehicule_id: "" };
    await loadAllData(); alert("✅ Devis modifié !"); return;
  }
  
  try {
    const { data: tousDevis } = await supa.from("devis").select("numero").order("numero", { ascending: false }).limit(1);
    let num = 1;
    if (tousDevis && tousDevis.length > 0) {
      const dernierNumero = tousDevis[0].numero;
      const parties = dernierNumero.split("-");
      if (parties.length === 3) num = parseInt(parties[2]) + 1;
    }
    const numero = "DEV-" + new Date().getFullYear() + "-" + String(num).padStart(4,"0");
    
    const { error } = await supa.from("devis").insert({ numero, client_id: cid, client_nom: clientNom, vehicule: dMemo.veh, immat: dMemo.immat, kilometrage: +dMemo.km || 0, motif: $("dv_motif").value.trim(), delai: $("dv_delai").value.trim(), paiement: $("dv_paiement").value, garantie: $("dv_garantie").value.trim(), acompte: acompte, lignes, total_ht: ht, tva, total_ttc: ttc, statut: "Brouillon", created_by: session.user.id });
    if (error) { alert("Erreur : "+error.message); return; }
    await jlog("Création devis", numero, `Client: ${clientNom}, Total TTC: ${f(ttc)}, Acompte: ${f(acompte)}`);
  } catch(err) { alert("Erreur : " + err.message); return; }
  dLignes = [{d:"",q:1,p:0}]; dLignesMO = [{d:"",q:1,p:0}]; dMemo = { client: "", veh: "", immat: "", km: "", motif: "", delai: "", paiement: "", garantie: "", acompte: "", vehicule_id: "" };
  await loadAllData(); alert("✅ Devis enregistré !");
}

function preparerFactureDepuisDevis(idDevis) {
  const d = data.devis.find(x => x.id === idDevis); if (!d) return;
  editFactureId = null;
  fMemo = { client: d.client_id, veh: d.vehicule, immat: d.immat, acompte: d.acompte || "", paiement: d.paiement || "" };
  fLignes = d.lignes && d.lignes.length ? d.lignes.filter(l => l.t !== "Main d'œuvre").map(l => ({...l, t: "Pièce"})) : [{d:"",q:1,p:0}];
  fLignesMO = d.lignes && d.lignes.length ? d.lignes.filter(l => l.t === "Main d'œuvre").map(l => ({...l})) : [{d:"",q:1,p:0}];
  tab = "🧾 Factures"; render();
}

let fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "", technicien: "" };
let fLignes = [{d:"",q:1,p:0}];
let fLignesMO = [{d:"",q:1,p:0}];

function factTotHT(){ const htPieces = fLignes.reduce((a,x)=>a+(+x.q||0)*(+x.p||0),0); const htMO = fLignesMO.reduce((a,x)=>a+(+x.p||0),0); return htPieces + htMO; }
function updateFactTotals() { 
  const ht = factTotHT(), tv = +(data.params.tva_taux||18), ttc = ht + (ht*tv/100); 
  const acompteVal = $("fc_acompte")?.value;
  const acompte = (acompteVal !== "" && acompteVal !== undefined) ? +acompteVal : (+fMemo.acompte || 0);
  const reste = ttc - acompte;
  const el = $("fc_tot_ttc"); if (el) el.textContent = f(ttc);
  const elReste = $("fc_reste"); if (elReste) elReste.textContent = f(reste > 0 ? reste : 0);
}

function remplirVehiculeFacture(clientId) {
  fMemo.client = clientId;
  
  if (!clientId) {
    fMemo.veh = ""; fMemo.immat = ""; fMemo.technicien = "";
  } else {
    const v = data.vehicules.find(x => x.client_id === clientId);
    if (v) { 
      fMemo.veh = v.marque + " " + v.modele; 
      fMemo.immat = v.immat; 
    } else { 
      fMemo.veh = "Aucun véhicule"; fMemo.immat = "—"; 
    }
  }
  
  // Au lieu de recharger toute la page, on met juste à jour les textes dans la boîte
  const spanVeh = document.getElementById("fc_display_veh");
  const spanImmat = document.getElementById("fc_display_immat");
  if (spanVeh) spanVeh.textContent = fMemo.veh || "—";
  if (spanImmat) spanImmat.textContent = fMemo.immat || "—";
}
function rechercherPieceFacture(index, valeur) {
  fLignes[index].d = valeur;
  const article = data.stock.find(s => s.nom.toLowerCase() === valeur.toLowerCase());
  if (article) { 
    fLignes[index].p = article.prix; 
    fLignes[index].stock_id = article.id;
    const prixInput = document.getElementById(`fc_p_${index}`);
    if (prixInput) prixInput.value = article.prix;
    updateFactTotals();
  }
}

function validerFacture() {
  document.querySelectorAll('.erreur').forEach(el => el.classList.remove('erreur'));
  const erreurs = [];
  const fc_client = $("fc_client"); if (!fc_client.value) { fc_client.classList.add('erreur'); erreurs.push("• Client"); }
  if (!fMemo.veh) erreurs.push("• Véhicule"); if (!fMemo.immat) erreurs.push("• Immatriculation");
  const fc_acompte = $("fc_acompte"); if (!fc_acompte.value || +fc_acompte.value < 0) { fc_acompte.classList.add('erreur'); erreurs.push("• Acompte"); }
  const fc_paiement = $("fc_paiement"); if (!fc_paiement.value) { fc_paiement.classList.add('erreur'); erreurs.push("• Mode de paiement"); }
  const lignes = fLignes.filter(l => l.d.trim()); const lignesMO = fLignesMO.filter(l => l.d.trim());
  if (lignes.length === 0 && lignesMO.length === 0) erreurs.push("• Au moins une pièce OU main d'œuvre");
  fLignes.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push(`• Prix manquant : ${l.d}`); });
  fLignesMO.forEach(l => { if (l.d.trim() && (!l.p || l.p <= 0)) erreurs.push(`• Coût manquant : ${l.d}`); });
    const fc_technicien = $("fc_technicien"); 
  if (!fc_technicien.value.trim()) { 
    fc_technicien.classList.add('erreur'); 
    erreurs.push("• Technicien(s) ayant intervenu"); 
  }
return erreurs;
}

function editFacture(id) {
  const fa = data.factures.find(x => x.id === id); if (!fa) return;
  if (fa.statut === "Payé") { alert("🔒 Cette facture est payée et ne peut plus être modifiée (conservation de l'historique)."); return; }
  editFactureId = id;
  fMemo = { client: fa.client_id || "", veh: fa.vehicule || "", immat: fa.immat || "", acompte: fa.acompte || "", paiement: fa.paiement || "" };
  fLignes = []; fLignesMO = [];
  if (fa.lignes && fa.lignes.length) { fa.lignes.forEach(l => { if (l.t === "Main d'œuvre") fLignesMO.push({d: l.d || "", q: 1, p: l.p || 0}); else fLignes.push({d: l.d || "", q: l.q || 1, p: l.p || 0, stock_id: l.stock_id || null}); }); }
  if (fLignes.length === 0) fLignes = [{d:"",q:1,p:0}]; if (fLignesMO.length === 0) fLignesMO = [{d:"",q:1,p:0}];
  renderFactures(document.getElementById('app'));
}

function annulerEditionFacture() {
  if (!confirm("Annuler la modification ?")) return;
  editFactureId = null; fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
  fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "" };
  renderFactures(document.getElementById('app'));
}

      <select onchange="updateStatut('${fa.id}',this.value)" style="width:auto" ${fa.statut === 'Payé' ? 'disabled title="Facture payée, statut verrouillé"' : ''}>

      <button class="s" onclick="printFacture('${fa.id}')">🖨️</button>
<button class="s" onclick="envoyerWhatsAppFacture('${fa.id}')" style="color:#25D366; border-color:#25D366;">💬</button>
      ${(peutEditer && fa.statut !== 'Payé') ? `<button class="s" onclick="editFacture('${fa.id}')" style="color:#f59e0b">✏️</button>` : ""}

async function saveFactureDirecte() {
  const erreurs = validerFacture();
  if (erreurs.length > 0) { 
    alert("⚠️ Champs manquants :\n" + erreurs.join("\n")); 
    return; 
  }
  
  const cid = $("fc_client").value;
  const clientNom = data.clients.find(c=>c.id===cid)?.nom || "Inconnu";
  const veh = fMemo.veh, immat = fMemo.immat;
  const acompte = +$("fc_acompte").value || 0; 
  const paiement = $("fc_paiement").value || "";
  const technicien = $("fc_technicien") ? $("fc_technicien").value.trim() : "";
  
  const lignes = fLignes.filter(l => l.d.trim() !== ""); 
  const lignesMO = fLignesMO.filter(l => l.d.trim() !== "");
  const toutesLesLignes = [...lignes.map(l => ({...l, t: "Pièce"})), ...lignesMO.map(l => ({...l, t: "Main d'œuvre"}))];
  const ht = factTotHT(), tv = +(data.params.tva_taux||18), tva = ht * tv / 100, ttc = ht + tva;
  
  if (editFactureId) {
    const { error } = await supa.from("factures").update({
      client_id: cid, client_nom: clientNom, vehicule: veh, immat: immat, 
      lignes: toutesLesLignes, total_ht: ht, tva, total_ttc: ttc, 
      acompte: acompte, paiement: paiement, technicien: technicien
    }).eq("id", editFactureId);
    
    if (error) { alert("Erreur : "+error.message); return; }
    editFactureId = null; 
    fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "", technicien: "" }; 
    fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
    await loadAllData(); 
    toast("Facture modifiée !"); 
    return;
  }
  
  try {
    // Récupération du dernier numéro
    const { data: toutesFactures } = await supa.from("factures").select("numero").order("numero", { ascending: false }).limit(1);
    let num = 1;
    if (toutesFactures && toutesFactures.length > 0) {
      const dernierNumero = toutesFactures[0].numero;
      const parties = dernierNumero.split("-");
      if (parties.length === 3) num = parseInt(parties[2]) + 1;
    }
    const numero = "FAC-" + new Date().getFullYear() + "-" + String(num).padStart(4,"0");
    
    const { error } = await supa.from("factures").insert({ 
      numero, client_id: cid, client_nom: clientNom, vehicule: veh, immat: immat, 
      lignes: toutesLesLignes, total_ht: ht, tva, total_ttc: ttc, acompte: acompte, 
      paiement: paiement, technicien: technicien, statut: "En attente", created_by: session.user.id 
    });
    
    if (error) { alert("Erreur : "+error.message); return; }
    
    for (const ligne of lignes) { 
      if (ligne.stock_id) { 
        const art = data.stock.find(s => s.id === ligne.stock_id); 
        if (art) await supa.from("stock").update({ qte: (+art.qte || 0) - (+ligne.q || 0) }).eq("id", art.id); 
      } 
    }
    await jlog("Création facture", numero, `Client: ${clientNom}, Technicien: ${technicien}`);
  } catch(err) { alert("Erreur : " + err.message); return; }
  
  fMemo = { client: "", veh: "", immat: "", acompte: "", paiement: "", technicien: "" }; 
  fLignes = [{d:"",q:1,p:0}]; fLignesMO = [{d:"",q:1,p:0}];
  await loadAllData(); 
  toast("Facture créée !");
}
async function updateStatut(id, st) { 
  const oldFacture = data.factures.find(fa => fa.id === id);
  await supa.from("factures").update({statut:st}).eq("id", id); 
  await jlog("Changement statut facture", oldFacture?.numero || id, `Statut changé de "${oldFacture?.statut || 'Inconnu'}" à "${st}"`);
  await loadAllData(); 
}

async function deleteFacture(id) { 
  if (profil.role !== "PDG") {
    alert("⛔ Seul le PDG peut supprimer une facture.");
    return; 
  }
  
  const fa = data.factures.find(x => x.id === id);
  if (!fa) return;

  // Double confirmation si la facture est déjà payée
  let message = `Voulez-vous vraiment supprimer la facture ${fa.numero} ?`;
  if (fa.statut === "Payé") {
    message = `⚠️ ATTENTION : Cette facture est marquée comme PAYÉE.\n\nÊtes-vous sûr de vouloir la supprimer définitivement de l'historique ?`;
  }

  if (!confirm(message)) return; 
  
  await supa.from("factures").delete().eq("id", id); 
  await jlog("Suppression facture", fa.numero, `Client: ${fa.client_nom}, Montant: ${f(fa.total_ttc)}, Statut: ${fa.statut}`);
  await loadAllData(); 
  toast("Facture supprimée.");
}

async function deleteDevis(id) { 
  if (profil.role !== "PDG") return; 
  if (!confirm("Supprimer ?")) return; 
  const d = data.devis.find(x => x.id === id);
  await supa.from("devis").delete().eq("id", id); 
  await jlog("Suppression devis", d?.numero || id, `Client: ${d?.client_nom || 'Inconnu'}, Montant: ${f(d?.total_ttc)}`);
  await loadAllData(); 
}

function printDevis(id) { const d = data.devis.find(x=>x.id===id); if (d) printDoc("DEVIS", d.numero, d); }
function printFacture(id) { const fa = data.factures.find(x=>x.id===id); if (fa) printDoc("FACTURE", fa.numero, fa); }
function envoyerWhatsAppFacture(id) {
  const fa = data.factures.find(x => x.id === id);
  if (!fa) return;
  
  const client = data.clients.find(c => c.id === fa.client_id);
  if (!client || !client.tel) {
    alert("⚠️ Ce client n'a pas de numéro de téléphone enregistré.");
    return;
  }

  // 1. Nettoyer le numéro (enlever les espaces, tirets, etc.) et ajouter l'indicatif +224 (Guinée)
  let tel = client.tel.replace(/\D/g, ''); // Garde uniquement les chiffres
  if (tel.length === 9) tel = "224" + tel; // Ajoute l'indicatif de la Guinée si c'est un numéro local
  
  // 2. Créer le message personnalisé
  const montant = f(fa.total_ttc);
  const reste = (+fa.total_ttc||0) - (+fa.acompte||0);
  let message = `Bonjour ${client.nom},\n\nVoici les détails de votre facture *${fa.numero}* chez *SPEED GARAGE PRO*.\n\n🚗 Véhicule : ${fa.vehicule} (${fa.immat})\n💰 Montant Total : ${montant}\n`;
  
  if (fa.statut === "Payé") {
    message += `✅ Statut : *PAYÉ* (Merci de votre confiance !)\n`;
  } else {
    message += `⏳ Reste à payer : ${f(reste)}\n`;
  }
  
  message += `\n📄 *Veuillez trouver votre facture en pièce jointe.*\n\nMerci de votre confiance,\nSPEED GARAGE PRO`;
  
  // 3. Télécharger automatiquement le PDF (ou ouvrir la fenêtre d'impression) pour que l'utilisateur puisse le joindre
  printFacture(id); 
  
  // 4. Ouvrir WhatsApp avec le message pré-rempli
  const url = `https://wa.me/${tel}?text=${encodeURIComponent(message)}`;
  window.open(url, '_blank');
  
  // Petit rappel pour l'utilisateur
  toast("WhatsApp ouvert. N'oubliez pas de joindre le PDF !", "info");
}

let stockCategories = { "Lubrifiants": ["Huiles", "Liquides"], "Filtres": ["Filtre à huile", "Filtre à air", "Filtre à carburant", "Filtre habitacle", "Autres"], "Freinage": ["Plaquettes", "Disques", "Mâchoires", "Liquide"], "Électricité": ["Fusibles", "Ampoules", "Cosses"], "Entretien": ["Nettoyage", "Protection", "Graisses"], "Pneumatiques": ["Valves", "Masses"], "Diesel": ["Additifs", "Nettoyants"] };
let currentStockCat = ""; let currentStockSubCat = "";

function filterStockCat() { currentStockCat = $("st_cat").value; currentStockSubCat = ""; renderStock(document.getElementById('app')); }
function filterStockSubCat() { currentStockSubCat = $("st_subcat").value; renderStock(document.getElementById('app')); }

function renderStock(A) {
  const filtered = data.stock.filter(s => { if (currentStockCat && s.categorie !== currentStockCat) return false; if (currentStockSubCat && s.sous_categorie !== currentStockSubCat) return false; return true; });
  const subCats = currentStockCat ? stockCategories[currentStockCat] || [] : [];
  A.innerHTML = `<div class="card"><b>➕ Nouvel article</b>
    <div style="display:flex; gap:8px; margin-bottom:8px"><select id="st_cat" onchange="filterStockCat()" style="flex:1"><option value="">Toutes les catégories</option>${Object.keys(stockCategories).sort().map(c => `<option value="${c}" ${c === currentStockCat ? 'selected' : ''}>${c}</option>`).join("")}</select><select id="st_subcat" onchange="filterStockSubCat()" style="flex:1" ${!currentStockCat ? 'disabled' : ''}><option value="">Toutes les sous-catégories</option>${subCats.map(sc => `<option value="${sc}" ${sc === currentStockSubCat ? 'selected' : ''}>${sc}</option>`).join("")}</select></div>
    <input id="st_nom" placeholder="Désignation"><div style="display:flex; gap:8px"><input id="st_qte" type="number" placeholder="Quantité" style="flex:1"><input id="st_min" type="number" placeholder="Seuil" style="flex:1"><input id="st_prix" type="number" placeholder="Prix (GNF)" style="flex:2"></div>
    <button class="p" onclick="addStock()">Ajouter</button></div>
    <div class="card"><input id="search_stock" placeholder="🔍 Rechercher..." value="${e(q)}" oninput="filterStock()"></div>
    <div id="liste_stock_container">${Object.keys(stockCategories).filter(c => !currentStockCat || c === currentStockCat).sort().map(cat => { const articlesCat = filtered.filter(s => s.categorie === cat && (s.nom+s.categorie+(s.sous_categorie||"")).toLowerCase().includes(q.toLowerCase())); if (articlesCat.length === 0) return ""; return `<div class="card" style="background:var(--bg); margin-bottom:8px; padding:10px"><b>📦 ${cat}</b></div>${articlesCat.map(s => `<div class="card"><div class="row" style="border-top:0"><div style="flex:1"><b>${e(s.nom)}</b>${s.sous_categorie ? `<span class="tag" style="margin-left:5px">${e(s.sous_categorie)}</span>` : ""}${+s.qte<=+s.seuil_alerte?'<span class="tag" style="background:var(--r);color:#fff">⚠️ Bas</span>':""}<br><span class="m">Qté : ${s.qte} · Seuil : ${s.seuil_alerte} · ${f(s.prix)}</span></div><div><button class="s" onclick="changeStock('${s.id}',-1)">−</button><button class="s" onclick="changeStock('${s.id}',1)">+</button><button class="s" onclick="deleteStock('${s.id}')">🗑️</button></div></div></div>`).join("")}`; }).join("") || '<div class="card m">Aucun article.</div>'}</div>`;
}

function filterStock() { const input = $("search_stock"); if (!input) return; q = input.value; renderStock(document.getElementById('app')); }
async function addStock() { const nom = $("st_nom").value.trim(); const cat = $("st_cat").value; const subcat = $("st_subcat") ? $("st_subcat").value : ""; const qte = +$("st_qte").value || 0; const min = +$("st_min").value || 0; const prix = +$("st_prix").value || 0; if (!nom || !cat) { alert("Désignation et catégorie obligatoires."); return; } await supa.from("stock").insert({ nom, categorie: cat, sous_categorie: subcat, qte, seuil_alerte: min, prix }); await jlog("Ajout stock", `[${cat}] ${nom}`, `Qté: ${qte}, Prix: ${f(prix)}`); await loadAllData(); }
async function changeStock(id, delta) { const s = data.stock.find(x=>x.id===id); if (s) { const oldQte = s.qte; const newQte = (+s.qte||0)+delta; await supa.from("stock").update({qte: newQte}).eq("id", id); await jlog("Modification stock", s.nom, `Quantité: ${oldQte} → ${newQte} (${delta > 0 ? '+' : ''}${delta})`); await loadAllData(); } }
async function deleteStock(id) { if (!confirm("Supprimer ?")) return; const s = data.stock.find(x => x.id === id); await supa.from("stock").delete().eq("id", id); await jlog("Suppression stock", s?.nom || id, `Catégorie: ${s?.categorie}`); await loadAllData(); }

async function sauverPaie(employeId) { const mois = $("paie_mois").value; if (!mois) { alert("Choisissez le mois."); return; } const base = +$("paie_base").value || 0, primes = +$("paie_primes").value || 0, avances = +$("paie_avances").value || 0; const cnss = +$("paie_cnss").value || 0, impot = +$("paie_impot").value || 0; const solde = base + primes - avances - cnss - impot; const { error } = await supa.from("paie").insert({ employe_id: employeId, mois, salaire_base: base, primes, avances, cnss, impot, solde }); if (error) { alert("Erreur : " + error.message); return; } const emp = data.employes.find(x => x.id === employeId); await jlog("Paie enregistrée", `${emp.nom} - ${mois}`, `Solde : ${f(solde)}`); employePaieId = null; await loadAllData(); alert("Paie enregistrée !"); }

async function deleteDepense(id) {
  // Vérifier les autorisations
  if (!profil || !ROLES[profil.role]?.can.deleteAny) {
    alert("⛔ Vous n'êtes pas autorisé à supprimer une dépense.");
    return;
  }

  // Vérifier l'identifiant
  if (!id) {
    alert("❌ Identifiant de dépense invalide.");
    return;
  }

  // Demander confirmation
  if (!confirm("⚠️ Voulez-vous vraiment supprimer cette dépense ?")) {
    return;
  }

  try {
    // Supprimer dans Supabase
    const { data: deleted, error } = await supa
      .from("depenses")
      .delete()
      .eq("id", id)
      .select("id");

    if (error) {
      throw error;
    }

    if (!deleted || deleted.length === 0) {
      alert("Aucune dépense supprimée. Vérifiez les autorisations.");
      return;
    }

    // Enregistrer dans le journal d'audit
    await jlog(
      "Suppression dépense",
      id,
      "Dépense supprimée par " + profil.username
    );

    // Actualiser les données
    await loadAllData();

    alert("✅ Dépense supprimée avec succès.");

  } catch (error) {
    console.error("Erreur suppression dépense :", error);
    alert("❌ Erreur : " + error.message);
  }
}

async function viderJournal() {
  if (profil.role !== "PDG") { alert("Seul le PDG peut vider le journal d'audit."); return; }
  const nb = (data.journal || []).length;
  if (nb === 0) { alert("Le journal est déjà vide."); return; }
  if (!confirm(`⚠️ ATTENTION : Vous allez supprimer DÉFINITIVEMENT les ${nb} entrée(s) du journal d'audit.\n\nCette action est irréversible. Continuer ?`)) return;
  if (!confirm("Dernière confirmation : supprimer TOUT le journal d'audit ?")) return;
  
  const btn = document.querySelector('.btn-vider-journal');
  if (btn) { btn.disabled = true; btn.textContent = "⏳ Purge en cours..."; }
  
  try {
    const { error } = await supa.from("journal").delete().neq("id", "00000000-0000-0000-0000-000000000000");
    if (error) { 
      if (btn) { btn.disabled = false; btn.textContent = "🗑️ Vider le journal"; }
      alert("Erreur lors de la suppression : " + error.message); 
      return; 
    }
    await jlog("Vidage du journal d'audit", `${nb} entrée(s) supprimée(s)`, "Action PDG");
    await loadAllData();
    if (btn) {
      btn.disabled = false;
      btn.textContent = `✅ ${nb} ligne(s) supprimée(s)`;
      setTimeout(() => { if (btn) btn.textContent = "🗑️ Vider le journal"; }, 3000);
    }
    alert("✅ Journal d'audit vidé avec succès.");
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = "🗑️ Vider le journal"; }
    alert("Erreur : " + err.message);
  }
}

function renderStats(A) {
  if (profil.role !== "PDG") { A.innerHTML = `<div class="card m">Réservé au PDG.</div>`; return; }
  const caMois = {}; let totalCa = 0;
  data.factures.filter(f => f.statut === "Payé").forEach(f => { const mois = (f.date_emission || "").slice(0,7); if (!mois) return; caMois[mois] = (caMois[mois] || 0) + (+f.total_ttc || 0); totalCa += (+f.total_ttc || 0); });
  const totalSalaires = (data.paie || []).reduce((a,p) => a + (+p.solde||0), 0);
  const totalDepenses = (data.depenses || []).reduce((a,d) => a + (+d.montant||0), 0);
  const totalFournisseurs = (data.commandes || []).reduce((a,c) => a + (+c.montant_paye||0), 0);
  const totalSorties = totalSalaires + totalDepenses + totalFournisseurs;
  const beneficeNet = totalCa - totalSorties;
  const clientStats = {}; data.factures.forEach(f => { if (f.client_nom) clientStats[f.client_nom] = (clientStats[f.client_nom] || 0) + (+f.total_ttc || 0); });
  const topClients = Object.entries(clientStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
  A.innerHTML = `<div class="card"><b style="font-size:16px">💰 Tableau de bord financier</b>

    ${estPDG ? `<div class="card"><b>💾 Sauvegarde</b><button class="p" onclick="exportAll()">📥 Exporter</button><div style="margin-top:10px; border-top:1px solid var(--b); padding-top:10px"><input type="file" id="import_file" accept=".json" style="display:none" onchange="importAll(this)"><button class="p" onclick="document.getElementById('import_file').click()" style="background:#0891b2">📤 Importer</button></div></div>` : ""}`;
}

async function saveParams() { const updates = [{cle:"nom", valeur:$("p_nom").value.trim()},{cle:"nif", valeur:$("p_nif").value.trim()},{cle:"rccm", valeur:$("p_rccm").value.trim()},{cle:"adresse", valeur:$("p_adr").value.trim()},{cle:"telephone", valeur:$("p_tel").value.trim()},{cle:"tva_taux", valeur:$("p_tva").value.trim()}]; for (const u of updates) await supa.from("parametres").update({valeur:u.valeur}).eq("cle",u.cle); await loadAllData(); alert("Enregistré !"); }
async function changerMotDePasse() { const oldPass = $("old_password").value, newPass = $("new_password").value, confirmPass = $("confirm_password").value; if (!oldPass) { alert("Ancien mot de passe requis."); return; } if (newPass.length < 8) { alert("8 caractères minimum."); return; } if (newPass !== confirmPass) { alert("Les mots de passe ne correspondent pas."); return; } const { error: loginError } = await supa.auth.signInWithPassword({ email: session.user.email, password: oldPass }); if (loginError) { alert("Ancien mot de passe incorrect."); return; } const { error } = await supa.auth.updateUser({ password: newPass }); if (error) { alert("Erreur : " + error.message); } else { alert("✅ Mot de passe mis à jour !"); $("old_password").value = ""; $("new_password").value = ""; $("confirm_password").value = ""; } }
function exportAll() { const dataStr = JSON.stringify({ exporte_le: new Date().toISOString(), clients: data.clients, vehicules: data.vehicules, devis: data.devis, factures: data.factures, stock: data.stock, employes: data.employes, paie: data.paie, depenses: data.depenses, fournisseurs: data.fournisseurs, commandes: data.commandes, journal: data.journal }, null, 1); const blob = new Blob([dataStr], {type:"application/json"}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "sauvegarde-speed-garage-" + new Date().toISOString().slice(0,10) + ".json"; a.click(); }
function importAll(input) { const file = input.files[0]; if (!file) return; if (!confirm("⚠️ Ajouter les données du fichier ?")) { input.value = ""; return; } const reader = new FileReader(); reader.onload = async (e) => { try { const json = JSON.parse(e.target.result); if (!json.clients && !json.factures) { alert("Fichier invalide."); return; } alert("Importation..."); for (const c of (json.clients || [])) { delete c.id; await supa.from("clients").insert(c); } for (const v of (json.vehicules || [])) { delete v.id; await supa.from("vehicules").insert(v); } for (const d of (json.devis || [])) { delete d.id; await supa.from("devis").insert(d); } for (const fa of (json.factures || [])) { delete fa.id; await supa.from("factures").insert(fa); } alert("✅ Importation terminée !"); await loadAllData(); } catch(err) { alert("Erreur : " + err.message); } }; reader.readAsText(file); }

function renderLogout(A) { A.innerHTML = `<div class="card"><h3>Se déconnecter</h3><button class="p" onclick="logout()">Se déconnecter</button></div>`; }

(async () => {
  showLock('<div class="loading">Chargement…</div>');
  try {
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    supa.auth.onAuthStateChange((event) => {
      if (event === "SIGNED_OUT") location.reload();
    });
    const { data: { session: s } } = await supa.auth.getSession();
    if (s) { session = s; await loadProfil(); } else showLogin();
  } catch(x) { showLock(`<div class="card" style="margin:40px auto;max-width:400px"><b>Erreur</b><p class="m">${e(x.message)}</p><button class="p" onclick="location.reload()">Réessayer</button></div>`); }
})();
</script>
