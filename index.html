--text: #f0f0f5;
--text-muted: #8a8a9a;
--text-dim: #5a5a6a;
--primary: #dc2626;
--r: #dc2626;
--primary-hover: #ef4444;
--primary-glow: rgba(220, 38, 38, 0.3);
--success: #10b981;
--success-glow: rgba(16, 185, 129, 0.3);
--warning: #f59e0b;
--info: #3b82f6;
--info-glow: rgba(59, 130, 246, 0.3);
--purple: #8b5cf6;
--shadow: 0 4px 20px rgba(0,0,0,0.4);
--shadow-lg: 0 10px 40px rgba(0,0,0,0.6);

* {

body {

color: var(--text);

font-weight: 400;
font-size: 14px;

overflow-x: hidden;
background-image:

radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
background-attachment: fixed;
min-height: 100vh;
padding-top: env(safe-area-inset-top);
padding-bottom: env(safe-area-inset-bottom);
}
header {
background: rgba(10, 10, 15, 0.85);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
color: var(--text);
padding: 14px 20px;
padding-top: calc(14px + env(safe-area-inset-top));

align-items: center;

top: 0;

align-items: center;
gap: 10px;
}
header .logo-icon {
width: 32px;
height: 32px;

align-items: center;
justify-content: center;
font-size: 16px;
box-shadow: 0 2px 8px var(--primary-glow);

header span {
flex: 1;
font-size: 15px;
letter-spacing: -0.3px;
}
header small {
font-weight: 500;
font-size: 12px;
opacity: 0.8;
display: flex;
align-items: center;
gap: 8px;
}
.tag {
font-size: 11px;
padding: 3px 10px;
border-radius: 99px;
background: var(--bg-card);
border: 1px solid var(--border);
display: inline-block;
font-weight: 600;
}
.tag.pdg { background: rgba(220, 38, 38, 0.15); color: var(--primary); border-color: rgba(220, 38, 38, 0.3); }
.tag.sec { background: rgba(59, 130, 246, 0.15); color: var(--info); border-color: rgba(59, 130, 246, 0.3); }
.tag.mkt { background: rgba(139, 92, 246, 0.15); color: var(--purple); border-color: rgba(139, 92, 246, 0.3); }
.wrap { display: flex; align-items: stretch; min-height: calc(100vh - 60px); }
nav {
display: flex;
flex-direction: column;
gap: 2px;
padding: 16px 12px;
width: 240px;
flex: none;
background: var(--bg-secondary);
border-right: 1px solid var(--border);
height: calc(100vh - 60px);
position: sticky;
top: 60px;
overflow-y: auto;
}
nav button {
text-align: left;
border: 0;
background: none;
color: var(--text-muted);
padding: 10px 12px;
border-radius: var(--radius-sm);
font: inherit;
font-size: 13px;
font-weight: 500;
cursor: pointer;
display: flex;
align-items: center;
gap: 10px;
transition: all 0.2s ease;
}
nav button:hover {
background: var(--bg-hover);
color: var(--text);
}
nav button.on {
background: linear-gradient(135deg, var(--primary), #b91c1c);
color: #fff;
font-weight: 600;
box-shadow: 0 4px 12px var(--primary-glow);
}
nav button:active:not(.on) { background: var(--bg-hover); }
.nav-icon {
width: 20px;
height: 20px;
display: inline-flex;
align-items: center;
justify-content: center;
font-size: 16px;
}
main {
flex: 1;
min-width: 0;
padding: 24px;
width: 100%;
max-width: 100%;
margin: 0;
animation: fadeIn 0.25s ease;
}
.mb {
display: none;
background: none;
border: 0;
color: var(--text);
font-size: 24px;
padding: 0;
cursor: pointer;
}
@media (max-width: 768px) {
.mb { display: inline-block; }
nav {
position: fixed;
left: 0;
top: 0;
bottom: 0;
z-index: 60;
width: 280px;
transform: translateX(-100%);
transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
box-shadow: var(--shadow-lg);
padding-top: 20px;
}
nav.open { transform: none; }
main { padding: 16px; }
.grid { grid-template-columns: 1fr 1fr; }
}
.card {
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: var(--radius);
padding: 20px;
margin-bottom: 16px;
overflow-x: auto;
transition: all 0.2s ease;
}
.card:hover {
border-color: var(--border-light);
}
.card-header {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 16px;
padding-bottom: 12px;
border-bottom: 1px solid var(--border);
}
.card-title {
font-size: 15px;
font-weight: 700;
color: var(--text);
display: flex;
align-items: center;
gap: 8px;
letter-spacing: -0.2px;
}
.grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 16px;
}
.k {
font-size: 28px;
font-weight: 800;
letter-spacing: -1px;
line-height: 1.1;
}
.m {
color: var(--text-muted);
font-size: 12px;
font-weight: 500;
}
input, select, textarea {
width: 100%;
padding: 11px 14px;
margin: 4px 0;
border: 1px solid var(--border);
border-radius: var(--radius-sm);
background: var(--bg);
color: var(--text);
font: inherit;
font-size: 13px;
transition: all 0.2s ease;
}
input:focus, select:focus, textarea:focus {
outline: none;
border-color: var(--primary);
box-shadow: 0 0 0 3px var(--primary-glow);
background: var(--bg-secondary);
}
input::placeholder, textarea::placeholder {
color: var(--text-dim);
}
label.m {
display: block;
margin-top: 8px;
margin-bottom: 4px;
font-size: 11px;
font-weight: 600;
text-transform: uppercase;
letter-spacing: 0.5px;
color: var(--text-muted);
}
button.p {
background: linear-gradient(135deg, var(--primary), #b91c1c);
color: #fff;
border: 0;
border-radius: var(--radius-sm);
padding: 12px 20px;
font: inherit;
font-weight: 700;
font-size: 13px;
margin-top: 8px;
cursor: pointer;
width: 100%;
text-transform: uppercase;
letter-spacing: 0.5px;
transition: all 0.2s ease;
box-shadow: 0 4px 12px var(--primary-glow);
}
button.p:hover {
transform: translateY(-1px);
box-shadow: 0 6px 16px var(--primary-glow);
}
button.p:active {
transform: translateY(0);
opacity: 0.9;
}
button.s {
background: var(--bg);
border: 1px solid var(--border);
color: var(--text-muted);
border-radius: 6px;
padding: 7px 12px;
font: inherit;
font-size: 12px;
cursor: pointer;
margin: 2px;
transition: all 0.2s ease;
font-weight: 500;
}
button.s:hover {
background: var(--bg-hover);
color: var(--text);
border-color: var(--border-light);
}
.row {
display: flex;
justify-content: space-between;
gap: 10px;
align-items: center;
padding: 12px 0;
border-top: 1px solid var(--border);
flex-wrap: wrap;
}
.ref {
font-family: 'SF Mono', Monaco, monospace;
font-size: 11px;
background: var(--bg);
padding: 2px 8px;
border-radius: 4px;
color: var(--text-muted);
border: 1px solid var(--border);
}
#lock {
position: fixed;
inset: 0;
z-index: 100;
background: var(--bg);
overflow: auto;
}
table {
width: 100%;
border-collapse: collapse;
margin: 8px 0;
min-width: 500px;
}
th, td {
padding: 10px 8px;
text-align: left;
border-bottom: 1px solid var(--border);
font-size: 13px;
}

font-weight: 600;
color: var(--text-muted);
font-size: 11px;

letter-spacing: 0.5px;
}
tr:hover { background: var(--bg-hover); }
.loading { text-align:center; padding:40px; color:var(--text-muted); }

/* ===== CALENDRIER STYLE CAPTURE ===== */
.calendar-container {
background: #1e1e24;
border: 1px solid #2a2a32;
border-radius: 12px;
padding: 24px;
margin-bottom: 20px;
}
.calendar-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 24px;
}
.calendar-title {
font-size: 22px;
font-weight: 800;
color: #ffffff;
letter-spacing: -0.5px;
}
.calendar-nav-btn {
background: #2a2a32;
border: 1px solid #3a3a45;
color: #ffffff;
padding: 10px 18px;
border-radius: 8px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: all 0.2s ease;
}
.calendar-nav-btn:hover {
background: #3a3a45;
border-color: #4a4a55;
}
.calendar-weekdays {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 6px;
margin-bottom: 8px;
}
.calendar-weekday {
text-align: center;
font-size: 13px;
font-weight: 600;
color: #8a8a95;
padding: 8px 0;
}
.calendar-days {
display: grid;
grid-template-columns: repeat(7, 1fr);
gap: 6px;
}
.calendar-day {
aspect-ratio: 1;
width: 100%;
padding: 6px 8px;
background: #14141a;
border: 1px solid #2a2a32;
border-radius: 6px;
cursor: pointer;
transition: all 0.15s ease;
position: relative;
display: flex;
flex-direction: column;
align-items: flex-start;
justify-content: flex-start;
}
.calendar-day:hover {
background: #1a1a22;
border-color: #3a3a45;
}
.calendar-day-number {
font-size: 15px;
font-weight: 700;
color: #ffffff;
line-height: 1;
}
.calendar-day-empty {
background: transparent;
border: none;
cursor: default;
aspect-ratio: 1;
}
.calendar-day-empty:hover {
background: transparent;
border: none;
}
.calendar-day.today {
background: #dc2626;
border-color: #dc2626;
}
.calendar-day.today .calendar-day-number {
color: #ffffff;
font-weight: 800;
}
.calendar-day.selected {
background: #2563eb;
border-color: #2563eb;
}
.calendar-day.selected .calendar-day-number {
color: #ffffff;
}
.calendar-day.has-rdv {
border-left: 3px solid #22c55e;
}
.rdv-indicator {
display: flex;
gap: 3px;
margin-top: 6px;
flex-wrap: wrap;
}
.rdv-dot {
width: 5px;
height: 5px;
border-radius: 50%;
background: #22c55e;
}
.rdv-count {
font-size: 10px;
font-weight: 600;
color: #22c55e;
margin-top: 4px;
}
.calendar-day.today .rdv-count {
color: #ffffff;
}
.calendar-day.today .rdv-dot {
background: #ffffff;
}
.rdv-form {
background: #1e1e24;
border: 1px solid #2a2a32;
border-radius: 12px;
padding: 24px;
margin-bottom: 20px;
}
.rdv-form-title {
font-size: 18px;
font-weight: 800;
color: #ffffff;
margin-bottom: 20px;
display: flex;
align-items: center;
gap: 10px;
letter-spacing: -0.3px;
}
.rdv-form-title::before {
content: '＋';
font-size: 22px;
font-weight: 700;
color: #8a8a95;
}
.form-field {
margin-bottom: 14px;
}
.form-input-dark {
width: 100%;
padding: 14px 16px;
background: #14141a;
border: 1px solid #2a2a32;
border-radius: 8px;
color: #ffffff;
font: inherit;
font-size: 14px;
transition: all 0.2s ease;
}
.form-input-dark:focus {
outline: none;
border-color: #dc2626;
background: #1a1a22;
}
.form-input-dark::placeholder {
color: #6a6a75;
}
select.form-input-dark {

background-repeat: no-repeat;
background-position: right 16px center;
padding-right: 40px;
}
.form-row-2 {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 12px;
}
.form-row-date {
display: grid;
grid-template-columns: 2fr 1fr;
gap: 12px;
}
.btn-submit-rdv {
background: #dc2626;
color: #ffffff;
border: none;
border-radius: 8px;
padding: 14px 24px;
font: inherit;
font-weight: 700;
font-size: 14px;
cursor: pointer;
width: 100%;
margin-top: 8px;
transition: all 0.2s ease;
}
.btn-submit-rdv:hover {

}
.rdv-list {

.rdv-list-title {

.rdv-item {

}
.rdv-item:hover {
background: #1a1a22;

.rdv-time-badge {

.rdv-time-hour {

.rdv-time-label {

.rdv-content {

.rdv-client-name {

font-weight: 700;
color: #ffffff;
margin-bottom: 4px;
}
.rdv-vehicle {
font-size: 12px;
color: #8a8a95;
margin-bottom: 3px;
}
.rdv-motif {
font-size: 11px;
color: #6a6a75;

.rdv-actions {
display: flex;
flex-direction: column;
gap: 4px;

.btn-icon {
background: #2a2a32;
border: 1px solid #3a3a45;
color: #8a8a95;
width: 32px;
height: 32px;
border-radius: 6px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
transition: all 0.15s ease;

.btn-icon:hover {
background: #3a3a45;
color: #ffffff;
}
.btn-icon.danger:hover {
background: #dc2626;
color: #ffffff;
border-color: #dc2626;
}
.rdv-empty {
text-align: center;
padding: 40px 20px;
color: #6a6a75;
}
@media (max-width: 768px) {
.form-row-2, .form-row-date {
grid-template-columns: 1fr;
}
.calendar-day {

padding: 6px 8px;
}
.calendar-day-number {
font-size: 13px;
}
}
::-webkit-scrollbar {
width: 8px;
height: 8px;
}
::-webkit-scrollbar-track {
background: var(--bg);
}
::-webkit-scrollbar-thumb {
background: var(--border);
border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {

}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }

}
#status-indicator {
position: fixed;
top: 70px;
right: 16px;
padding: 6px 12px;
border-radius: 20px;

}
@media (max-width: 768px) {
#mobile-overlay.active { display: block; }
}
</style>

async function doLogin() {
const email = $("lu").value.trim().toLowerCase(), pw = $("lp").value, m = $("lm");
m.textContent = "Connexion en cours...";
try {
const { data: d, error } = await supa.auth.signInWithPassword({email, password:pw});
if (error) { m.textContent = "Échec : " + error.message; return; }
session = d.session; await loadProfil();
} catch(x) { m.textContent = "Erreur réseau."; }
}

async function loadProfil() {
const { data: p, error } = await supa.from("profiles").select("*").eq("id", session.user.id).single();
if (error || !p) { showLogin("Profil introuvable."); return; }
profil = p; enterApp();
}

function enterApp() {
$("lock").style.display="none"; $("hd").style.display="flex"; $("wrap").style.display="flex";
jlog("Connexion", profil.username, ""); loadAllData(); resetIdle();
const indicator = document.createElement('div');
indicator.id = 'status-indicator';
indicator.textContent = navigator.onLine ? '🟢 En ligne' : '🔴 Hors ligne';
document.body.appendChild(indicator);
window.addEventListener('online', () => indicator.textContent = '🟢 En ligne');
window.addEventListener('offline', () => indicator.textContent = ' Hors ligne');
notifierRDVJour();
}

function logout() { if (!confirm("Se déconnecter ?")) return; supa.auth.signOut().then(()=>location.reload()); }
function resetIdle() { clearTimeout(idleT); idleT = setTimeout(()=>{ supa.auth.signOut().then(()=>location.reload()); }, 7200000); }
["click","keydown","touchstart"].forEach(ev => addEventListener(ev, () => { if(profil) resetIdle(); }));

async function loadAllData() {
const R = ROLES[profil.role];
const tasks = [
supa.from("clients").select("*").order("created_at",{ascending:false}).then(r=>data.clients=r.data||[]),
supa.from("techniciens").select("*").order("nom").then(r=>data.techs=r.data||[]),
supa.from("devis").select("*").order("created_at",{ascending:false}).then(r=>data.devis=r.data||[]),
supa.from("factures").select("*").order("created_at",{ascending:false}).then(r=>data.factures=r.data||[]),
supa.from("rdv").select("*").order("date_rdv", {ascending:true}).then(r=>data.rdv=r.data||[]),
supa.from("vehicules").select("*").then(r=>data.vehicules=r.data||[]),
supa.from("employes").select("*").order("nom").then(r=>data.employes=r.data||[]),
supa.from("paie").select("*").then(r=>data.paie=r.data||[]),
supa.from("depenses").select("*").order("date_depense", {ascending:false}).then(r=>data.depenses=r.data||[]),
supa.from("fournisseurs").select("*").order("nom").then(r=>data.fournisseurs=r.data||[]),
supa.from("commandes").select("*").order("date_commande", {ascending:false}).then(r=>data.commandes=r.data||[]),
supa.from("parametres").select("*").then(r=>{ data.params = {}; (r.data||[]).forEach(p=>data.params[p.cle]=p.valeur); })
];
if (R.can.editStock) tasks.push(supa.from("stock").select("*").order("nom").then(r=>data.stock=r.data||[]));
if (R.can.viewAudit) tasks.push(supa.from("journal").select("*").order("created_at",{ascending:false}).limit(300).then(r=>data.journal=r.data||[]));
await Promise.all(tasks); render();
}

async function addRdv() {
if (!ROLES[profil.role].can.editClients) return;
const cid = $("rd_client").value; if (!cid) { alert("Choisissez un client."); return; }
const d = $("rd_date").value; if (!d) { alert("Choisissez une date."); return; }
const client = data.clients.find(c => c.id === cid);
const clientNom = client ? client.nom : "Inconnu";
const { error } = await supa.from("rdv").insert({
client_id: cid, client_nom: clientNom,
vehicule: ($("rd_marque").value.trim() + " " + $("rd_modele").value.trim()).trim(), immat: $("rd_immat").value.trim(),
date_rdv: d, heure_rdv: $("rd_heure").value, motif: $("rd_motif").value.trim(), created_by: session.user.id
});
if (error) { alert("Erreur : "+error.message); return; }
await jlog("Nouveau RDV", cid + " le " + d, ""); await loadAllData();
}

function autoRemplirPlanning(clientId) {
if (!clientId) return;
const v = data.vehicules.find(x => x.client_id === clientId);
if (v) {
if ($("rd_marque")) $("rd_marque").value = v.marque;
if ($("rd_modele")) $("rd_modele").value = v.modele;
if ($("rd_immat")) $("rd_immat").value = v.immat;
} else {
if ($("rd_marque")) $("rd_marque").value = "";
if ($("rd_modele")) $("rd_modele").value = "";
if ($("rd_immat")) $("rd_immat").value = "";
}
}

async function deleteRdv(id) { if (!confirm("Annuler ce RDV ?")) return; await supa.from("rdv").delete().eq("id", id); await loadAllData(); }

function changerMois(delta) {
let [annee, mois] = dateCalendrier.split('-');
let d = new Date(annee, parseInt(mois) - 1 + delta, 1);
dateCalendrier = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
jourSelectionne = null; render();
}

function renderPlanning(A) {
const peutEditer = ROLES[profil.role].can.editClients;
const [annee, mois] = dateCalendrier.split('-');
const premierJour = new Date(annee, parseInt(mois)-1, 1);
const dernierJour = new Date(annee, parseInt(mois), 0);
const nbJours = dernierJour.getDate();
const jourDebut = premierJour.getDay() === 0 ? 6 : premierJour.getDay() - 1;
const nomsMois = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const nomMois = nomsMois[parseInt(mois)-1];
const joursSemaine = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"];

let htmlCalendrier = `<div class="calendar-container">
<div class="calendar-header">
<button class="calendar-nav-btn" onclick="changerMois(-1)">← Précédent</button>
<div class="calendar-title">${nomMois} ${annee}</div>
<button class="calendar-nav-btn" onclick="changerMois(1)">Suivant →</button>
</div>
<div class="calendar-weekdays">
${joursSemaine.map(j => `<div class="calendar-weekday">${j}</div>`).join("")}
</div>
<div class="calendar-days">`;

for (let i = 0; i < jourDebut; i++) htmlCalendrier += `<div class="calendar-day calendar-day-empty"></div>`;

for (let j = 1; j <= nbJours; j++) {
const dateStr = `${annee}-${mois}-${String(j).padStart(2, '0')}`;
const nbRdv = data.rdv.filter(r => r.date_rdv === dateStr).length;
const isToday = dateStr === new Date().toISOString().slice(0,10);
const isSelected = dateStr === jourSelectionne;
let classes = "calendar-day";
if (isToday) classes += " today";
if (isSelected) classes += " selected";
if (nbRdv > 0) classes += " has-rdv";
htmlCalendrier += `<div class="${classes}" onclick="jourSelectionne='${dateStr}'; render(); setTimeout(() => { const el = document.getElementById('liste_rdv'); if(el) el.scrollIntoView({ behavior: 'smooth' }); }, 150)"><div class="calendar-day-number">${j}</div>${nbRdv > 0 ? `<div class="rdv-indicator">${Array(Math.min(nbRdv, 3)).fill('<div class="rdv-dot"></div>').join("")}</div><div class="rdv-count">${nbRdv} RDV</div>` : ""}</div>`;
}
htmlCalendrier += `</div></div>`;

let formHtml = "";
if (peutEditer) {
formHtml = `<div class="rdv-form"><div class="rdv-form-title">Nouveau rendez-vous</div><div class="form-field"><select id="rd_client" class="form-input-dark" onchange="autoRemplirPlanning(this.value)"><option value="">Choisir un client…</option>${data.clients.map(c=>`<option value="${c.id}">${e(c.nom)}</option>`).join("")}</select></div><div class="form-row-2"><div class="form-field"><input id="rd_marque" placeholder="Marque" class="form-input-dark"></div><div class="form-field"><input id="rd_modele" placeholder="Modèle" class="form-input-dark"></div></div><div class="form-field"><input id="rd_immat" placeholder="Immatriculation" class="form-input-dark"></div><div class="form-row-date"><div class="form-field"><input id="rd_date" type="date" class="form-input-dark" value="${jourSelectionne || (new Date().getFullYear() + '-' + String(new Date().getMonth()+1).padStart(2, '0') + '-' + String(new Date().getDate()).padStart(2, '0'))}"></div><div class="form-field"><input id="rd_heure" type="time" class="form-input-dark"></div></div><div class="form-field"><input id="rd_motif" placeholder="Motif (ex: Vidange)" class="form-input-dark"></div><button class="btn-submit-rdv" onclick="addRdv()">Enregistrer le RDV</button></div>`;
}

let rdvsAffiches = data.rdv;
let titreRdv = "Tous les rendez-vous à venir";
if (jourSelectionne) {
rdvsAffiches = data.rdv.filter(r => r.date_rdv === jourSelectionne);
titreRdv = `Rendez-vous du ${new Date(jourSelectionne).toLocaleDateString('fr-FR')}`;
} else {
rdvsAffiches = data.rdv.filter(r => r.date_rdv >= new Date().toISOString().slice(0,10));
}
rdvsAffiches = rdvsAffiches.sort((a,b) => a.date_rdv.localeCompare(b.date_rdv) || (a.heure_rdv||"").localeCompare(b.heure_rdv||""));

let listeHtml = `<div class="rdv-list" id="liste_rdv"><div class="rdv-list-title"><span>📅 ${titreRdv}</span>${jourSelectionne ? `<button class="calendar-nav-btn" style="padding:6px 12px; font-size:12px" onclick="jourSelectionne=null; render()">Voir tout</button>` : ""}</div>${rdvsAffiches.map(r => {
const cl = data.clients.find(c => c.id === r.client_id);
const heure = (r.heure_rdv || "--:--").slice(0,5);
return `<div class="rdv-item"><div class="rdv-time-badge"><div class="rdv-time-hour">${e(heure)}</div><div class="rdv-time-label">${e(r.date_rdv ? new Date(r.date_rdv).toLocaleDateString('fr-FR', {day: '2-digit', month: 'short'}) : '')}</div></div><div class="rdv-content"><div class="rdv-client-name">${e(r.client_nom)}</div><div class="rdv-vehicle">🚗 ${e(r.vehicule || '—')} ${e(r.immat || '')}</div>${cl && cl.tel ? `<div class="rdv-vehicle">📞 ${e(cl.tel)}</div>` : ""}<div class="rdv-motif">${e(r.motif || 'Pas de motif précisé')}</div></div>${peutEditer ? `<div class="rdv-actions"><button class="btn-icon danger" onclick="deleteRdv('${r.id}')">🗑️</button></div>` : ""}</div>`;
}).join("") || `<div class="rdv-empty">Aucun rendez-vous pour cette période.</div>`}</div>`;

A.innerHTML = htmlCalendrier + formHtml + listeHtml;
}

async function definirRappel(clientId) { clientRappelId = clientId; render(); }

async function sauverRappel() {
const km = +$("rap_km").value || 0;
const dateVal = $("rap_date").value || null;
const cl = data.clients.find(c => c.id === clientRappelId);
const vehicule = data.vehicules.find(v => v.client_id === clientRappelId);
const veh = vehicule ? `${vehicule.marque} ${vehicule.modele} (${vehicule.immat})` : "";
await supa.from("clients").update({ prochain_km: km, prochaine_date: dateVal, vehicule_rappel: veh }).eq("id", clientRappelId);
await jlog("Rappel défini", `${cl.nom}`, `Km: ${km}, Date: ${dateVal}`);
clientRappelId = null; await loadAllData();
}

function envoyerRappelWhatsApp(clientId) {
const c = data.clients.find(x => x.id === clientId);
if (!c) return;
const v = data.vehicules.find(x => x.client_id === clientId);
const vehiculeInfo = v ? `${v.marque} ${v.modele} (${v.immat})` : (c.vehicule_rappel || "votre véhicule");
let msg = `Bonjour *${c.nom}*,\n\nCeci est un rappel de *SPEED GARAGE PRO* 🚗.\n`;
if (c.prochain_km > 0) msg += `📏 Votre véhicule (${vehiculeInfo}) approche ou a atteint le seuil d'entretien de ${c.prochain_km.toLocaleString('fr-FR')} km.\n`;
if (c.prochaine_date) msg += `📅 Date d'entretien recommandée : ${new Date(c.prochaine_date).toLocaleDateString('fr-FR')}.\n`;
msg += `\nSouhaitez-vous prendre rendez-vous pour l'entretien ?\nMerci de votre confiance !`;
let phone = c.tel ? c.tel.replace(/\D/g, '') : '';
if (phone.length === 9 && phone.startsWith('6')) phone = '224' + phone;
if (!phone || phone.length < 10) { alert("Numéro de téléphone invalide."); return; }
const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
window.open(url, '_blank');
}

function envoyerSMSRappel(clientId) {
const c = data.clients.find(x => x.id === clientId);
if (!c) return;
const msg = `Rappel SPEED GARAGE PRO : Votre entretien est prévu bientôt. Merci de nous contacter.`;
window.open(`sms:${c.tel}?body=${encodeURIComponent(msg)}`, '_blank');
}

async function nextRef(type) {
const prefix = type==="Société" ? "SOC" : "PART";
const { data: rows } = await supa.from("clients").select("ref").like("ref", prefix+"-%");
const max = (rows||[]).map(r => +(r.ref.split("-")[1]||0)).length ? Math.max(...(rows||[]).map(r => +(r.ref.split("-")[1]||0))) : 0;
return prefix + "-" + String(max+1).padStart(4,"0");
}

async function addClient() {
if (!ROLES[profil.role].can.editClients) { alert("Non autorisé."); return; }
const type = $("cl_type").value, nom = $("cl_nom").value.trim(), tel = $("cl_tel").value.trim(), adr = $("cl_adr").value.trim();
if (!nom) { alert("Le nom est obligatoire."); return; }
if (!/^\d{9}$/.test(tel)) { alert("Le téléphone doit contenir exactement 9 chiffres."); return; }
if (!adr) { alert("L'adresse est obligatoire."); return; }
const ref = await nextRef(type);
const { data: newClient, error } = await supa.from("clients").insert({ref, type, nom, tel, adr, contact: "", nif: "", created_by: session.user.id}).select().single();
if (error) { alert("Erreur client : "+error.message); return; }
if ($("cl_add_veh") && $("cl_add_veh").checked) {
const marque = $("v_marque").value.trim(), modele = $("v_modele").value.trim(), immat = $("v_immat").value.trim();
const carburant = $("v_carb").value, boite = $("v_boite").value, portes = +$("v_portes").value || 0, vin = $("v_vin").value.trim(), km = +$("v_km").value || 0;
if (marque && modele && immat) {
await supa.from("vehicules").insert({ client_id: newClient.id, marque, modele, immat, carburant, boite, portes, vin, kilometrage: km, created_by: session.user.id });
}
}
await jlog("Création client", `${ref} — ${nom}`, `Type: ${type}`);
await loadAllData();
}

const clientStats = {}; data.factures.forEach(fact => { if (fact.client_nom) clientStats[fact.client_nom] = (clientStats[fact.client_nom] || 0) + (+fact.total_ttc || 0); });
const topClients = Object.entries(clientStats).sort((a,b) => b[1] - a[1]).slice(0, 5);
A.innerHTML = `<div class="card" style="background: linear-gradient(135deg, var(--bg-card), rgba(16, 185, 129, 0.05));"><div class="card-header"><div class="card-title">💰 Tableau de bord financier</div></div><div class="grid" style="margin-top:12px;"><div class="card" style="border-top:4px solid var(--success); margin: 0;"><div class="m">📈 Recettes</div><div class="k" style="color:var(--success); margin-top: 8px;">${f(totalCa)}</div></div><div class="card" style="border-top:4px solid var(--r); margin: 0;"><div class="m">📉 Sorties</div><div class="k" style="color:var(--r); margin-top: 8px;">${f(totalSorties)}</div></div><div class="card" style="border-top:4px solid var(--purple); margin: 0;"><div class="m">💎 Bénéfice Net</div><div class="k" style="color:${beneficeNet >= 0 ? 'var(--success)' : 'var(--r)'}; margin-top: 8px;">${f(beneficeNet)}</div></div></div></div><div class="card"><div class="card-header"><div class="card-title">📈 CA par mois</div></div>${Object.keys(caMois).sort().reverse().map(m => `<div class="row" style="border-top:1px solid var(--border);"><span style="font-size: 13px;">${m}</span><b style="font-size: 14px; color: var(--success);">${f(caMois[m])}</b></div>`).join("") || '<div class="m" style="text-align: center; padding: 20px;">Aucune facture payée.</div>'}</div><div class="card"><div class="card-header"><div class="card-title">🔧 Top techniciens</div></div>${topTechs.map((t, i) => `<div class="row" style="border-top:1px solid var(--border);"><span style="font-size: 13px;">#${i+1} ${e(t[0])}</span><b style="font-size: 14px; color: var(--success);">${f(t[1])}</b></div>`).join("") || '<div class="m" style="text-align: center; padding: 20px;">—</div>'}</div><div class="card"><div class="card-header"><div class="card-title"> Top clients</div></div>${topClients.map((c, i) => `<div class="row" style="border-top:1px solid var(--border);"><span style="font-size: 13px;">#${i+1} ${e(c[0])}</span><b style="font-size: 14px; color: var(--success);">${f(c[1])}</b></div>`).join("") || '<div class="m" style="text-align: center; padding: 20px;">—</div>'}</div>`;
}

function renderParams(A) {
const p = data.params;
const estPDG = (profil.role === "PDG");
A.innerHTML = `${estPDG ? `<div class="card"><div class="card-header"><div class="card-title">🏢 Informations du garage</div></div><label class="m">Nom</label><input id="p_nom" class="form-input" value="${e(p.nom||"")}"><label class="m">NIF</label><input id="p_nif" class="form-input" value="${e(p.nif||"")}"><label class="m">RCCM</label><input id="p_rccm" class="form-input" value="${e(p.rccm||"")}"><label class="m">Adresse</label><input id="p_adr" class="form-input" value="${e(p.adresse||"")}"><label class="m">Téléphone</label><input id="p_tel" class="form-input" value="${e(p.telephone||"")}"><label class="m">TVA (%)</label><input id="p_tva" type="number" class="form-input" value="${e(p.tva_taux||"18")}"><button class="btn-primary" onclick="saveParams()" style="margin-top: 16px;">✓ Enregistrer</button></div>` : ""}<div class="card"><div class="card-header"><div class="card-title">🔐 Changer mon mot de passe</div></div><p class="m" style="margin-bottom: 12px;">Pour des raisons de sécurité, veuillez saisir votre ancien mot de passe.</p><input id="old_password" type="password" placeholder="Ancien mot de passe" class="form-input" style="margin-bottom: 8px;"><input id="new_password" type="password" placeholder="Nouveau mot de passe" class="form-input" style="margin-bottom: 8px;"><input id="confirm_password" type="password" placeholder="Confirmer" class="form-input" style="margin-bottom: 12px;"><button class="btn-primary" onclick="changerMotDePasse()">✓ Mettre à jour</button></div>${estPDG ? `<div class="card"><div class="card-header"><div class="card-title">💾 Sauvegarde</div></div><button class="btn-primary" onclick="exportAll()" style="margin-bottom: 12px;">📥 Exporter les données</button><div style="border-top:1px solid var(--border); padding-top:12px;"><input type="file" id="import_file" accept=".json" style="display:none" onchange="importAll(this)"><button class="btn-primary" onclick="document.getElementById('import_file').click()" style="background: linear-gradient(135deg, var(--info), #2563eb); box-shadow: 0 4px 12px var(--info-glow);">📤 Importer</button></div></div>` : ""}`;
}

async function saveParams() {
const updates = [{cle:"nom", valeur:$("p_nom").value.trim()},{cle:"nif", valeur:$("p_nif").value.trim()},{cle:"rccm", valeur:$("p_rccm").value.trim()},{cle:"adresse", valeur:$("p_adr").value.trim()},{cle:"telephone", valeur:$("p_tel").value.trim()},{cle:"tva_taux", valeur:$("p_tva").value.trim()}];
for (const u of updates) await supa.from("parametres").update({valeur:u.valeur}).eq("cle",u.cle);
await loadAllData(); alert("✅ Enregistré !");
}

async function changerMotDePasse() {
const oldPass = $("old_password").value, newPass = $("new_password").value, confirmPass = $("confirm_password").value;
if (!oldPass) { alert("Ancien mot de passe requis."); return; }
if (newPass.length < 8) { alert("8 caractères minimum."); return; }
if (newPass !== confirmPass) { alert("Les mots de passe ne correspondent pas."); return; }
const { error: loginError } = await supa.auth.signInWithPassword({ email: session.user.email, password: oldPass });
if (loginError) { alert("Ancien mot de passe incorrect."); return; }
const { error } = await supa.auth.updateUser({ password: newPass });
if (error) { alert("Erreur : " + error.message); } else { alert("✅ Mot de passe mis à jour !"); $("old_password").value = ""; $("new_password").value = ""; $("confirm_password").value = ""; }
}

function exportAll() {
const dataStr = JSON.stringify({ exporte_le: new Date().toISOString(), clients: data.clients, vehicules: data.vehicules, devis: data.devis, factures: data.factures, stock: data.stock, employes: data.employes, paie: data.paie, depenses: data.depenses, fournisseurs: data.fournisseurs, commandes: data.commandes, journal: data.journal }, null, 1);
const blob = new Blob([dataStr], {type:"application/json"});
const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
a.download = "sauvegarde-speed-garage-" + new Date().toISOString().slice(0,10) + ".json"; a.click();
}

function importAll(input) {
const file = input.files[0]; if (!file) return;
if (!confirm("⚠️ Cela va ajouter les données du fichier. Continuer ?")) { input.value = ""; return; }
const reader = new FileReader();
reader.onload = async (e) => {
try {
const json = JSON.parse(e.target.result);
if (!json.clients && !json.factures) { alert("Fichier invalide."); return; }
alert("Importation en cours...");
for (const c of (json.clients || [])) { delete c.id; await supa.from("clients").insert(c); }
for (const v of (json.vehicules || [])) { delete v.id; await supa.from("vehicules").insert(v); }
for (const d of (json.devis || [])) { delete d.id; await supa.from("devis").insert(d); }
for (const fa of (json.factures || [])) { delete fa.id; await supa.from("factures").insert(fa); }
alert("✅ Importation terminée !"); await loadAllData();
} catch(err) { alert("Erreur : " + err.message); }
};
reader.readAsText(file);
}

function renderLogout(A) { A.innerHTML = `<div class="card" style="text-align: center; padding: 40px;"><h3 style="margin: 0 0 20px 0; font-size: 20px;">Se déconnecter</h3><button class="btn-primary" onclick="logout()" style="max-width: 300px; margin: 0 auto;">🚪 Se déconnecter</button></div>`; }

function notifierRDVJour() {
const aujourdHui = new Date().toISOString().slice(0, 10);
const rdvJour = data.rdv.filter(r => r.date_rdv === aujourdHui);
if (rdvJour.length > 0) {
const liste = rdvJour.map(r => `• ${r.heure_rdv || '--:--'} - ${r.client_nom}`).join('\n');
setTimeout(() => {
alert(`📅 Vous avez ${rdvJour.length} RDV aujourd'hui :\n\n${liste}`);
}, 800);
}
}

document.addEventListener('keydown', (e) => {
if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
e.preventDefault();
const q = prompt("🔍 Rechercher (client, véhicule, facture...) :");
if (q) {
const results = [
...data.clients.filter(c => c.nom.toLowerCase().includes(q.toLowerCase())).map(c => ({type:'Client', nom:c.nom, id:c.id})),
...data.factures.filter(f => f.numero.toLowerCase().includes(q.toLowerCase())).map(f => ({type:'Facture', nom:f.numero, id:f.id}))
];
if (results.length) alert(`Résultats :\n${results.map(r => `• [${r.type}] ${r.nom}`).join('\n')}`);
else alert("Aucun résultat.");
}
}
});

(async () => {
showLock('<div class="loading">Chargement…</div>');
try {
supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const { data: { session: s } } = await supa.auth.getSession();
if (s) { session = s; await loadProfil(); } else showLogin();
} catch(x) {
showLock(`<div class="card" style="margin:40px auto;max-width:400px;"><b style="font-size: 16px;">Erreur</b><p class="m" style="margin: 12px 0;">${e(x.message)}</p><button class="btn-primary" onclick="location.reload()">Réessayer</button></div>`);
}
})();

supa && supa.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") location.reload(); });
</script>
